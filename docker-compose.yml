services:
  manager-api:
    image: ghcr.io/harrywesterman/twinbox-manager-api:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-api
    restart: unless-stopped
    environment:
      - MANAGER_DATA_DIR=/data
      - MANAGER_API_PORT=8080
      - MANAGER_API_TRUSTED_CIDRS=${MANAGER_API_TRUSTED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8}
      - WORKSPACE_ROOT=/opt/twinbox
      - TWINBOX_CLUSTER_SLUG=${TWINBOX_CLUSTER_SLUG:-}
      - TWINBOX_SECRET_BACKEND=${TWINBOX_SECRET_BACKEND:-filesystem}
      - TWINBOX_BOOTSTRAP_DIR=${TWINBOX_BOOTSTRAP_DIR:-/opt/twinbox/bootstrap}
      - TWINBOX_SECRET_ITEM_PREFIX=${TWINBOX_SECRET_ITEM_PREFIX:-twinbox}
      - TWINBOX_TIME_SERVER=${TWINBOX_TIME_SERVER:-time.cloudflare.com}
      - TWINBOX_SECRET_TEMP_DIR=${TWINBOX_SECRET_TEMP_DIR:-/tmp/twinbox-secrets}
      - TWINBOX_SECRET_CACHE_TTL_SEC=${TWINBOX_SECRET_CACHE_TTL_SEC:-60}
      - MANAGEMENT_VM_IP=${MANAGEMENT_VM_IP:-}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - PROXMOX_STORAGE_POOL=${PROXMOX_STORAGE_POOL:-local-lvm}
      - PROXMOX_FILE_DATASTORE=${PROXMOX_FILE_DATASTORE:-local}
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_PORT=${PROXMOX_PORT:-8006}
      - PROXMOX_USER=${PROXMOX_USER}
      - PROXMOX_PASSWORD=${PROXMOX_PASSWORD}
      - TALOS_IMAGE_PRESET=${TALOS_IMAGE_PRESET:-qemu-guest-agent}
      - TALOS_IMAGE_PLATFORM=${TALOS_IMAGE_PLATFORM:-cloud-server}
      - TALOS_IMAGE_ARCH=${TALOS_IMAGE_ARCH:-amd64}
    volumes:
      - /opt/twinbox/manager-data:/data
      - /opt/twinbox/bootstrap:/opt/twinbox/bootstrap
    ports:
      - "8080:8080"

  manager-worker:
    image: ghcr.io/harrywesterman/twinbox-manager-worker:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-worker
    restart: unless-stopped
    environment:
      - MANAGER_DATA_DIR=/data
      - WORKER_POLL_MS=2000
      - WORKSPACE_ROOT=/opt/twinbox
      - TWINBOX_SYNC_LOCAL_CLIENT_CONFIGS=true
      - TWINBOX_HOST_CRON_DIR=/host/etc/cron.d
      - TWINBOX_HOST_REPO_ROOT=${TWINBOX_HOST_REPO_ROOT}
      - TWINBOX_SECRET_BACKEND=${TWINBOX_SECRET_BACKEND:-filesystem}
      - TWINBOX_BOOTSTRAP_DIR=${TWINBOX_BOOTSTRAP_DIR:-/opt/twinbox/bootstrap}
      - TWINBOX_SECRET_ITEM_PREFIX=${TWINBOX_SECRET_ITEM_PREFIX:-twinbox}
      - TWINBOX_TIME_SERVER=${TWINBOX_TIME_SERVER:-time.cloudflare.com}
      - TWINBOX_SECRET_TEMP_DIR=${TWINBOX_SECRET_TEMP_DIR:-/tmp/twinbox-secrets}
      - TWINBOX_SECRET_CACHE_TTL_SEC=${TWINBOX_SECRET_CACHE_TTL_SEC:-60}
      - MANAGEMENT_VM_IP=${MANAGEMENT_VM_IP:-}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - PROXMOX_STORAGE_POOL=${PROXMOX_STORAGE_POOL:-local-lvm}
      - PROXMOX_FILE_DATASTORE=${PROXMOX_FILE_DATASTORE:-local}
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_PORT=${PROXMOX_PORT:-8006}
      - PROXMOX_USER=${PROXMOX_USER}
      - PROXMOX_PASSWORD=${PROXMOX_PASSWORD}
      - TALOS_IMAGE_PRESET=${TALOS_IMAGE_PRESET:-qemu-guest-agent}
      - TALOS_IMAGE_PLATFORM=${TALOS_IMAGE_PLATFORM:-cloud-server}
      - TALOS_IMAGE_ARCH=${TALOS_IMAGE_ARCH:-amd64}
    volumes:
      - /opt/twinbox/manager-data:/data
      - /opt/twinbox/bootstrap:/opt/twinbox/bootstrap
      - /etc/cron.d:/host/etc/cron.d
      - /home/twinbox:/home/twinbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - manager-api

  manager-web:
    image: ghcr.io/harrywesterman/twinbox-manager-web:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-web
    restart: unless-stopped
    depends_on:
      - manager-api
    ports:
      - "3000:80"

  seaweedfs:
    image: chrislusf/seaweedfs:4.31
    container_name: twinbox-seaweedfs
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=${SEAWEEDFS_ACCESS_KEY_ID:-velero}
      - AWS_SECRET_ACCESS_KEY=${SEAWEEDFS_SECRET_ACCESS_KEY:-change-me}
    command:
      - server
      - -dir=/data
      - -s3
    volumes:
      - /opt/twinbox/seaweedfs/data:/data
    ports:
      - "8333:8333"
      - "8888:8888"

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.31
    container_name: twinbox-seaweedfs-admin
    restart: unless-stopped
    command:
      - admin
      - -masters=seaweedfs:9333
      - -port=23646
    depends_on:
      - seaweedfs
    ports:
      - "23646:23646"

  beszel:
    image: henrygd/beszel:${BESZEL_VERSION:-0.18.7}
    container_name: twinbox-beszel
    restart: unless-stopped
    environment:
      - APP_URL=${BESZEL_APP_URL:-http://127.0.0.1:8090}
      - DISABLE_PASSWORD_AUTH=true
      - SHARE_ALL_SYSTEMS=true
      - USER_CREATION=true
      - USER_EMAIL=${BESZEL_USER_EMAIL:-}
      - USER_PASSWORD=${BESZEL_USER_PASSWORD:-}
    ports:
      - "8090:8090"
    volumes:
      - /opt/twinbox/beszel/data:/beszel_data
      - /opt/twinbox/beszel/socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION:-0.18.7}
    container_name: twinbox-beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/twinbox/beszel/agent-data:/var/lib/beszel-agent
      - /opt/twinbox/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://localhost:8090
      - KEY=${BESZEL_AGENT_KEY:-}
      - TOKEN=${BESZEL_AGENT_TOKEN:-}
      - SYSTEM_NAME=twinbox-management-vm
    depends_on:
      beszel:
        condition: service_healthy
