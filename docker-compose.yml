services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_IMAGE_TAG:-1.35.4}
    container_name: twinbox-vaultwarden
    restart: unless-stopped
    environment:
      - ROCKET_PORT=80
      - DOMAIN=${VAULTWARDEN_DOMAIN:-http://localhost:8222}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
    volumes:
      - ./manager-data/vaultwarden:/data
    ports:
      - "127.0.0.1:${VAULTWARDEN_LOCAL_PORT:-8222}:80"

  manager-api:
    image: ghcr.io/harrywesterman/twinbox-manager-api:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-api
    restart: unless-stopped
    environment:
      - MANAGER_DATA_DIR=/data
      - MANAGER_API_PORT=8080
      - WORKSPACE_ROOT=/opt/twinbox
      - TWINBOX_CLUSTER_SLUG=${TWINBOX_CLUSTER_SLUG:-}
      - TWINBOX_SECRET_BACKEND=${TWINBOX_SECRET_BACKEND:-vaultwarden}
      - VAULTWARDEN_SERVER_URL=${VAULTWARDEN_SERVER_URL:-http://vaultwarden:80}
      - VAULTWARDEN_VAULT_EMAIL=${VAULTWARDEN_VAULT_EMAIL:-twinbox@local}
      - VAULTWARDEN_PASSWORD_FILE=${VAULTWARDEN_PASSWORD_FILE:-/opt/twinbox/bootstrap/vaultwarden-password}
      - VAULTWARDEN_CLIENTID_FILE=${VAULTWARDEN_CLIENTID_FILE:-/opt/twinbox/bootstrap/vaultwarden-client-id}
      - VAULTWARDEN_CLIENTSECRET_FILE=${VAULTWARDEN_CLIENTSECRET_FILE:-/opt/twinbox/bootstrap/vaultwarden-client-secret}
      - VAULTWARDEN_READY_FILE=${VAULTWARDEN_READY_FILE:-/opt/twinbox/bootstrap/vaultwarden-ready}
      - VAULTWARDEN_LOCAL_PORT=${VAULTWARDEN_LOCAL_PORT:-8222}
      - BITWARDENCLI_APPDATA_DIR=${MANAGER_API_BITWARDENCLI_APPDATA_DIR:-/opt/twinbox/bootstrap/bw-runtime-api}
      - VAULTWARDEN_ITEM_PREFIX=${VAULTWARDEN_ITEM_PREFIX:-twinbox}
      - TWINBOX_SECRET_TEMP_DIR=${TWINBOX_SECRET_TEMP_DIR:-/tmp/twinbox-secrets}
      - TWINBOX_SECRET_CACHE_TTL_SEC=${TWINBOX_SECRET_CACHE_TTL_SEC:-60}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - PROXMOX_STORAGE_POOL=${PROXMOX_STORAGE_POOL:-local-lvm}
      - PROXMOX_FILE_DATASTORE=${PROXMOX_FILE_DATASTORE:-local}
      - TALOS_IMAGE_PRESET=${TALOS_IMAGE_PRESET:-qemu-guest-agent}
      - TALOS_IMAGE_PLATFORM=${TALOS_IMAGE_PLATFORM:-cloud-server}
      - TALOS_IMAGE_ARCH=${TALOS_IMAGE_ARCH:-amd64}
    volumes:
      - ./manager-data:/data
      - ./categories:/opt/twinbox/categories:ro
      - ./bootstrap:/opt/twinbox/bootstrap
    ports:
      - "8080:8080"
    depends_on:
      - vaultwarden

  manager-worker:
    image: ghcr.io/harrywesterman/twinbox-manager-worker:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-worker
    restart: unless-stopped
    environment:
      - MANAGER_DATA_DIR=/data
      - WORKER_POLL_MS=2000
      - WORKSPACE_ROOT=/opt/twinbox
      - TWINBOX_HOST_CRON_DIR=/host/etc/cron.d
      - TWINBOX_HOST_REPO_ROOT=${TWINBOX_HOST_REPO_ROOT}
      - KUBECTL_VERSION=${KUBECTL_VERSION}
      - HELM_VERSION=${HELM_VERSION}
      - TWINBOX_SECRET_BACKEND=${TWINBOX_SECRET_BACKEND:-vaultwarden}
      - VAULTWARDEN_SERVER_URL=${VAULTWARDEN_SERVER_URL:-http://vaultwarden:80}
      - VAULTWARDEN_VAULT_EMAIL=${VAULTWARDEN_VAULT_EMAIL:-twinbox@local}
      - VAULTWARDEN_PASSWORD_FILE=${VAULTWARDEN_PASSWORD_FILE:-/opt/twinbox/bootstrap/vaultwarden-password}
      - VAULTWARDEN_CLIENTID_FILE=${VAULTWARDEN_CLIENTID_FILE:-/opt/twinbox/bootstrap/vaultwarden-client-id}
      - VAULTWARDEN_CLIENTSECRET_FILE=${VAULTWARDEN_CLIENTSECRET_FILE:-/opt/twinbox/bootstrap/vaultwarden-client-secret}
      - VAULTWARDEN_READY_FILE=${VAULTWARDEN_READY_FILE:-/opt/twinbox/bootstrap/vaultwarden-ready}
      - VAULTWARDEN_LOCAL_PORT=${VAULTWARDEN_LOCAL_PORT:-8222}
      - BITWARDENCLI_APPDATA_DIR=${MANAGER_WORKER_BITWARDENCLI_APPDATA_DIR:-/opt/twinbox/bootstrap/bw-runtime-worker}
      - VAULTWARDEN_ITEM_PREFIX=${VAULTWARDEN_ITEM_PREFIX:-twinbox}
      - TWINBOX_SECRET_TEMP_DIR=${TWINBOX_SECRET_TEMP_DIR:-/tmp/twinbox-secrets}
      - TWINBOX_SECRET_CACHE_TTL_SEC=${TWINBOX_SECRET_CACHE_TTL_SEC:-60}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - PROXMOX_STORAGE_POOL=${PROXMOX_STORAGE_POOL:-local-lvm}
      - PROXMOX_FILE_DATASTORE=${PROXMOX_FILE_DATASTORE:-local}
      - TALOS_IMAGE_PRESET=${TALOS_IMAGE_PRESET:-qemu-guest-agent}
      - TALOS_IMAGE_PLATFORM=${TALOS_IMAGE_PLATFORM:-cloud-server}
      - TALOS_IMAGE_ARCH=${TALOS_IMAGE_ARCH:-amd64}
    volumes:
      - ./manager-data:/data
      - ./categories:/opt/twinbox/categories:ro
      - ./bootstrap:/opt/twinbox/bootstrap
      - /etc/cron.d:/host/etc/cron.d
      - /home/twinbox:/home/twinbox
    depends_on:
      - vaultwarden
      - manager-api

  manager-web:
    image: ghcr.io/harrywesterman/twinbox-manager-web:${TWINBOX_IMAGE_TAG:-latest}
    container_name: twinbox-manager-web
    restart: unless-stopped
    depends_on:
      - manager-api
    ports:
      - "3000:80"
