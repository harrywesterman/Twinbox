#cloud-config
#
# Twinbox Management VM Cloud-Init Configuration
#
# This file is used by the Proxmox setup wizard to initialize the Ubuntu management VM.
# You can customize this template before running the wizard.
#
# The wizard will inject dynamic values like DB_PASSWORD and SECRET_KEY.

package_update: true
package_upgrade: true
package_reboot_after_update: true

# Install required packages
packages:
  - docker.io
  - docker-compose
  - jq
  - yq
  - curl
  - git
  - net-tools
  - iputils-ping
  - dnsutils
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - tmux
  - htop
  - vim

# Create twinbox user and setup environment
runcmd:
  # Create twinbox user/group
  - [groupadd, -g, 999, twinbox]
  - [useradd, -u, 999, -g, twinbox, -m, -s, /bin/bash, twinbox]
  - [usermod, -aG, docker, twinbox]

  # Setup directory structure
  - [mkdir, -p, /opt/twinbox]
  - [mkdir, -p, /opt/twinbox/config]
  - [mkdir, -p, /opt/twinbox/logs]
  - [chown, -R, twinbox:twinbox, /opt/twinbox]

  # Clone Twinbox repository (if not already cloned)
  - [su, -, twinbox, -c, "cd /opt/twinbox && git clone https://github.com/your-org/twinbox.git || true"]

  # Setup Python virtual environment (optional)
  - [su, -, twinbox, -c, "cd /opt/twinbox && python3 -m venv venv || true"]
  - [su, -, twinbox, -c, "cd /opt/twinbox && if [ -d venv ]; then source venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt || true; fi"]

  # Create .env file if it doesn't exist and set secrets
  - [su, -, twinbox, -c, "cd /opt/twinbox && if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi"]
  - [su, -, twinbox, -c, "cd /opt/twinbox && if [ -f .env ]; then sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/g' .env; fi"]
  - [su, -, twinbox, -c, "cd /opt/twinbox && if [ -f .env ]; then sed -i 's/^SECRET_KEY=.*/SECRET_KEY=/g' .env; fi"]

  # Build and start Twinbox with docker-compose
  - [su, -, twinbox, -c, "cd /opt/twinbox && if [ -f docker-compose.yml ]; then docker-compose build && docker-compose up -d; fi"]

  # Enable and start systemd service
  - [systemctl, daemon-reload]
  - [systemctl, enable, twinbox.service]
  - [systemctl, start, twinbox.service]

  # Configure docker to start on boot (usually default)
  - [systemctl, enable, docker]
  - [systemctl, start, docker]

# Additional files to write
write_files:
  # systemd service for Twinbox
  - path: /etc/systemd/system/twinbox.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Twinbox Management Console
      Requires=docker.service
      After=docker.service
      Wants=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/docker-compose -f /opt/twinbox/docker-compose.yml up -d
      ExecStop=/usr/bin/docker-compose -f /opt/twinbox/docker-compose.yml down
      User=twinbox
      Group=twinbox
      WorkingDirectory=/opt/twinbox
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  # Proxmox credentials configuration (will be populated by wizard)
  - path: /opt/twinbox/config/proxmox-creds.yaml
    permissions: '0600'
    owner: twinbox:twinbox
    content: |
      # Proxmox API Credentials for Twinbox
      # This file is auto-generated by the setup wizard
      api_url: "{{PROXMOX_API_URL}}"
      user: "twinbox@pve"
      token: "{{PROXMOX_TOKEN}}"
      verify_ssl: {{VERIFY_SSL}}

  # Cluster name configuration (set by wizard)
  - path: /opt/twinbox/config/cluster-name
    permissions: '0644'
    owner: twinbox:twinbox
    content: |
      CLUSTER_NAME={{CLUSTER_NAME}}

  # Welcome message
  - path: /etc/motd
    permissions: '0644'
    owner: root:root
    content: |
      ==========================================
       Twinbox Management VM
      ==========================================

      Web UI: http://<this-vm-ip>:8080
      SSH: ubuntu@<this-vm-ip>

      Twinbox repository: /opt/twinbox
      Docker Compose: /opt/twinbox/docker-compose.yml

      Status: systemctl status twinbox
      Logs: journalctl -u twinbox -f

      ==========================================

# Final message
final_message: |
  ==========================================
   Twinbox Setup Complete!
  ==========================================

  Management VM is ready. The Twinbox web
  interface should be accessible shortly.

  SSH to this VM: ssh ubuntu@<this-ip>
  View status: systemctl status twinbox
  View logs: journalctl -u twinbox -f

  ==========================================
