- name: Maintain the Twinbox Management VM
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    twinbox_raw_base_url: https://raw.githubusercontent.com/harrywesterman/Twinbox/main
    twinbox_runtime_root: "{{ lookup('env', 'TWINBOX_HOST_REPO_ROOT') | default('/opt/twinbox', true) }}"
    twinbox_bootstrap_root: "{{ lookup('env', 'TWINBOX_BOOTSTRAP_DIR') | default('/opt/twinbox/bootstrap', true) }}"
    twinbox_management_time_server: "{{ lookup('env', 'TWINBOX_TIME_SERVER') | default('time.cloudflare.com', true) }}"
    twinbox_management_vm_ip: "{{ lookup('env', 'MANAGEMENT_VM_IP') | default('127.0.0.1', true) }}"
    twinbox_management_env_file: "{{ twinbox_runtime_root }}/.env"
    opkssh_version: "0.14.0"
    opkssh_sha256: "972719cb6dae736af80100fee0854fdd7289f419fc61b3dcace8409b2f043063"
    opkssh_issuer_url: "{{ lookup('env', 'OPKSSH_ISSUER_URL') | default('', true) }}"
    opkssh_client_id: "{{ lookup('env', 'OPKSSH_CLIENT_ID') | default('', true) }}"
    opkssh_principal: "{{ lookup('env', 'OPKSSH_PRINCIPAL') | default('twinbox', true) }}"
    twinbox_bootstrap_ansible_dir: "{{ twinbox_bootstrap_root }}/ansible"
    twinbox_bootstrap_config_dir: "{{ twinbox_bootstrap_root }}/config"
    twinbox_bootstrap_bin_dir: "{{ twinbox_bootstrap_root }}/bin"
    twinbox_management_packages:
      - ansible-core
      - ca-certificates
      - curl
      - gnupg
      - jq
      - openssh-server
      - python3-apt
      - software-properties-common
      - unattended-upgrades
      - ufw
      - wget
    twinbox_docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    twinbox_tool_script: "{{ twinbox_bootstrap_bin_dir }}/install-management-tools.sh"
    twinbox_pinned_defaults: "{{ twinbox_bootstrap_config_dir }}/pinned-defaults.sh"

  tasks:
    - name: Ensure management VM runtime directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ twinbox_runtime_root }}"
        - "{{ twinbox_runtime_root }}/manager-data"
        - "{{ twinbox_runtime_root }}/seaweedfs"
        - "{{ twinbox_runtime_root }}/seaweedfs/data"
        - "{{ twinbox_bootstrap_root }}"
        - "{{ twinbox_bootstrap_root }}/secrets"
        - "{{ twinbox_bootstrap_root }}/secrets/global"
        - "{{ twinbox_bootstrap_root }}/openbao"
        - "{{ twinbox_bootstrap_root }}/openbao/seal"
        - "{{ twinbox_bootstrap_root }}/openbao/init"
        - "{{ twinbox_bootstrap_ansible_dir }}"
        - "{{ twinbox_bootstrap_config_dir }}"
        - "{{ twinbox_bootstrap_bin_dir }}"

    - name: Refresh apt package metadata and patch installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure management host packages are present
      ansible.builtin.apt:
        name: "{{ twinbox_management_packages }}"
        state: present
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Configure periodic apt updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Configure unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52-twinbox-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
          Unattended-Upgrade::Automatic-Reboot-Time "02:30";

    - name: Ensure systemd-timesyncd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep SSH password authentication enabled
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-twinbox-management.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication yes
          X11Forwarding no
          AllowAgentForwarding yes
      notify: Restart ssh

    - name: Ensure opkssh user and group exist
      when: opkssh_issuer_url | length > 0 and opkssh_client_id | length > 0
      block:
        - name: Ensure opkssh group exists
          ansible.builtin.group:
            name: opksshuser
            system: true
            state: present

        - name: Ensure opkssh user exists
          ansible.builtin.user:
            name: opksshuser
            group: opksshuser
            system: true
            shell: /usr/sbin/nologin
            home: /var/lib/opksshuser
            createhome: true
            state: present

        - name: Ensure /etc/opk directory exists
          ansible.builtin.file:
            path: /etc/opk
            state: directory
            owner: root
            group: opksshuser
            mode: "0750"

        - name: Download pinned opkssh binary
          ansible.builtin.get_url:
            url: "https://github.com/openpubkey/opkssh/releases/download/v{{ opkssh_version }}/opkssh-linux-amd64"
            dest: /usr/local/bin/opkssh
            mode: "0755"
            owner: root
            group: root
            checksum: "sha256:{{ opkssh_sha256 }}"
          notify: Restart ssh

        - name: Render /etc/opk/providers
          ansible.builtin.copy:
            dest: /etc/opk/providers
            owner: root
            group: opksshuser
            mode: "0640"
            content: |
              {{ opkssh_issuer_url }} {{ opkssh_client_id }} 16h
          notify: Restart ssh

        - name: Render /etc/opk/auth_id
          ansible.builtin.copy:
            dest: /etc/opk/auth_id
            owner: root
            group: opksshuser
            mode: "0640"
            content: |
              {{ opkssh_principal }} oidc:groups:admins {{ opkssh_issuer_url }}
          notify: Restart ssh

        - name: Render opkssh sshd drop-in
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/60-opk-ssh.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              AuthorizedKeysCommand /usr/local/bin/opkssh verify %u %k %t
              AuthorizedKeysCommandUser opksshuser
          notify: Restart ssh

        - name: Run opkssh verify smoke test
          ansible.builtin.command:
            cmd: /usr/local/bin/opkssh verify --help
          changed_when: false

        - name: Run opkssh audit
          ansible.builtin.command:
            cmd: /usr/local/bin/opkssh audit
          changed_when: false

    - name: Configure management VM time synchronization
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/99-twinbox.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Time]
          NTP={{ twinbox_management_time_server }}
          FallbackNTP=
      notify: Restart timesyncd

    - name: Enable and start QEMU guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Enable and start systemd-timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        enabled: true
        state: started

    # - name: Configure fail2ban for SSH
    #   ansible.builtin.copy:
    #     dest: /etc/fail2ban/jail.d/twinbox-sshd.local
    #     owner: root
    #     group: root
    #     mode: "0644"
    #     content: |
    #       [sshd]
    #       enabled = true
    #       backend = systemd
    #       mode = aggressive
    #       maxretry = 5
    #       findtime = 10m
    #       bantime = 1h
    #   notify: Restart fail2ban

    - name: Set UFW defaults and allow management ports
      ansible.builtin.shell: |
        set -euo pipefail
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow 22/tcp
        ufw allow 3000/tcp
        ufw allow 8080/tcp
        ufw allow 8333/tcp
        ufw allow 8888/tcp
        ufw allow 23646/tcp
        ufw --force enable
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove conflicting container packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Fetch Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        filename: docker
        state: present

    - name: Install Docker CE and compose plugin
      ansible.builtin.apt:
        name: "{{ twinbox_docker_packages }}"
        state: present
        update_cache: true
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Download the pinned defaults for local tool installation
      ansible.builtin.get_url:
        url: "{{ twinbox_raw_base_url }}/config/pinned-defaults.sh"
        dest: "{{ twinbox_pinned_defaults }}"
        mode: "0644"

    - name: Download the management tool installer
      ansible.builtin.get_url:
        url: "{{ twinbox_raw_base_url }}/scripts/install-management-tools.sh"
        dest: "{{ twinbox_tool_script }}"
        mode: "0755"

    - name: Install management CLI tools
      ansible.builtin.command:
        argv:
          - "{{ twinbox_tool_script }}"
          - --env-file
          - "{{ twinbox_management_env_file }}"
      environment:
        TWINBOX_BOOTSTRAP_DIR: "{{ twinbox_bootstrap_root }}"

    - name: Ensure the SeaweedFS data directory exists
      ansible.builtin.file:
        path: "{{ twinbox_runtime_root }}/seaweedfs/data"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the management VM maintenance wrapper
      ansible.builtin.copy:
        dest: /usr/local/bin/twinbox-management-vm-maintenance
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "$(id -u)" -ne 0 ]]; then
            exec sudo -E "$0" "$@"
          fi

          if [[ -f "{{ twinbox_management_env_file }}" ]]; then
            # shellcheck disable=SC1090
            set -a
            source "{{ twinbox_management_env_file }}"
            set +a
          fi

          if [[ -f "{{ twinbox_bootstrap_ansible_dir }}/runtime.env" ]]; then
            # shellcheck disable=SC1090
            set -a
            source "{{ twinbox_bootstrap_ansible_dir }}/runtime.env"
            set +a
          fi

          exec ansible-playbook -i localhost, -c local "{{ twinbox_bootstrap_ansible_dir }}/management-vm-maintenance.yml"

    - name: Install the management VM systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/twinbox-management-maintenance.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Twinbox Management VM maintenance
          Wants=network-online.target
          After=network-online.target
          ConditionPathExists={{ twinbox_bootstrap_ansible_dir }}/management-vm-maintenance.yml

          [Service]
          Type=oneshot
          User=root
          Group=root
          ExecStart=/usr/local/bin/twinbox-management-vm-maintenance

    - name: Install the management VM systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/twinbox-management-maintenance.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run Twinbox Management VM maintenance daily

          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=1d
          RandomizedDelaySec=45min
          Persistent=true
          Unit=twinbox-management-maintenance.service

          [Install]
          WantedBy=timers.target

    - name: Reload systemd and enable the maintenance timer
      ansible.builtin.systemd:
        name: twinbox-management-maintenance.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    # - name: Restart fail2ban
    #   ansible.builtin.service:
    #     name: fail2ban
    #     state: restarted

    - name: Restart timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted
