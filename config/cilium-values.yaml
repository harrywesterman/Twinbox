ipam:
  mode: kubernetes

kubeProxyReplacement: true
# The bootstrap scripts override these values with the cluster VIP/API endpoint.
# Keep a renderable fallback here, but do not rely on localhost during bootstrap.
k8sServiceHost: localhost
k8sServicePort: 7445

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

extraConfig:
  endpoint-regen-interval: 5m0s

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
