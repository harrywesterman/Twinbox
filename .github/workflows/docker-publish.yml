name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: twinbox-manager-api
            package_name: twinbox-manager-api
            context: .
            dockerfile: ./manager-api/Dockerfile
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=ref,event=tag
              type=sha
          - image_name: twinbox-manager-worker
            package_name: twinbox-manager-worker
            context: .
            dockerfile: ./manager-worker/Dockerfile
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=ref,event=tag
              type=sha
          - image_name: twinbox-manager-web
            package_name: twinbox-manager-web
            context: ./manager-web
            dockerfile: ./manager-web/Dockerfile
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=ref,event=tag
              type=sha
          - image_name: twinbox-portal
            package_name: twinbox-portal
            context: ./portal
            dockerfile: ./portal/Dockerfile
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=raw,value=sha-${{ github.sha }},enable={{is_default_branch}}
              type=ref,event=tag
              type=sha
          - image_name: twinbox-jitsi-openid
            package_name: twinbox-manager-worker
            context: ./images/jitsi-openid
            dockerfile: ./images/jitsi-openid/Dockerfile
            tags: |
              type=raw,value=jitsi-openid-latest,enable={{is_default_branch}}
              type=ref,event=tag,prefix=jitsi-openid-
              type=sha,prefix=jitsi-openid-

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/harrywesterman/${{ matrix.package_name }}
          tags: ${{ matrix.tags }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish portal version tag to Git
        if: matrix.image_name == 'twinbox-portal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="sha-${GITHUB_SHA}"
          file="gitops/platform-apps/twinbox-portal/deployment.yaml"

          python3 - <<'PY' "$file" "$tag"
          import pathlib
          import re
          import sys

          file_path = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          source = file_path.read_text()
          updated = re.sub(
              r'(image:\s+ghcr\.io/harrywesterman/twinbox-portal:)[^\s]+',
              rf'\1{tag}',
              source,
              count=1,
          )
          if updated == source:
              raise SystemExit("portal image tag was not updated")
          file_path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --cached --quiet; then
            echo "No portal version bump to commit"
            exit 0
          fi
          git commit -m "chore: bump portal image tag [skip ci]"
          git push origin HEAD:main
