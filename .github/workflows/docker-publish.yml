name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      should_publish: ${{ steps.select.outputs.should_publish }}
      selected_images: ${{ steps.select.outputs.selected_images }}
      skipped_images: ${{ steps.select.outputs.skipped_images }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed build inputs
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/image-build-filters.yml
      - name: Select images to build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          FORCE_ALL: ${{ steps.filter.outputs.force_all || 'false' }}
          MANAGER_API_CHANGED: ${{ steps.filter.outputs.manager_api || 'false' }}
          MANAGER_WORKER_CHANGED: ${{ steps.filter.outputs.manager_worker || 'false' }}
          MANAGER_WEB_CHANGED: ${{ steps.filter.outputs.manager_web || 'false' }}
          PORTAL_CHANGED: ${{ steps.filter.outputs.portal || 'false' }}
          TWINBOX_AGENTS_CHANGED: ${{ steps.filter.outputs.twinbox_agents || 'false' }}
          JITSI_OPENID_CHANGED: ${{ steps.filter.outputs.jitsi_openid || 'false' }}
          TWINBOX_DEV_WORKSPACE_CHANGED: ${{ steps.filter.outputs.twinbox_dev_workspace || 'false' }}
        run: python3 scripts/ci/image_matrix.py

  publish:
    needs: changes
    if: needs.changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/harrywesterman/${{ matrix.package_name }}
          tags: ${{ matrix.tags }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Get primary image tag
        id: primary-tag
        run: |
          primary=$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)
          echo "tag=$primary" >> "$GITHUB_OUTPUT"

      - name: Verify Node runtime version
        if: matrix.node_runtime
        run: python3 scripts/ci/check_node_runtime.py --image "${{ steps.primary-tag.outputs.tag }}" --source "${{ matrix.dockerfile }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary-tag.outputs.tag }}
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Block fixable Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary-tag.outputs.tag }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify Jitsi broker image is publicly pullable
        if: matrix.image_name == 'twinbox-jitsi-openid' && github.ref == 'refs/heads/main'
        run: |
          image_tag="jitsi-openid-sha-${GITHUB_SHA:0:7}"
          registry_token="$(
            curl --fail --silent --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:harrywesterman/twinbox-manager-worker:pull" \
              | jq -r '.token'
          )"
          [[ -n "$registry_token" && "$registry_token" != "null" ]]
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${registry_token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/harrywesterman/twinbox-manager-worker/manifests/${image_tag}" \
            >/dev/null

      - name: Record built image
        run: |
          mkdir -p built-images
          printf '%s\n' '${{ matrix.image_name }}' > 'built-images/${{ matrix.image_name }}.txt'

      - name: Upload built image record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: built-image-${{ matrix.image_name }}
          path: built-images/${{ matrix.image_name }}.txt
          if-no-files-found: error

  summary:
    needs:
      - changes
      - publish
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download built image records
        if: needs.publish.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: built-images
          pattern: built-image-*
          merge-multiple: true

      - name: Write workflow summary
        env:
          SELECTED_IMAGES: ${{ needs.changes.outputs.selected_images }}
          SKIPPED_IMAGES: ${{ needs.changes.outputs.skipped_images }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = json.loads(os.environ["SELECTED_IMAGES"])
          skipped = json.loads(os.environ["SKIPPED_IMAGES"])
          publish_result = os.environ["PUBLISH_RESULT"]

          built_dir = Path("built-images")
          built_lookup = {
              path.stem for path in built_dir.glob("*.txt")
          } if built_dir.exists() else set()
          built = [image for image in selected if image in built_lookup]
          if publish_result == "success" and not built:
              built = selected

          lines = [
              "### Docker image publish summary",
              "",
              f"Publish job result: `{publish_result}`",
              "",
          ]

          def append_list(title, items):
              if items:
                  lines.append(f"{title}:")
                  lines.extend(f"- `{item}`" for item in items)
              else:
                  lines.append(f"{title}: none")
              lines.append("")

          append_list("Built images", built)
          if publish_result not in {"success", "skipped"}:
              pending = [image for image in selected if image not in built]
              append_list("Not built due to publish interruption", pending)
          append_list("Skipped images", skipped)

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY

  update-refs:
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ssh-key: ${{ secrets.TWINBOX_IMAGE_REFS_DEPLOY_KEY }}

      - name: Compute short SHA
        id: sha
        run: echo "short=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Refresh pinned image references
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          python3 << 'PYEOF'
          import os
          import re

          sha = os.environ['SHORT_SHA']

          replacements = {
              'gitops/platform-apps/twinbox-portal/kustomization.yaml': [
                  (r'newTag: (?:latest|sha-[0-9a-f]{7})', f'newTag: {sha}'),
              ],
              'gitops/platform-apps/twinbox-agents/kustomization.yaml': [
                  (r'newTag: (?:latest|sha-[0-9a-f]{7})', f'newTag: {sha}'),
              ],
              'gitops/platform-apps/dashy/deployment.yaml': [
                  (
                      r'ghcr\.io/harrywesterman/twinbox-manager-worker:(?:latest|sha-[0-9a-f]{7})',
                      f'ghcr.io/harrywesterman/twinbox-manager-worker:{sha}',
                  ),
              ],
              '.env.example': [
                  (r'TWINBOX_IMAGE_TAG=(?:latest|sha-[0-9a-f]{7})', f'TWINBOX_IMAGE_TAG={sha}'),
              ],
              'wizard/setup-wizard.sh': [
                  (r'TWINBOX_IMAGE_TAG="(?:latest|sha-[0-9a-f]{7})"', f'TWINBOX_IMAGE_TAG="{sha}"'),
              ],
              'scripts/manager/sync-manager-api-node-allowlist.sh': [
                  (
                      r'TWINBOX_IMAGE_TAG:-(?:latest|sha-[0-9a-f]{7})}',
                      f'TWINBOX_IMAGE_TAG:-{sha}}}',
                  ),
              ],
              'scripts/manager-web-preview.sh': [
                  (
                      r'TWINBOX_VM_PREVIEW_IMAGE_TAG:-(?:latest|sha-[0-9a-f]{7})}',
                      f'TWINBOX_VM_PREVIEW_IMAGE_TAG:-{sha}}}',
                  ),
              ],
              'docs/troubleshooting.md': [
                  (r'twinbox-manager-api:(?:latest|sha-[0-9a-f]{7})', f'twinbox-manager-api:{sha}'),
                  (r'twinbox-manager-worker:(?:latest|sha-[0-9a-f]{7})', f'twinbox-manager-worker:{sha}'),
                  (r'twinbox-manager-web:(?:latest|sha-[0-9a-f]{7})', f'twinbox-manager-web:{sha}'),
              ],
              'docs/env-reference.md': [
                  (
                      r'\| `TWINBOX_IMAGE_TAG` \| `(?:latest|sha-[0-9a-f]{7})` \|',
                      f'| `TWINBOX_IMAGE_TAG` | `{sha}` |',
                  ),
              ],
              'docs/configuration.md': [
                  (r'TWINBOX_IMAGE_TAG=(?:latest|sha-[0-9a-f]{7})', f'TWINBOX_IMAGE_TAG={sha}'),
              ],
          }

          for filepath, patterns in replacements.items():
              with open(filepath) as f:
                  content = f.read()
              for pattern, new in patterns:
                  content, count = re.subn(pattern, new, content)
                  if count:
                      print(f"  {filepath}: replaced {count} reference(s)")

              with open(filepath, 'w') as f:
                  f.write(content)

          jitsi_deployment = 'gitops/platform-apps/jitsi/auth-deployment.yaml'
          with open(jitsi_deployment) as f:
              content = f.read()
          content, replacements = re.subn(
              r'ghcr\.io/harrywesterman/twinbox-manager-worker:jitsi-openid-(?:latest|sha-[0-9a-f]{7})',
              f'ghcr.io/harrywesterman/twinbox-manager-worker:jitsi-openid-{sha}',
              content,
          )
          if replacements:
              with open(jitsi_deployment, 'w') as f:
                  f.write(content)
              print(f"  {jitsi_deployment}: refreshed Jitsi OpenID image pin")

          print("Done")

          expected = {
              '.env.example': [
                  f'TWINBOX_IMAGE_TAG={sha}',
              ],
              'wizard/setup-wizard.sh': [
                  f'TWINBOX_IMAGE_TAG="{sha}"',
              ],
              'scripts/manager/sync-manager-api-node-allowlist.sh': [
                  f'TWINBOX_IMAGE_TAG:-{sha}}}',
              ],
              'scripts/manager-web-preview.sh': [
                  f'TWINBOX_VM_PREVIEW_IMAGE_TAG:-{sha}}}',
              ],
              'docs/troubleshooting.md': [
                  f'twinbox-manager-api:{sha}',
                  f'twinbox-manager-worker:{sha}',
                  f'twinbox-manager-web:{sha}',
              ],
              'docs/env-reference.md': [
                  f'| `TWINBOX_IMAGE_TAG` | `{sha}` |',
              ],
              'docs/configuration.md': [
                  f'TWINBOX_IMAGE_TAG={sha}',
              ],
          }
          failures = []
          for filepath, needles in expected.items():
              with open(filepath) as f:
                  content = f.read()
              for needle in needles:
                  if needle not in content:
                      failures.append(f'{filepath}: missing {needle}')
          if failures:
              print('Pinned image reference validation failed:')
              for failure in failures:
                  print(f'  {failure}')
              raise SystemExit(1)
          PYEOF

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet --exit-code; then
            git config user.name "twinbox-ci"
            git config user.email "twinbox@twinbox.local"
            git add -A
            git commit -m "chore: bump image tags to ${{ steps.sha.outputs.short }} [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
                echo "main advanced during the image build; a newer run owns image references."
                exit 0
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "main moved during the push; checking again (attempt $attempt)."
            done
            echo "Could not update pinned image references after three attempts." >&2
            exit 1
          else
            echo "No changes to commit"
          fi
