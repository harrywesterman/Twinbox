name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      verify_matrix: ${{ steps.select.outputs.verify_matrix }}
      should_verify: ${{ steps.select.outputs.should_verify }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect changed image inputs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/image-build-filters.yml
      - name: Select images
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          FORCE_ALL: ${{ steps.filter.outputs.force_all || 'false' }}
          MANAGER_API_CHANGED: ${{ steps.filter.outputs.manager_api || 'false' }}
          MANAGER_WORKER_CHANGED: ${{ steps.filter.outputs.manager_worker || 'false' }}
          MANAGER_WEB_CHANGED: ${{ steps.filter.outputs.manager_web || 'false' }}
          PORTAL_CHANGED: ${{ steps.filter.outputs.portal || 'false' }}
          TWINBOX_AGENTS_CHANGED: ${{ steps.filter.outputs.twinbox_agents || 'false' }}
          JITSI_OPENID_CHANGED: ${{ steps.filter.outputs.jitsi_openid || 'false' }}
          TWINBOX_DEV_WORKSPACE_CHANGED: ${{ steps.filter.outputs.twinbox_dev_workspace || 'false' }}
          HEADWIND_NODE_CHANGED: ${{ steps.filter.outputs.headwind_node || 'false' }}
        run: python3 scripts/ci/image_matrix.py

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manager-api/package-lock.json
            manager-web/package-lock.json
            manager-worker/package-lock.json
            portal/package-lock.json
            twinbox-agents/package-lock.json
            images/twinbox-dev-workspace/dev-tools/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm ci
          npm ci --prefix manager-api
          npm ci --prefix manager-web
          npm ci --prefix manager-worker
          npm ci --prefix portal
          npm ci --prefix twinbox-agents
          npm ci --omit=dev --prefix images/twinbox-dev-workspace/dev-tools

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix manager-api
          npm audit --audit-level=high --prefix manager-web
          npm audit --audit-level=high --prefix manager-worker
          npm audit --audit-level=high --prefix portal
          npm audit --audit-level=high --prefix twinbox-agents
          npm audit --audit-level=high --prefix images/twinbox-dev-workspace/dev-tools

      - name: Lint and format check
        run: |
          npm run lint --prefix manager-api
          npm run lint --prefix manager-web
          npm run lint --prefix manager-worker
          npm run lint --prefix portal
          npm run lint --prefix twinbox-agents
          npm run lint
          npm run format:check --prefix manager-api
          npm run format:check --prefix manager-web
          npm run format:check --prefix manager-worker
          npm run format:check --prefix portal
          npm run format:check --prefix twinbox-agents
          npm run format:check
          ruff check tests/
          ruff format --check tests/

      - name: Static checks
        run: |
          bash -n wizard/setup-wizard.sh scripts/manager/create-talos-vms.sh scripts/manager/bootstrap-talos.sh scripts/manager/collect-state.sh categories/talos-cluster/steps/install-twinbox-portal/run.sh categories/talos-cluster/steps/install-twinbox-agents/run.sh categories/apps/steps/install-coder/run.sh scripts/manager/sync-twinbox-agents-config.sh scripts/manager/ensure-shared-ai-secret.sh scripts/manager/kubernetes-ai-refresh.sh images/twinbox-dev-workspace/bin/tb images/twinbox-dev-workspace/bin/twinbox-dev-startup
          python -m py_compile images/twinbox-dev-workspace/bin/twinbox-ssh-login
          node --check manager-api/src/server.js
          node --check manager-worker/src/worker.js
          node --check manager-worker/src/refresh-portal-config.mjs
          node --check portal/server.mjs
          node --check twinbox-agents/src/*.mjs

      - name: Portal build
        run: npm run build --prefix portal

      - name: Manager web build
        run: npm run build --prefix manager-web

      - name: Compose config check
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env

      - name: Runtime tests
        run: |
          node --test manager-api/test/*.mjs
          node --test manager-web/test/*.mjs
          node --test manager-worker/test/*.mjs
          node --test portal/test/*.mjs
          node --test twinbox-agents/test/*.mjs
          python -m pytest -q tests

  image-scan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.should_verify == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.verify_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build changed image
        if: matrix.dockerfile != ''
        run: docker build -f "${{ matrix.dockerfile }}" -t "twinbox-ci-${{ matrix.image_name }}:${GITHUB_SHA}" "${{ matrix.context }}"
      - name: Pull changed upstream image
        if: matrix.dockerfile == ''
        run: |
          docker pull "${{ matrix.source_ref }}"
          docker tag "${{ matrix.source_ref }}" "twinbox-ci-${{ matrix.image_name }}:${GITHUB_SHA}"
      - name: Verify Node runtime version
        if: matrix.node_runtime
        run: |
          source="${{ matrix.dockerfile }}"
          if [[ -z "$source" ]]; then source=gitops/platform-apps/headwind-mdm/values.yaml; fi
          python3 scripts/ci/check_node_runtime.py --image "twinbox-ci-${{ matrix.image_name }}:${GITHUB_SHA}" --source "$source"
      - name: Report High and Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twinbox-ci-${{ matrix.image_name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
      - name: Block fixable Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twinbox-ci-${{ matrix.image_name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  verify:
    needs: [changes, tests, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and applicable image scans
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          SHOULD_VERIFY: ${{ needs.changes.outputs.should_verify }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$TESTS_RESULT" == success ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$SHOULD_VERIFY" == true ]]; then
            [[ "$IMAGE_SCAN_RESULT" == success ]]
          else
            [[ "$IMAGE_SCAN_RESULT" == success || "$IMAGE_SCAN_RESULT" == skipped ]]
          fi
