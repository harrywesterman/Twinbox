name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: manager-api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --prefix manager-api

      - name: Static checks
        run: |
          bash -n wizard/setup-wizard.sh scripts/manager/create-talos-vms.sh scripts/manager/bootstrap-talos.sh scripts/manager/collect-state.sh
          node --check manager-api/src/server.js
          node --check manager-worker/src/worker.js

      - name: Compose config check
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env

      - name: Runtime tests
        run: python -m pytest -q tests
