name: Push Coder Template

on:
  push:
    branches:
      - main
    paths:
      - "coder/templates/**"
      - ".github/workflows/push-coder-template.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    if: secrets.CODER_MANAGEMENT_VM_SSH_KEY != '' && secrets.CODER_MANAGEMENT_VM_HOST != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.CODER_MANAGEMENT_VM_SSH_KEY }}
          known_hosts: ${{ secrets.CODER_MANAGEMENT_VM_HOST }}
          name: coder-vm-key

      - name: Push template via Management VM
        env:
          VM_HOST: ${{ secrets.CODER_MANAGEMENT_VM_HOST }}
          VM_USER: ${{ secrets.CODER_MANAGEMENT_VM_USER || 'twinbox' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "${VM_USER}@${VM_HOST}" \
            "sudo docker exec -e KUBECONFIG=/opt/twinbox/bootstrap/secrets/cluster/*/kubeconfig/kubeconfig \
              -e GITHUB_SHA=${GITHUB_SHA} \
              -e TEMPLATE_VERSION=${GITHUB_SHA:0:7} \
              twinbox-manager-worker \
              bash /opt/twinbox/scripts/manager/push-coder-template.sh"
