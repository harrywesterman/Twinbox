id: install-paperless
title: Install Paperless
type: action
journey_stage: setup
summary: Turn your paper administration into a searchable digital archive.
explanation: Paperless-ngx helps you scan, recognize, and index letters, invoices, and documents. Upload a PDF or scan, and the system reads the content so you can search it later. This keeps your administration organized and always within reach.
side_help: Perfect if you want a paperless office and need to retrieve old documents quickly.
dashy:
  items:
    - section: Platform
      title: Paperless
      description: Private document archive
      icon: fas fa-file-alt
      url_template: https://paperless.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-paperless/run.sh
