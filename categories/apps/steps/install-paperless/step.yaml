id: install-paperless
title: Install Paperless
type: action
journey_stage: setup
order: 74
summary: Install Paperless-ngx with Longhorn storage, CloudNativePG, Authentik OIDC, and Traefik routes.
explanation: Twinbox provisions Paperless-ngx as a GitOps application with persistent Longhorn document storage, Redis, Tika/Gotenberg document conversion, a dedicated CloudNativePG database, Authentik OIDC login, and Traefik routes for the selected cluster entrypoint.
side_help: Paperless-ngx turns scanned bills, letters, and PDFs into a private searchable document archive inside Twinbox.
depends_on:
  - install-longhorn-storage
  - install-cloudnativepg
  - install-secret-sync
  - install-authentik-idp
  - create-users-and-groups
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Paperless
      description: Private document archive
      icon: fas fa-file-alt
      url_template: https://paperless.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-paperless/run.sh
