id: install-audiobookshelf
title: Install Audiobookshelf
type: action
journey_stage: setup
order: 84
summary: Install Audiobookshelf with Longhorn storage, Traefik ingress, and Authentik OIDC.
explanation: Twinbox provisions Audiobookshelf as a GitOps application with a Longhorn-backed data volume, Traefik ingress, and an Authentik OIDC client so the media server gets the same SSO pattern as the rest of the platform.
side_help: Media libraries belong in the same user-services segment of the wizard, after the identity and storage foundations are in place.
depends_on:
  - install-longhorn-storage
  - install-secret-sync
  - install-authentik-idp
  - create-users-and-groups
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Audiobookshelf
      description: Personal audiobooks and podcasts
      icon: fas fa-headphones
      url_template: https://audiobookshelf.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-audiobookshelf/run.sh
