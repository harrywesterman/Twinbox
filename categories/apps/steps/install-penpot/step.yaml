id: install-penpot
title: Install Penpot
type: action
journey_stage: setup
summary: Design interfaces and prototypes with an open-source Figma alternative.
explanation: Penpot is an open-source design and prototyping platform for product teams. Create interface designs, clickable prototypes, and shared design systems in the browser, while keeping your design workspace inside your own Twinbox environment.
side_help: Useful for teams that want a self-hosted alternative to Figma for UI and UX design.
dashy:
  items:
    - section: Apps
      title: Penpot
      description: Design and prototyping
      icon: fas fa-pen-ruler
      url_template: https://penpot.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-penpot/run.sh
