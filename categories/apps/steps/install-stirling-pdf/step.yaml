id: install-stirling-pdf
title: Install Stirling PDF
type: action
journey_stage: setup
order: 75
summary: Install Stirling PDF with Longhorn storage for uploads and Traefik routes.
explanation: Twinbox provisions Stirling PDF as a GitOps application with persistent Longhorn storage for uploaded documents, an OpenBao-managed API key, and Traefik routes for the selected cluster entrypoint.
side_help: PDF tools sit with the lightweight user apps so they can be installed after document archives and before search tools.
depends_on:
  - install-longhorn-storage
  - install-secret-sync
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Stirling PDF
      description: PDF manipulation suite
      icon: fas fa-file-pdf
      url_template: https://stirling-pdf.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-stirling-pdf/run.sh
