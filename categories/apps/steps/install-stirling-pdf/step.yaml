id: install-stirling-pdf
title: Install Stirling PDF
type: action
journey_stage: setup
summary: Edit, split, and convert PDF files in your browser.
explanation: Stirling PDF is a complete online toolkit for PDF manipulation. Merge documents, split pages, rotate, compress, or add watermarks — all through a simple web interface. Your files stay on your own server, so you never have to upload anything to external services.
side_help: Practical for anyone who works with PDFs regularly and values the security of self-hosting.
dashy:
  items:
    - section: Platform
      title: Stirling PDF
      description: PDF manipulation suite
      icon: fas fa-file-pdf
      url_template: https://stirling-pdf.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-stirling-pdf/run.sh
