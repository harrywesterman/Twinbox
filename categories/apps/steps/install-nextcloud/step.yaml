id: install-nextcloud
title: Install Nextcloud
type: action
journey_stage: setup
summary: Your own private cloud for files, calendars, and collaboration.
explanation: Nextcloud is a comprehensive platform for file storage, sync, and teamwork. Store documents securely, share folders with colleagues, manage shared calendars, and use built-in chat and video calls. Everything runs on your own infrastructure, giving you full control over your data.
side_help: The central hub for teams that want to share files and collaborate without relying on public cloud providers.
dashy:
  items:
    - section: Platform
      title: Nextcloud
      description: Files, sync, and collaboration
      icon: fas fa-cloud
      url_template: https://nextcloud.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-nextcloud/run.sh
