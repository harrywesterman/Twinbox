id: install-nextcloud
title: Install Nextcloud
type: action
journey_stage: setup
order: 68
summary: Install Nextcloud with Longhorn storage, CloudNativePG, and native OIDC.
explanation: Twinbox provisions Nextcloud as a GitOps application with Longhorn-backed storage, a dedicated CloudNativePG database, a standalone Redis cache, Traefik routes for the selected ingress path, and an Authentik OIDC provider so the same identity layer backs the rest of the app stack.
side_help: Nextcloud is the collaboration hub for user files and sync.
depends_on: []
dashy:
  items:
    - section: Platform
      title: Nextcloud
      description: Files, sync, and collaboration
      icon: fas fa-cloud
      url_template: https://nextcloud.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-nextcloud/run.sh
