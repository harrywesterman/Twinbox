id: install-freshrss
title: Install FreshRSS
type: action
journey_stage: setup
order: 86
summary: Keep all your news feeds and blogs in one place.
explanation: FreshRSS is a lightweight, self-hosted feed reader. Add your favorite websites, blogs, and news sources and stay up to date without visiting each site individually. Read everything in a clean timeline, with read-later and star features to organize articles.
side_help: Perfect if you want more control over the sources you follow and prefer to avoid newsletters or algorithmic timelines.
depends_on: []
dashy:
  items:
    - section: Apps
      title: FreshRSS
      description: Feed reader and inbox
      icon: fas fa-rss
      url_template: https://freshrss.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-freshrss/run.sh
