id: install-freshrss
title: Install FreshRSS
type: action
journey_stage: setup
order: 86
summary: Install FreshRSS with persistent storage and a Traefik route.
explanation: Twinbox provisions FreshRSS as a small self-hosted feed reader backed by Longhorn storage and exposed through Traefik on the selected cluster domain.
side_help: Feed readers stay in the app rollout after the core management tools.
depends_on: []
dashy:
  items:
    - section: Apps
      title: FreshRSS
      description: Feed reader and inbox
      icon: fas fa-rss
      url_template: https://freshrss.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-freshrss/run.sh
