id: install-garage
title: Install Garage S3
type: action
journey_stage: setup
order: 65
summary: Install Garage S3-compatible object storage for Nextcloud primary storage.
explanation: Twinbox installs Garage as a lightweight S3-compatible object storage server. Garage provides the storage backend for Nextcloud's primary file storage, enabling multi-replica deployments without requiring shared filesystem storage.
side_help: Garage is a lightweight S3-compatible object storage designed for self-hosting.
depends_on:
  - install-longhorn
inputs:
  - name: storage_size
    type: string
    default: 50Gi
    description: Storage size for Garage data volume
  - name: s3_port
    type: number
    default: 8000
    description: S3 API port
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-garage/run.sh