id: install-n8n
title: Install N8N
type: action
journey_stage: setup
summary: Automate tasks and connect your favorite apps together.
explanation: "n8n is a visual workflow automation tool. Build automation chains with a drag-and-drop interface: from moving files and sending notifications to syncing data between different services. You decide which steps are executed in sequence."
side_help: Save time by automating repetitive tasks and connecting your services in smart ways.
dashy:
  items:
    - section: Apps
      title: n8n
      description: Workflow automation
      icon: fas fa-diagram-project
      url_template: https://n8n.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-n8n/run.sh
