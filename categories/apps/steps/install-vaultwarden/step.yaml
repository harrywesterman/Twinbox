id: install-vaultwarden
title: Install Vaultwarden
type: action
journey_stage: setup
order: 82
summary: Manage all your passwords securely in one central place.
explanation: Vaultwarden is a lightweight password manager that lets you store and sync all your login credentials securely. Use browser extensions and mobile apps to auto-fill everywhere. Everything is encrypted and only you hold the key.
side_help: "Essential for a secure online workflow: unique, strong passwords for all your accounts without having to remember them."
depends_on:
  - install-longhorn-storage
  - install-cloudnativepg
  - install-secret-sync
  - choose-ingress-route
  - install-authentik-idp
dashy:
  items:
    - section: Platform
      title: Vaultwarden
      description: Password manager
      icon: fas fa-key
      url_template: https://vaultwarden.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-vaultwarden/run.sh
