id: install-searxng
title: Install SearXNG
type: action
journey_stage: setup
summary: Search the web privately through your own meta-search engine.
explanation: SearXNG combines search results from multiple sources into one clean overview. Your queries are not stored or profiled, so you can explore the web anonymously and without a filter bubble. You can choose which search engines are used.
side_help: Useful if you value privacy when searching the web and want to avoid tracking.
dashy:
  items:
    - section: Apps
      title: SearXNG
      description: Private metasearch
      icon: fas fa-search
      url_template: https://searxng.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-searxng/run.sh
