id: install-immich
title: Install Immich
type: action
journey_stage: setup
order: 70
summary: Install Immich with Longhorn storage, CloudNativePG, and Authentik OIDC.
explanation: Twinbox provisions Immich as a GitOps application with a Longhorn-backed library volume, a dedicated CloudNativePG database, Authentik OIDC login, and Traefik routes for the selected ingress path. The bootstrap also makes the first Twinbox user an Immich admin through the Authentik admins group and auto-launches OIDC so the initial registration screen is skipped.
side_help: Immich is grouped with the other user services after OpenCloud so the photo stack lands after the collaboration suite and the login flow stays aligned with the rest of the app stack. The first Twinbox user is promoted to Immich admin automatically.
depends_on:
  - install-opencloud
  - install-longhorn-storage
  - install-cloudnativepg
  - install-secret-sync
  - install-authentik-idp
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Immich
      description: Photo and video library
      icon: fas fa-images
      url_template: https://immich.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-immich/run.sh
