id: install-immich
title: Install Immich
type: action
journey_stage: setup
order: 70
summary: Back up your phone photos and videos privately.
explanation: Immich is your personal photo library for Twinbox. Install the mobile app on your iPhone or Android phone, and it can automatically sync your photos and videos so everything stays safely in one place. It feels like Google Photos, but it runs on your own Twinbox setup.
side_help: Immich is the easiest way to keep your camera roll backed up and organized without handing your photos over to a big cloud provider.
depends_on:
  - install-longhorn-storage
  - install-cloudnativepg
  - install-secret-sync
  - install-authentik-idp
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Immich
      description: Photo and video library
      icon: fas fa-images
      url_template: https://immich.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-immich/run.sh
