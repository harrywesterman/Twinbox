id: install-immich
title: Install Immich
type: action
journey_stage: setup
summary: Back up your photos and videos privately on your own server.
explanation: Immich is your personal photo library. Install the mobile app on your phone and your photos and videos will be synced automatically. You get a clean timeline, albums, and search features — just like big cloud services, but fully under your own control.
side_help: The easiest way to safely back up your entire camera roll without handing your memories over to external parties.
dashy:
  items:
    - section: Platform
      title: Immich
      description: Photo and video library
      icon: fas fa-images
      url_template: https://immich.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-immich/run.sh
