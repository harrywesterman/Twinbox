id: install-hedgedoc
title: Install HedgeDoc
type: action
journey_stage: setup
summary: Write and edit notes together in Markdown, in real time.
explanation: HedgeDoc is a collaborative Markdown editor. Create a note, share the link, and edit simultaneously with multiple people in the browser. You see a live preview of your formatted text, making it ideal for documentation, meeting notes, and quick ideas.
side_help: Great for teams that need to draft shared documents quickly without the complexity of a full office suite.
dashy:
  items:
    - section: Apps
      title: HedgeDoc
      description: Collaborative markdown editor
      icon: fas fa-pen-nib
      url_template: https://hedgedoc.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-hedgedoc/run.sh
