id: install-opencloud
title: Install OpenCloud
type: action
journey_stage: setup
order: 69
summary: Install OpenCloud with LDAP, Authentik OIDC, Collabora, Tika, and Radicale.
explanation: Twinbox provisions OpenCloud as a GitOps application stack with persistent Longhorn storage, an embedded OpenLDAP directory, Authentik OIDC clients for web and native apps, Collabora document editing, Apache Tika search, and Radicale calendar and contacts services. The step keeps all OpenCloud bootstrap secrets in OpenBao so reruns stay idempotent.
side_help: OpenCloud sits between the Nextcloud placeholder and the rest of the user apps so the collaboration suite lands after the core platform pieces and before Immich and the other user-facing tools.
depends_on:
  - install-longhorn-storage
  - install-secret-sync
  - install-authentik-idp
  - create-users-and-groups
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: OpenCloud
      description: Files, collaboration, calendar, and contacts
      icon: fas fa-cloud
      url_template: https://opencloud.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-opencloud/run.sh
