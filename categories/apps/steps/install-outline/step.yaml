id: install-outline
title: Install Outline
type: action
journey_stage: setup
summary: Build a shared knowledge base for your team.
explanation: Outline is a modern wiki and knowledge base where your team can create and maintain documentation, guides, and processes. With a clean editor, access control, and search, you ensure knowledge is always findable and never lost in email or chat.
side_help: Essential for teams that want to build and share structured documentation.
dashy:
  items:
    - section: Platform
      title: Outline
      description: Team knowledge base
      icon: fas fa-book-open
      url_template: https://outline.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-outline/run.sh
