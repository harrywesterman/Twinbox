id: twinbox-desktop
title: Twinbox Desktop
summary: A sovereign desktop workspace bundle with knowledge management, communication, document processing, media, and search tools.
iconUrl: /assets/step-icons/install-outline.svg
iconAlt: Twinbox Desktop icon
description: >
  Twinbox Desktop provides a complete sovereign workspace running on your own infrastructure.
  It bundles knowledge management, team communication, document processing, media management,
  and privacy-respecting search into a single installable package.


  Every app in this bundle is deployed through Argo CD GitOps, giving you full control over
  updates, configuration, and data ownership. No external cloud dependencies — everything
  stays inside your Twinbox Kubernetes cluster, behind your own ingress and authentication.


  **Whats included**

  **Outline** — A fast, collaborative knowledge base for your team wiki and documentation.

  **Mailu** — Self-hosted email with webmail, admin UI, and your own SMTP edge on the bastion.

  **Zulip** — Threaded team chat with powerful topic-based organisation.

  **Jitsi** — Private video conferencing with screen sharing, no accounts needed.

  **Immich** — Self-hosted photo and video management with automatic backup from your phone.

  **SearXNG** — Privacy-respecting metasearch engine that aggregates results without tracking.

  **Pixelfed** — Federated image sharing, a privacy-first alternative to Instagram.

  **Stirling PDF** — PDF manipulation and editing tools with a clean web UI.

  **Karakeep** — Save and organise interesting links, articles, and ideas into your own searchable knowledge archive.

  **Mastodon** — A federated social network you own, with your own identity and moderation.

  **Matrix** — End-to-end encrypted federated chat with the Element Server Suite.

  **Nextcloud** — Self-hosted file sync and collaboration with online office tools.
