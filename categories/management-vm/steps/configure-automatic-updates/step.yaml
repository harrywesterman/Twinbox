id: configure-automatic-updates
title: Configure Management VM maintenance
type: config
journey_stage: manage
order: 10
summary: Keep the Ubuntu Management VM patched, hardened, and time-synced on a nightly schedule.
explanation: Save the host maintenance schedule and apply a managed cron entry on the Management VM host. The job patches Ubuntu, applies baseline hardening, keeps SSH password authentication enabled, and pins system time to the configured NTP server.
side_help: Twinbox writes one guarded cron file for this step and can remove it again when the setting is disabled. It does not update the Twinbox checkout.
depends_on: []
inputs:
  - id: enabled
    label: Enable nightly maintenance
    type: boolean
    required: true
    default: true
    help: Run the Management VM maintenance job each day.
  - id: schedule_hour
    label: Hour
    type: integer
    required: true
    min: 0
    max: 23
    default: 3
    help: 24-hour clock hour for the nightly maintenance job.
  - id: schedule_minute
    label: Minute
    type: integer
    required: true
    min: 0
    max: 59
    default: 17
    help: Minute offset within the selected hour.
runner:
  kind: script
  script: categories/management-vm/steps/configure-automatic-updates/apply.sh
