id: install-jitsi
title: Install Jitsi
type: action
journey_stage: setup
order: 88
summary: Install Jitsi Meet with Authentik-backed host login and guest access.
explanation: Twinbox provisions Jitsi Meet as a GitOps application with native JWT auth, an Authentik-backed Jitsi OpenID broker, Traefik routes for the web UI and login broker, and direct worker-node media transport for meetings.
side_help: Video meetings stay in the collaboration app rollout after the other personal tools.
depends_on:
  - install-freshrss
dashy:
  items:
    - section: Apps
      title: Jitsi
      description: Secure video meetings
      icon: fas fa-video
      url_template: https://jitsi.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/apps/steps/install-jitsi/run.sh
