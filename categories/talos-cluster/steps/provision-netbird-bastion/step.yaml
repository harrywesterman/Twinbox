id: provision-netbird-bastion
title: Deploy NetBird Bastion Host
type: action
journey_stage: setup
summary: Provision a self-hosted NetBird VPS on Hetzner Cloud.
explanation: >
  This step provisions a Hetzner Cloud VM running self-hosted NetBird with the
  combined NetBird server, dashboard, built-in Traefik, and NetBird Reverse Proxy.
  The VPS becomes the public frontend for NetBird and for proxying selected
  Twinbox services back to the Kubernetes cluster through NetBird routing peers.
side_help: >
  You need a Hetzner Cloud API token. Twinbox uses the DNS provider configured
  earlier to create netbird and proxy DNS records pointing at the new VPS.
  Twinbox automatically sets up the first NetBird admin account and generates
  a Personal Access Token for the next step.
ingress_route: netbird
inputs:
  - id: hcloud_token
    label: Hetzner API Token
    type: string
    required: true
    help: Your Hetzner Cloud API token. Create one at https://console.hetzner.cloud/
  - id: hcloud_location
    label: Server Location
    type: string
    required: false
    default: fsn1
    help: "Datacenter location: fsn1 (Falkenstein), nbg1 (Nürnberg), or hel1 (Helsinki)"
  - id: hcloud_server_type
    label: Server Type
    type: string
    required: false
    default: cax11
    help: "Server size: cax11 (ARM64, 2vCPU/4GB), cx22 (x86, 2vCPU/4GB)"
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/provision-netbird-bastion/run.sh
