id: install-management-consoles
title: Install Management consoles
type: action
journey_stage: setup
summary: Publish the operator web consoles and wire them into Authentik after the portal and Dashy are online.
explanation: Twinbox groups the operator consoles directly after the user portal and legacy admin launcher so the Traefik, Longhorn, Proxmox, and SeaweedFS web UIs can be published, registered as Authentik proxy applications, and protected with the shared admin policy in the same post-ingress operator phase.
side_help: Management consoles are grouped as a dedicated phase so the wizard can keep operator tools separate from core infra.
dashy:
  items:
    - section: Platform
      title: Proxmox
      description: Virtualization host
      icon: si-proxmox
      url_template: https://proxmox.__ZONE_NAME__
    - section: Platform
      title: Web Wizard
      description: Cluster setup wizard
      icon: install-web-wizard
      url_template: https://webwizard.__ZONE_NAME__
    - section: Platform
      title: Forgejo
      description: Local GitOps promotion gate
      icon: forgejo
      url_template: https://forgejo.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-management-consoles/run.sh
