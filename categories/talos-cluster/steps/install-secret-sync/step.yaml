id: install-secret-sync
title: Install OpenBao and sync bootstrap secrets
type: action
journey_stage: setup
order: 20
summary: Install External Secrets Operator and OpenBao on Longhorn, seed the first cluster secrets, and materialize the Proxmox bootstrap Secret.
explanation: Twinbox installs External Secrets Operator, seeds management-local bootstrap JSON into OpenBao, deploys OpenBao with static auto-unseal on Longhorn, creates a ClusterSecretStore named openbao, and applies the first ExternalSecret for the Proxmox bootstrap secret.
side_help: OpenBao is the source of truth for cluster runtime secrets, while Kubernetes Secrets remain derived artifacts synced through External Secrets Operator.
depends_on:
  - install-longhorn-storage
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-secret-sync/run.sh
