id: install-secret-sync
title: Install OpenBao and sync bootstrap secrets
type: action
journey_stage: setup
summary: Install External Secrets Operator and OpenBao on Longhorn, seed the first cluster secrets, and materialize the Proxmox bootstrap Secret.
explanation: Twinbox installs External Secrets Operator, seeds management-local bootstrap JSON into OpenBao, deploys OpenBao with static auto-unseal on Longhorn, creates a ClusterSecretStore named openbao, syncs SeaweedFS/Velero credentials for backup consumers, and applies the first ExternalSecret for the Proxmox bootstrap secret.
side_help: OpenBao is an open-source secrets management platform for securely storing, controlling, and accessing sensitive data like passwords, API keys, and certificates.
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-secret-sync/run.sh
