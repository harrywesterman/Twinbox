id: configure-cloudflare-tunnel
title: Configure Cloudflare Tunnel
type: action
journey_stage: setup
order: 26
summary: Expose services through a Cloudflare Tunnel (cloudflared).
explanation: >
  This step creates or reuses the Cloudflare tunnel, asks Cloudflare for a
  tunnel token, and creates a DNSEndpoint for the CNAME record (external-dns
  handles the actual DNS record). On Cloudflare Free, Twinbox only shows this
  step for prd clusters. The DNS provider was already set up in the Configure
  DNS step before this.
side_help: >
  Create one Cloudflare custom API token for Twinbox:
  1. Open Cloudflare Dashboard → My Profile → API Tokens → Create Token → Create Custom Token.
  2. Add one permission:
     - Account → Cloudflare Tunnel → Edit
  3. Scope the token to your Cloudflare account.
  4. Copy that single token into Twinbox.
  5. The DNS provider was already configured separately in the Configure DNS
     step (requires Zone → DNS → Edit).
  6. This step is only available for prd clusters on Cloudflare Free.
  Cloudflare Tunnel requires no public IP or port forwarding.
depends_on:
  - install-secret-sync
  - choose-ingress-route
  - configure-dns
ingress_route: cloudflare-tunnel
inputs:
  - id: cf_api_token
    label: Cloudflare API Token
    type: string
    required: true
    help: >
      One Cloudflare custom token with Account → Cloudflare Tunnel → Edit and
      Zone → DNS → Edit, scoped to the selected account and zone.
  - id: cf_account_id
    label: Cloudflare Account ID
    type: string
    required: true
    help: Your Cloudflare Account ID, found in the right sidebar of the dashboard
  - id: cf_zone_id
    label: Cloudflare Zone ID
    type: string
    required: true
    help: Your Cloudflare Zone ID, found in the Overview tab of the zone Twinbox will manage. This step is only shown for prd clusters on Cloudflare Free.
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/configure-cloudflare-tunnel/run.sh
