id: install-dashy-dashboard
title: Install Dashy dashboard
type: action
journey_stage: setup
order: 46
summary: Install Dashy as the cluster start page and configure Authentik OIDC.
explanation: Twinbox provisions Dashy as the cluster start page through GitOps, configures native OIDC against Authentik with an OpenTofu bootstrap flow, and exposes the dashboard through Traefik at the start page hostname.
side_help: Dashy gives the cluster a branded start page that can be extended with app links and widgets.
depends_on:
  - install-secret-sync
  - install-authentik-idp
  - choose-ingress-route
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-dashy-dashboard/run.sh
