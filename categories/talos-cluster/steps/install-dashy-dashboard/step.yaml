id: install-dashy-dashboard
title: Install Dashy dashboard
type: action
journey_stage: setup
summary: Install Dashy as the legacy admin launcher and configure Authentik OIDC.
explanation: Twinbox provisions Dashy through a GitOps-managed Argo CD ApplicationSet, configures native OIDC against Authentik with an OpenTofu bootstrap flow, and exposes the dashboard through Traefik at the admin hostname.
side_help: Dashy gives admins a branded fallback launcher for operator tools while the user portal becomes the default front door.
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-dashy-dashboard/run.sh
