id: install-grafana
title: Install Grafana
type: action
journey_stage: setup
order: 54
summary: Apply the Grafana GitOps application after wiring Authentik OIDC and syncing the Grafana OIDC secret through OpenBao.
explanation: Twinbox provisions a dedicated Authentik OIDC client for Grafana, stores only the technical client credentials in OpenBao, waits for the Grafana OIDC ExternalSecret to become ready, and then applies the Grafana Argo CD application. The step is intended to run after the Prometheus stack so the dashboard can point at a live metrics backend. It waits for Argo CD health before continuing.
side_help: Grafana is an open-source observability platform for visualizing, querying, and alerting on metrics, logs, and traces.
depends_on:
  - install-prometheus
  - install-cloudnativepg
  - install-secret-sync
  - install-authentik-idp
dashy:
  items:
    - section: Platform
      title: Grafana
      description: Metrics and dashboards
      icon: fas fa-chart-area
      url_template: https://grafana.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-grafana/run.sh
