id: install-grafana
title: Install Grafana
type: action
journey_stage: setup
order: 38
summary: Apply the Grafana GitOps application after seeding the admin secret in OpenBao.
explanation: Twinbox prepares the Grafana bootstrap secret in OpenBao and then applies one Argo CD application that combines the ExternalSecret, Grafana chart, and ingress routes. The step waits for Argo CD health before continuing.
side_help: Grafana is an open-source observability platform for visualizing, querying, and alerting on metrics, logs, and traces.
depends_on:
  - install-headlamp
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-grafana/run.sh
