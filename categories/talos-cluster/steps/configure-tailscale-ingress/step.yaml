id: configure-tailscale-ingress
title: Configure Tailscale Ingress
type: action
journey_stage: setup
summary: Expose services through a Tailscale tailnet.
explanation: >
  This step joins your cluster to a Tailscale tailnet, making services accessible
  to any device on the same tailnet. It provides secure, encrypted access without
  exposing ports to the public internet. Supports both Tailscale SaaS and
  self-hosted Headscale.
side_help: >
  To use Tailscale, you need:
  1. A Tailscale account (free at https://tailscale.com) or a self-hosted Headscale
  2. An auth key generated from your Tailscale admin console
  3. Optionally, an ACL tag to assign to this cluster node
  For self-hosted Headscale, you will also need your Headscale URL and API key.
ingress_route: tailscale
inputs:
  - id: ts_authkey
    label: Tailscale Auth Key
    type: string
    required: true
    help: >
      Auth key generated from your Tailscale admin console.
      Create one at: https://login.tailscale.com/admin/settings/keys
  - id: ts_tag
    label: Tailscale ACL Tag
    type: string
    required: false
    help: ACL tag to assign to this node (e.g., tag:twinbox)
  - id: headscale_url
    label: Headscale URL
    type: string
    required: false
    help: URL of your self-hosted Headscale instance (if not using Tailscale SaaS)
  - id: headscale_key
    label: Headscale API Key
    type: string
    required: false
    help: API key for your self-hosted Headscale instance
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/configure-tailscale-ingress/run.sh
