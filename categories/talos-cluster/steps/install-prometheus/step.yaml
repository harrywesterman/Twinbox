id: install-prometheus
title: Install Prometheus
type: action
journey_stage: setup
order: 16
summary: Apply the Prometheus GitOps application that enables alerting and cluster metrics.
explanation: Twinbox installs the kube-prometheus-stack through Argo CD. That gives the cluster Prometheus, Alertmanager, node-exporter, and kube-state-metrics while keeping Grafana as a separate dashboard step. The stack uses Longhorn-backed storage and waits for Argo CD health before continuing.
side_help: Prometheus collects cluster metrics, Alertmanager routes alerts, node-exporter exposes node metrics, and kube-state-metrics exposes Kubernetes object state.
depends_on:
  - install-traefik
  - install-longhorn-storage
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-prometheus/run.sh
