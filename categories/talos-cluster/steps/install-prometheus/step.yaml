id: install-prometheus
title: Install Prometheus
type: action
journey_stage: setup
summary: Apply the Prometheus GitOps application and Metrics Server for cluster resource metrics.
explanation: Twinbox installs Kubernetes Metrics Server and the kube-prometheus-stack through Argo CD. Metrics Server enables kubectl top and Kubernetes resource metrics, while kube-prometheus-stack adds Prometheus, Alertmanager, node-exporter, and kube-state-metrics. The stack uses Longhorn-backed storage and waits for Argo CD health before continuing.
side_help: Metrics Server exposes Kubernetes resource metrics for kubectl top and autoscaling. Prometheus collects cluster metrics, Alertmanager routes alerts, node-exporter exposes node metrics, and kube-state-metrics exposes Kubernetes object state.
dashy:
  items:
    - section: Platform
      title: Prometheus
      description: Metrics collection and alerting
      icon: si-prometheus
      url_template: https://prometheus.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-prometheus/run.sh
