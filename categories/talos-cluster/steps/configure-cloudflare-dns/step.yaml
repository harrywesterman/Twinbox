id: configure-cloudflare-dns
title: Configure Cloudflare DNS Records (Wiredoor)
type: action
journey_stage: setup
summary: Create DNS A records for the Wiredoor bastion in Cloudflare via external-dns.
explanation: >
  This step creates DNSEndpoint resources in the cluster for the Wiredoor bastion
  host. External DNS (configured in step) picks them up and creates the actual A
  records in Cloudflare. You no longer need to enter a Cloudflare API token here
  because that was already done in Configure DNS Provider.
side_help: >
  The DNS provider was already set up in the Configure DNS step. This step only
  needs to know the Wiredoor bastion IP address (which Twinbox reads from the
  bastion secrets). The DNS records will be created by external-dns running in
  the cluster.
ingress_route: wiredoor
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
    WIREDORO_BASTION_SECRETS:
      scope: global
      item: wiredoor-bastion
      attachment: wiredoor-bastion
      format: json
      optional: true
runner:
  kind: script
  script: categories/talos-cluster/steps/configure-cloudflare-dns/run.sh
