id: install-traefik-manager
title: Install Traefik Manager
type: action
journey_stage: setup
order: 44
summary: Apply the Traefik Manager GitOps application for browser-based reverse-proxy management.
explanation: Twinbox deploys Traefik Manager as a separate management console so you can inspect and edit Traefik routes from the browser. The app runs behind the existing Authentik forward-auth middleware, stores its config on Longhorn, and talks to the live Traefik API after the ingress branch and Traefik controller are ready.
side_help: Traefik Manager lets you view routes, services, middlewares, certificates, and live Traefik metrics from the browser.
depends_on:
  - install-traefik
  - install-authentik-idp
  - install-longhorn-storage
  - choose-ingress-route
dashy:
  items:
    - section: Platform
      title: Traefik Manager
      description: Browser UI for Traefik routes and services
      icon: fas fa-sitemap
      url_template: https://traefik-manager.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-traefik-manager/run.sh
