id: install-argocd
title: Install Argo CD
type: action
journey_stage: setup
order: 30
summary: Install Argo CD and wait for the core root application tree to become healthy.
explanation: Twinbox installs Argo CD after secret sync, then applies the core root Application and waits for the root apps to report Synced and Healthy. Optional applications such as Whoami, Headlamp, Grafana, and Wiredoor are enabled later as separate wizard steps.
side_help: The root Application now covers only traefik and routes. Optional apps are installed later so the initial bootstrap stays focused on core platform readiness.
depends_on:
  - install-secret-sync
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-argocd/run.sh
