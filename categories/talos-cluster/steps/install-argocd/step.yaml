id: install-argocd
title: Install Argo CD
type: action
journey_stage: setup
order: 12
summary: Install Argo CD so the remaining platform services can be managed declaratively.
explanation: Twinbox installs Argo CD after the Talos/Cilium bootstrap has completed, then waits for the Argo CD control plane to become healthy before continuing.
side_help: Argo CD manages the GitOps layer; the core Cilium networking stack stays Talos-owned.
depends_on:
  - provision-nodes
dashy:
  items:
    - section: Platform
      title: Argo CD
      description: GitOps control plane
      icon: fas fa-code-branch
      url_template: https://argocd.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-argocd/run.sh
