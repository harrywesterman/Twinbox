id: install-netbird-routing-peers
title: Install NetBird Routing Peers
type: action
journey_stage: setup
summary: Deploy NetBird routing peers into Kubernetes through Argo CD.
explanation: >
  This step deploys the NetBird agent in the Talos Kubernetes cluster so NetBird
  can route proxy traffic from the VPS to internal Traefik resources.
side_help: >
  The setup key is read from OpenBao through External Secrets. The routing peer
  pod runs with privileged networking because NetBird needs to create a WireGuard
  interface and forward traffic into the cluster.
ingress_route: netbird
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-netbird-routing-peers/run.sh
