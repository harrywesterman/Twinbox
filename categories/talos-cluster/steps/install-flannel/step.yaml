id: install-flannel
title: Install Flannel
type: action
journey_stage: setup
order: 12
summary: Bootstrap Flannel so the cluster has pod networking before Argo CD workloads start.
explanation: Twinbox installs Flannel directly as the bootstrap CNI because the cluster needs pod networking before Argo CD itself can run. Argo CD adopts Flannel in the next step so the desired state still lives in GitOps.
side_help: Flannel is the one bootstrap exception in the GitOps flow. It exists to make the cluster capable of running the Argo CD control plane.
depends_on:
  - provision-nodes
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-flannel/run.sh
