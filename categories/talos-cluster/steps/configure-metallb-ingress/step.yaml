id: configure-metallb-ingress
title: Configure MetalLB Ingress
type: action
journey_stage: setup
order: 28
summary: Expose services using MetalLB load balancer with port forwarding.
explanation: >
  This step configures MetalLB to provide LoadBalancer-type services on bare metal
  and sets up port forwarding for external access. It is ideal for home labs and
  on-premise deployments where you have control over your local network.
side_help: >
  To use MetalLB with port forwarding, you need:
  1. An available IP range on your local network for MetalLB to assign
  2. A public hostname (static IP or DynDNS) pointing to your router
  3. Port forwarding configured on your router (ports 80 and 443)
  4. Optionally, a DynDNS provider for dynamic public IPs
depends_on:
  - install-secret-sync
  - choose-ingress-route
  - configure-dns
ingress_route: metallb
inputs:
  - id: metallb_ip_range
    label: MetalLB IP Range
    type: string
    required: true
    help: IP range for MetalLB to assign (e.g., 192.168.1.200-192.168.1.210)
  - id: public_host
    label: Public Hostname
    type: string
    required: true
    help: Public hostname pointing to your router (e.g., mycluster.duckdns.org)
  - id: dyndns_provider
    label: DynDNS Provider
    type: string
    required: false
    help: DynDNS provider name if using dynamic DNS (e.g., duckdns, noip)
  - id: dyndns_token
    label: DynDNS API Token
    type: string
    required: false
    help: API token for your DynDNS provider
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/configure-metallb-ingress/run.sh
