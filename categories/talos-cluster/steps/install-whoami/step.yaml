id: install-whoami
title: Install Whoami
type: action
journey_stage: setup
order: 50
summary: Apply the Whoami GitOps application.
explanation: Twinbox installs Whoami through one Argo CD application that includes the workload and its ingress routes. The step waits for the application to become Synced and Healthy before continuing.
side_help: Whoami is the first lightweight app after the core platform and is the smallest possible check that the post-platform GitOps flow works.
depends_on:
  - install-traefik
dashy:
  items:
    - section: Apps
      title: Whoami
      description: Minimal ingress check
      icon: fas fa-user
      url_template: https://whoami.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-whoami/run.sh
