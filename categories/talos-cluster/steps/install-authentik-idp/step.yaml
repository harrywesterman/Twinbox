id: install-authentik-idp
title: Install Authentik
type: action
journey_stage: setup
order: 31
summary: Install Authentik through GitOps after the storage layer is ready.
explanation: Twinbox seeds an Authentik bootstrap secret into OpenBao and then applies one Argo CD application that combines the Authentik Helm chart, the generated Kubernetes secret, and the ingress route for the identity provider.
side_help: Authentik provides the identity and bootstrap admin flow that later user and group provisioning steps build on.
depends_on:
  - install-secret-sync
  - install-longhorn-storage
  - install-traefik
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-authentik-idp/run.sh
