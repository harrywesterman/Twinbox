id: install-authentik-idp
title: Install Authentik
type: action
journey_stage: setup
order: 22
summary: Install Authentik through GitOps after the database and storage layers are ready.
explanation: Twinbox seeds an Authentik bootstrap secret into OpenBao and then applies one Argo CD application that combines the Authentik Helm chart, the generated Kubernetes secret, and the ingress route for the identity provider. The step waits for the Authentik server and worker Deployment objects to appear after the Argo CD application is applied, but it does not block on their startup probes or aggregate Argo health. The wizard asks for the platform DNS domain in the ingress selection step, and Authentik uses that value for its public host. Authentik connects to its dedicated CloudNativePG cluster through the PgBouncer connection pooler.
side_help: Authentik provides the identity and bootstrap admin flow that later user and group provisioning steps build on. Its database is managed by CloudNativePG with automated backups.
depends_on:
  - install-secret-sync
  - install-longhorn-storage
  - install-traefik
  - install-postgres-clusters
  - choose-ingress-route
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-authentik-idp/run.sh
