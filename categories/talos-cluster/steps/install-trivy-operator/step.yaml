id: install-trivy-operator
title: Install Trivy Operator
type: action
journey_stage: setup
summary: Deploy Trivy Operator so every running container image is scanned for vulnerabilities.
explanation: Trivy Operator runs in-cluster and continuously scans the container images of all workloads for known CVEs. It publishes VulnerabilityReport and ConfigAuditReport resources that a dashboard can read, giving Twinbox visibility into security issues across every component instead of only the npm dependencies that GitHub tracks.
side_help: Trivy Operator scans your running images for known vulnerabilities and reports them in-cluster.
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-trivy-operator/run.sh
