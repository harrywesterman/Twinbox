id: install-headlamp
title: Install Headlamp
type: action
journey_stage: setup
order: 33
summary: Apply the Headlamp GitOps application.
explanation: Headlamp is installed through a single Argo CD application that combines the Helm chart and ingress routes. The step waits until Argo CD reports it Synced and Healthy.
side_help: Headlamp stays separate from the other apps so the operator console can be validated before the heavier workloads start.
depends_on:
  - install-whoami
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-headlamp/run.sh
