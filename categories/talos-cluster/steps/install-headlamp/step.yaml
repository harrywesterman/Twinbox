id: install-headlamp
title: Install Headlamp
type: action
journey_stage: setup
order: 32
summary: Enable the Headlamp app and its route bundle.
explanation: Headlamp is installed after the first optional app so the wizard keeps progressing through smaller, clearly separated platform tasks. This step enables the Headlamp application and route bundle, then waits for both to become Synced and Healthy.
side_help: Headlamp is the operator console and is now activated as its own step instead of being bundled into the initial root sync.
depends_on:
  - install-whoami
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-headlamp/run.sh
