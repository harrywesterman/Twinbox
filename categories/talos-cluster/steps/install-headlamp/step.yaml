id: install-headlamp
title: Install Headlamp
type: action
journey_stage: setup
order: 35
summary: Apply the Headlamp GitOps application. It is a nice web based Kubernetes client.
explanation: Headlamp is installed through a single Argo CD application that combines the Helm chart and ingress routes. The step waits until Argo CD reports it Synced and Healthy.
side_help: Headlamp is nice to look at the current state of the cluster, but remember; we are using GitOps, so changing anything will not help, Argo CD wil sync it right back.
depends_on:
  - install-whoami
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-headlamp/run.sh
