id: choose-ingress-route
title: Choose Ingress Route
type: config
journey_stage: setup
order: 21
summary: Choose which ingress branch Twinbox should expose for this cluster.
explanation: This step records the ingress strategy you want to use. It does not change the apps themselves, only which branch of ingress-specific infrastructure the wizard shows next.
side_help: Pick one ingress route. The apps remain available regardless of the choice, but the follow-up ingress steps will match the route you pick here.
depends_on:
  - create-users-and-groups
inputs:
  - id: ingress_route
    label: Ingress Route
    type: string
    required: true
    help: Choose the ingress branch you want Twinbox to configure.
    options:
      - label: Wiredoor
        value: wiredoor
      - label: Cloudflare Tunnel
        value: cloudflare-tunnel
      - label: MetalLB
        value: metallb
      - label: Tailscale
        value: tailscale
runner:
  kind: script
  script: categories/talos-cluster/steps/choose-ingress-route/run.sh
