id: choose-ingress-route
title: Choose Ingress Route
type: config
journey_stage: setup
order: 21
summary: Choose which ingress branch Twinbox should expose for this cluster.
explanation: This step records the ingress strategy you want to use and the DNS domain that will back the platform hostnames. It does not change the apps themselves, only which branch of ingress-specific infrastructure the wizard shows next.
side_help: Pick one ingress route and enter the base DNS domain you want to use. Twinbox will prefix the cluster slug for non-PRD hostnames, so tst with bierineenweek.nl becomes tst.bierineenweek.nl. PRD keeps the special app.example.com exception.
depends_on:
  - install-postgres-clusters
inputs:
  - id: ingress_route
    label: Ingress Route
    type: string
    required: true
    help: Choose the ingress branch you want Twinbox to configure.
    options:
      - label: Wiredoor
        value: wiredoor
      - label: Cloudflare Tunnel
        value: cloudflare-tunnel
      - label: MetalLB
        value: metallb
      - label: Tailscale
        value: tailscale
  - id: dns_domain
    label: DNS Domain
    type: string
    required: true
    help: Base zone for platform hostnames. Twinbox prefixes the cluster slug for non-PRD clusters, so tst with bierineenweek.nl becomes tst.bierineenweek.nl. PRD keeps app.example.com.
runner:
  kind: script
  script: categories/talos-cluster/steps/choose-ingress-route/run.sh
