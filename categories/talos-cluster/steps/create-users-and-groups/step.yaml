id: create-users-and-groups
title: Create Users and Groups
type: action
journey_stage: setup
summary: Create the first Authentik user, reuse the wizard login password, and add the user to `admins` after Authentik is installed.
explanation: Twinbox provisions the first Authentik user from the wizard inputs, reuses the Management VM login password from the bootstrap secret tree, creates the `admins` group as a superuser group, and adds the first user to that group so later applications can be restricted through Authentik policies.
side_help: Use this step to create the account you will use to log in to Authentik and later to protected apps. Twinbox reuses the Management VM password you already chose, and the group name is fixed to `admins` because Twinbox uses that group for management-only access policies.
inputs:
  - id: full_name
    label: Full name
    type: string
    required: true
    help: Display name for the first Authentik user.
  - id: username
    label: Login name
    type: string
    required: true
    help: Authentik username for the first user.
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/create-users-and-groups/run.sh
