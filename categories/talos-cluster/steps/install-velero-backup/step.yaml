id: install-velero-backup
title: Install Velero backup
type: action
journey_stage: setup
summary: Install Velero with the configured cluster backup storage.
explanation: Twinbox deploys Velero through Argo CD and points it at the cluster-bound S3-compatible backup profile.
side_help: Velero gives the cluster a day-2 backup path for Kubernetes resources and filesystem-backed volume data.
depends_on:
  - configure-backup-storage
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-velero-backup/run.sh
