id: install-velero-backup
title: Install Velero backup
type: action
journey_stage: setup
summary: Install Velero with the default SeaweedFS S3 target on the Management VM.
explanation: Twinbox deploys Velero through Argo CD and points it at the SeaweedFS S3 service running on the Management VM with no setup-time choice between backup targets.
side_help: Velero gives the cluster a day-2 backup path for Kubernetes resources and filesystem-backed volume data.
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-velero-backup/run.sh
