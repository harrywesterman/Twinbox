id: install-wiredoor-gateway
title: Install Wiredoor gateway
type: action
journey_stage: setup
summary: Apply the Wiredoor gateway GitOps application after seeding its bootstrap secret.
explanation: Twinbox prepares the Wiredoor gateway bootstrap secret in OpenBao and then applies one Argo CD application that combines the ExternalSecret, Wiredoor chart, and ingress route needed for the Wiredoor entrypoint.
side_help: Wiredoor remains separate because it has its own network entrypoint and secret bootstrap requirements.
ingress_route: wiredoor
dashy:
  items:
    - section: Platform
      title: Wiredoor
      description: External operator entrypoint
      icon: fas fa-door-open
      output_url_key: wiredoor_url
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-wiredoor-gateway/run.sh
