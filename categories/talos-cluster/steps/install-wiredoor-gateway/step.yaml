id: install-wiredoor-gateway
title: Install Wiredoor gateway
type: action
journey_stage: setup
order: 34
summary: Enable the Wiredoor gateway, its secret bootstrap, and its route bundle.
explanation: Wiredoor gateway now runs as a distinct optional step after Grafana so the bootstrap flow stays focused. This step activates the gateway secret application, the gateway chart itself, and the wiredoor route bundle, then waits for the child applications to report Synced and Healthy.
side_help: The gateway is split out so Wiredoor no longer bloats the initial root sync tree and remains a clearly visible activation step.
depends_on:
  - install-grafana
inputs: []
runner:
  kind: script
  script: categories/talos-cluster/steps/install-wiredoor-gateway/run.sh
