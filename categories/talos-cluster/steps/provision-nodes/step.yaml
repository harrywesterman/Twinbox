id: provision-nodes
title: Deploy Talos Cluster
type: action
order: 10
summary: Install Talos Linux on separate VM's on the cluster.
explanation: Talos Linux is the immutable, Kubernetes-focused operating system that Twinbox uses. We use OpenTofu, download the Talos image on demand, size the control plane and worker roles separately, land the VMs on Proxmox hosts, discover the DHCP addresses, apply Talos machine configs, bootstrap the first control plane, and materialize the resulting Talos access files from the management-local bootstrap secret tree.
side_help: Talos Linux is a minimal, secure, API-driven operating system built specifically for running Kubernetes.
depends_on: []
dashy:
  items:
    - section: Platform
      title: Hubble
      description: Network flow visibility
      icon: fas fa-network-wired
      url_template: https://hubble.__ZONE_NAME__
inputs:
  - id: scale_percent
    label: Cluster scale
    type: integer
    required: true
    min: 0
    max: 100
    default: 90
    help: Scale the VM footprint from 0 to 100 percent. The default reserves room on all three Proxmox hosts.
  - id: worker_disk_percent
    label: Worker disk
    type: integer
    required: true
    min: 10
    max: 100
    default: 80
    help: Set the worker disk size as a share of the free worker-host disk. Twinbox starts at 80 percent of the space shared across the three Proxmox hosts.
  - id: name
    label: Cluster name
    type: string
    required: true
    default: twinbox-cluster
    help: Readable Twinbox cluster name.
  - id: controlplane_count
    label: Control planes
    type: integer
    required: true
    min: 1
    max: 15
    default: 3
    help: Current API range is 1 to 15. The default gives each Proxmox host one control plane.
  - id: worker_count
    label: Workers
    type: integer
    required: true
    min: 0
    max: 200
    default: 3
    help: Current API range is 0 to 200. The default gives each Proxmox host one worker.
  - id: cpu_cores
    label: CPU cores
    type: integer
    required: true
    min: 1
    max: 64
    default: 4
    help: Per-node CPU allocation. Use 4 vCPU or more for the standard Twinbox baseline; 2 vCPU is only realistic for a reduced dev/test cluster.
  - id: memory_mb
    label: Memory MB
    type: integer
    required: true
    min: 512
    max: 1048576
    default: 10240
    help: Worker memory allocation. Control planes stay fixed at 4096 MB, while workers default to 10240 MB unless you change the slider.
  - id: bridge
    label: Bridge
    type: string
    required: true
    default: vmbr0
    help: Proxmox bridge for Talos node traffic.
  - id: start_vmid
    label: Start VMID
    type: integer
    required: true
    min: 100
    max: 999999
    default: 200
    help: Seed VMID for the cluster inventory.
  - id: vip_ip
    label: VIP IP
    type: ipv4
    required: true
    default: 192.168.1.50
    help: Virtual IP for the Talos control plane.
  - id: node_prefix_length
    label: Prefix length
    type: integer
    required: true
    min: 1
    max: 32
    default: 24
    help: CIDR prefix for Talos node addresses.
  - id: gateway_ip
    label: Gateway IP
    type: ipv4
    required: true
    default: 192.168.1.1
    help: Default gateway for Talos nodes.
  - id: dns_servers
    label: DNS servers
    type: string
    required: true
    default: 1.1.1.1,8.8.8.8
    help: Comma-separated IPv4 DNS servers for Talos nodes.
runner:
  kind: script
  script: categories/talos-cluster/steps/provision-nodes/run.sh
