id: provision-nodes
title: Deploy Talos Cluster
type: action
order: 10
summary: Install Talos Linux on seperate VM's on the cluster.
explanation: Talos Linux is the immutable, Kubernetes-focused operating system that Twinbox uses. We use OpenTofu, download the Talos image on demand, lets you size the VM footprint first, then lands the VMs on Proxmox hosts, discovers the DHCP addresses, applies Talos machine configs, bootstraps the first control plane, and materializes the resulting Talos access files from the management-local bootstrap secret tree.
side_help: Talos Linux is a minimal, secure, API-driven operating system built specifically for running Kubernetes.
depends_on: []
inputs:
  - id: scale_percent
    label: Cluster scale
    type: integer
    required: true
    min: 0
    max: 100
    default: 30
    help: Scale the VM footprint from 0 to 100 percent.
  - id: name
    label: Cluster name
    type: string
    required: true
    default: twinbox-cluster
    help: Readable Twinbox cluster name.
  - id: controlplane_count
    label: Control planes
    type: integer
    required: true
    min: 1
    max: 15
    default: 1
    help: Current API range is 1 to 15.
  - id: worker_count
    label: Workers
    type: integer
    required: true
    min: 0
    max: 200
    default: 2
    help: Current API range is 0 to 200.
  - id: cpu_cores
    label: CPU cores
    type: integer
    required: true
    min: 1
    max: 64
    default: 2
    help: Per-node CPU request.
  - id: memory_mb
    label: Memory MB
    type: integer
    required: true
    min: 512
    max: 1048576
    default: 4096
    help: Per-node memory allocation.
  - id: disk_gb
    label: Disk GB
    type: integer
    required: true
    min: 10
    max: 8192
    default: 20
    help: System disk size per VM.
  - id: bridge
    label: Bridge
    type: string
    required: true
    default: vmbr0
    help: Proxmox bridge for Talos node traffic.
  - id: start_vmid
    label: Start VMID
    type: integer
    required: true
    min: 100
    max: 999999
    default: 200
    help: Seed VMID for the cluster inventory.
  - id: vip_ip
    label: VIP IP
    type: ipv4
    required: true
    default: 192.168.1.50
    help: Virtual IP for the Talos control plane.
  - id: start_ip
    label: Start IP
    type: ipv4
    required: true
    default: 192.168.1.51
    help: First node address in the reserved block.
  - id: node_prefix_length
    label: Prefix length
    type: integer
    required: true
    min: 1
    max: 32
    default: 24
    help: CIDR prefix for Talos node addresses.
  - id: gateway_ip
    label: Gateway IP
    type: ipv4
    required: true
    default: 192.168.1.1
    help: Default gateway for Talos nodes.
  - id: dns_servers
    label: DNS servers
    type: string
    required: true
    default: 1.1.1.1,8.8.8.8
    help: Comma-separated IPv4 DNS servers for Talos nodes.
runner:
  kind: script
  script: categories/talos-cluster/steps/provision-nodes/run.sh
