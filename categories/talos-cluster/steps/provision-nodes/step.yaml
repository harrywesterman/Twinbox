id: provision-nodes
title: Deploy cluster
type: action
order: 10
summary: Create the Proxmox VMs, discover their DHCP addresses, apply Talos, bootstrap the control plane, and materialize kubeconfig at runtime.
explanation: Twinbox renders a per-cluster OpenTofu workspace, downloads the Talos image on demand, provisions the VMs, discovers the DHCP addresses, applies Talos machine configs, bootstraps the first control plane, and materializes the resulting Talos access files from Vaultwarden-backed refs.
side_help: The Management VM keeps the OpenTofu state, rendered variables, outputs, and secret refs for this cluster. Talos access files are runtime artifacts only.
depends_on: []
inputs:
  - id: name
    label: Cluster name
    type: string
    required: true
    default: twinbox-cluster
    help: Readable Twinbox cluster name.
  - id: controlplane_count
    label: Control planes
    type: integer
    required: true
    min: 1
    max: 15
    default: 1
    help: Current API range is 1 to 15.
  - id: worker_count
    label: Workers
    type: integer
    required: true
    min: 0
    max: 200
    default: 2
    help: Current API range is 0 to 200.
  - id: cpu_cores
    label: CPU cores
    type: integer
    required: true
    min: 1
    max: 64
    default: 2
    help: Per-node CPU request.
  - id: memory_mb
    label: Memory MB
    type: integer
    required: true
    min: 512
    max: 1048576
    default: 4096
    help: Per-node memory allocation.
  - id: disk_gb
    label: Disk GB
    type: integer
    required: true
    min: 10
    max: 8192
    default: 20
    help: System disk size per VM.
  - id: bridge
    label: Bridge
    type: string
    required: true
    default: vmbr0
    help: Proxmox bridge for Talos node traffic.
  - id: start_vmid
    label: Start VMID
    type: integer
    required: true
    min: 100
    max: 999999
    default: 200
    help: Seed VMID for the cluster inventory.
  - id: vip_ip
    label: VIP IP
    type: ipv4
    required: true
    default: 192.168.1.50
    help: Virtual IP for the Talos control plane.
  - id: start_ip
    label: Start IP
    type: ipv4
    required: true
    default: 192.168.1.51
    help: First node address in the reserved block.
  - id: node_prefix_length
    label: Prefix length
    type: integer
    required: true
    min: 1
    max: 32
    default: 24
    help: CIDR prefix for Talos node addresses.
  - id: gateway_ip
    label: Gateway IP
    type: ipv4
    required: true
    default: 192.168.1.1
    help: Default gateway for Talos nodes.
  - id: dns_servers
    label: DNS servers
    type: string
    required: true
    default: 1.1.1.1,1.0.0.1
    help: Comma-separated IPv4 DNS servers for Talos nodes.
  - id: dns_domain
    label: DNS domain
    type: string
    required: false
    default: ""
    help: Optional search domain for Talos nodes.
runner:
  kind: script
  script: categories/talos-cluster/steps/provision-nodes/run.sh
