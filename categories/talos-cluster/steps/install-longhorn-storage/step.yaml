id: install-longhorn-storage
title: Install Longhorn Storage
type: action
journey_stage: setup
order: 40
summary: Install Longhorn storage with a pinned Helm chart version and wait for the app to become healthy.
explanation: Twinbox installs Longhorn as a dedicated storage add-on after Argo CD, pins the chart to the newest stable release, and waits until the Longhorn application reports Synced and Healthy before the step completes.
side_help: Storage remains a separate setup phase so later workload installers can depend on persistent volumes only after Longhorn is actually ready.
depends_on:
  - install-argocd
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-longhorn-storage/run.sh
