id: install-longhorn-storage
title: Install Longhorn Storage
type: action
journey_stage: setup
order: 15
summary: Install Longhorn storage directly with Helm and wait for the storage class to become available.
explanation: Twinbox installs Longhorn as an early storage prerequisite directly from the manager runtime, waits for the Longhorn controllers to become ready, and only then continues to later cluster steps.
side_help: Storage now comes before secret sync and application installs so later workloads can rely on persistent volumes only after Longhorn is actually ready.
depends_on:
  - provision-nodes
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-longhorn-storage/run.sh
