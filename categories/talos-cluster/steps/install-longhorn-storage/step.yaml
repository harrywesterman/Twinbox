id: install-longhorn-storage
title: Install Longhorn Storage
type: action
journey_stage: setup
summary: Apply the Longhorn GitOps application, make its storage class the cluster default, and wait for it to become available.
explanation: Twinbox installs Longhorn through a dedicated Argo CD application. The step waits until Argo reports the application healthy, marks StorageClass/longhorn as the cluster default, and then continues once the storage class is ready.
side_help: Longhorn is an open-source distributed block storage system for Kubernetes that makes persistent volumes easy to deploy and manage.
dashy:
  items:
    - section: Platform
      title: Longhorn
      description: Storage management
      icon: fas fa-hard-drive
      url_template: https://longhorn.__ZONE_NAME__
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-longhorn-storage/run.sh
