id: install-longhorn-storage
title: Install Longhorn Storage
type: action
journey_stage: setup
order: 14
summary: Apply the Longhorn GitOps application and wait for the storage class to become available.
explanation: Twinbox installs Longhorn through a dedicated Argo CD application. The step waits until Argo reports the application healthy and the Longhorn storage class is ready before continuing.
side_help: Longhorn is an open-source distributed block storage system for Kubernetes that makes persistent volumes easy to deploy and manage.
depends_on:
  - install-argocd
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-longhorn-storage/run.sh
