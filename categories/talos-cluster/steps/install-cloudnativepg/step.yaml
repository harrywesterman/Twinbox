id: install-cloudnativepg
title: Install CloudNativePG
type: action
journey_stage: setup
order: 20
summary: Install the CloudNativePG operator through GitOps.
explanation: Twinbox installs the CloudNativePG operator through one Argo CD application. The operator uses ServerSideApply for its large CRDs and runs with two replicas for high availability. The step waits for the operator to become Synced and Healthy so PostgreSQL clusters can be provisioned next.
side_help: CloudNativePG is the PostgreSQL operator that manages database clusters, connection pooling, and automated backups for all Twinbox workloads.
depends_on:
  - install-argocd
  - install-longhorn-storage
  - install-secret-sync
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-cloudnativepg/run.sh
