id: install-cloudnativepg
title: Install CloudNativePG
type: action
journey_stage: setup
summary: Install the CloudNativePG operator through GitOps.
explanation: Twinbox installs the CloudNativePG operator and the shared database resources application through GitOps. The operator uses ServerSideApply for its large CRDs and runs with two replicas for high availability. The step waits for the operator and the shared database namespace to become Synced and Healthy so PostgreSQL clusters can be provisioned next.
side_help: CloudNativePG is the PostgreSQL operator that manages database clusters, connection pooling, and automated backups for all Twinbox workloads.
inputs: []
secrets:
  files:
    KUBECONFIG_FILE:
      scope: cluster
      item: kubeconfig
      attachment: kubeconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-cloudnativepg/run.sh
