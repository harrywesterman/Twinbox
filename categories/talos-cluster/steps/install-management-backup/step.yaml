id: install-management-backup
title: Install Management VM backup
type: action
journey_stage: setup
summary: Schedule daily Management VM backups for Talos etcd snapshots and /opt/twinbox.
explanation: Twinbox writes host cron jobs that back up a daily Talos etcd snapshot and /opt/twinbox with restic to the cluster's dedicated management S3 bucket.
side_help: This protects the Management VM runtime state and the Talos control-plane data that live outside regular Kubernetes resource backups.
depends_on:
  - configure-backup-storage
inputs: []
secrets:
  files:
    TWINBOX_TALOSCONFIG_FILE:
      scope: cluster
      item: talosconfig
      attachment: talosconfig
      format: file
runner:
  kind: script
  script: categories/talos-cluster/steps/install-management-backup/run.sh
