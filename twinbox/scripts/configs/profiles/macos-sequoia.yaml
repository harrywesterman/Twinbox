# macOS Sequoia VM Profile
# For macOS VM creation (requires OpenCore and recovery ISOs)

vmid: 920
name: macos-sequoia
cores: 8
memory: 16384
disk: 128G
bridge: vmbr0
storage: local-lvm
macos: sequoia

# ISO paths (adjust as needed)
# iso_path: local:iso/SequoiaRecovery.iso
# Or provide custom installer:
# installer_path: /path/to/InstallSequoia.app/Contents/SharedSupport/InstallSequoia.dmg

# Optional: Custom SMBIOS (leave empty for auto-generation)
# smbios_serial: ""
# smbios_uuid: ""
# smbios_mlb: ""
# smbios_model: ""

# Note: OpenCore ISO should be available at:
# /var/lib/vz/template/iso/opencore-sequoia.iso