---
- name: Create monitoring manifests directory
  file:
    path: /tmp/monitoring-manifests
    state: directory
    mode: '0755'
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Copy Prometheus stack manifest
  copy:
    src: prometheus-stack.yaml
    dest: /tmp/monitoring-manifests/prometheus-stack.yaml
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Apply Prometheus stack
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl apply -f /tmp/monitoring-manifests/prometheus-stack.yaml
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Wait for Prometheus pods to be ready
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl wait --for=condition=ready pods -l app=prometheus -n monitoring --timeout=300s
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true
  retries: 30
  delay: 10

- name: Wait for Alertmanager pods to be ready
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl wait --for=condition=ready pods -l app=alertmanager -n monitoring --timeout=300s
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true
  retries: 30
  delay: 10

- name: Wait for Grafana pods to be ready
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl wait --for=condition=ready pods -l app.kubernetes.io/name=grafana -n monitoring --timeout=300s
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true
  retries: 30
  delay: 10

- name: Copy Grafana dashboard manifest
  copy:
    src: grafana-dashboard.yaml
    dest: /tmp/monitoring-manifests/grafana-dashboard.yaml
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Apply Grafana dashboard
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl apply -f /tmp/monitoring-manifests/grafana-dashboard.yaml
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Expose Grafana service via LoadBalancer
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl patch svc grafana -n monitoring -p '{"spec": {"type": "LoadBalancer"}}'
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Install node-exporter for system metrics
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl apply -f - <<EOF
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: node-exporter
      namespace: monitoring
      labels:
        k8s-app: node-exporter
    spec:
      selector:
        matchLabels:
          k8s-app: node-exporter
      template:
        metadata:
          labels:
            k8s-app: node-exporter
        spec:
          hostPID: true
          hostIPC: true
          hostNetwork: true
          containers:
          - name: node-exporter
            image: prom/node-exporter:v1.6.1
            ports:
            - containerPort: 9100
              protocol: TCP
              name: http-metrics
            args:
            - --collector.procfs=/host/proc
            - --collector.sysfs=/host/sys
            - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)
            resources:
              requests:
                cpu: 0.15
                memory: 512Mi
              limits:
                cpu: 0.15
                memory: 512Mi
            securityContext:
              privileged: true
            volumeMounts:
            - name: dev
              mountPath: /host/dev
            - name: proc
              mountPath: /host/proc
            - name: sys
              mountPath: /host/sys
            - name: rootfs
              mountPath: /rootfs
          volumes:
          - name: dev
            hostPath:
              path: /dev
          - name: proc
            hostPath:
              path: /proc
          - name: sys
            hostPath:
              path: /sys
          - name: rootfs
            hostPath:
              path: /
    EOF
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true

- name: Create monitoring service accounts
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: prometheus
      namespace: monitoring
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: prometheus
    rules:
    - apiGroups: [""]
      resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      verbs: ["get", "list", "watch"]
    - apiGroups:
      - extensions
      resources:
      - ingresses
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: prometheus
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: prometheus
    subjects:
    - kind: ServiceAccount
      name: prometheus
      namespace: monitoring
    EOF
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  run_once: true