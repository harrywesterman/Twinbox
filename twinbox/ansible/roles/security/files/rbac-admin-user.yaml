---
apiVersion: v1
kind: Namespace
metadata:
  name: admin-user
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-user-tls
  namespace: admin-user
  annotations:
    kubernetes.io/service-account.name: admin-user
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: admin-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: admin-user
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: admin-user-token
  namespace: admin-user
  annotations:
    kubernetes.io/service-account.name: admin-user