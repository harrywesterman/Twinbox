version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: twinbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: twinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twinbox_password}
      POSTGRES_DB: twinbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - twinbox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinbox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: twinbox-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - twinbox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: manager/web/Dockerfile
    container_name: twinbox-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://twinbox:${POSTGRES_PASSWORD:-twinbox_password}@postgres:5432/twinbox
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
    volumes:
      - ./manager/web:/app
    networks:
      - twinbox-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: manager/worker/Dockerfile
    container_name: twinbox-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://twinbox:${POSTGRES_PASSWORD:-twinbox_password}@postgres:5432/twinbox
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
    volumes:
      - ./manager/worker:/app
    networks:
      - twinbox-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://redis:6379/0", "LRANGE", "rq:worker:twobox-worker:queues", "0", "0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:

networks:
  twinbox-network:
    driver: bridge
