apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3

  backup:
    barmanObjectStore:
      serverName: immich-db
      destinationPath: s3://twinbox-velero/immich-db/
      endpointURL: http://seaweedfs.longhorn-system.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: seaweedfs-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: seaweedfs-backup-credentials
          key: AWS_SECRET_ACCESS_KEY

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;

  storage:
    size: 3Gi
    storageClass: longhorn-single

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
