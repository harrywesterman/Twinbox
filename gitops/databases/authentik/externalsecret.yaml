apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-credentials
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-db-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: twinbox/global/authentik
        property: AUTHENTIK_POSTGRESQL__USERNAME
    - secretKey: password
      remoteRef:
        key: twinbox/global/authentik
        property: AUTHENTIK_POSTGRESQL__PASSWORD
