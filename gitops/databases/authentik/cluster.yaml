apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      serverName: authentik-db
      destinationPath: s3://twinbox-velero/authentik-db/
      endpointURL: http://seaweedfs.longhorn-system.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: seaweedfs-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: seaweedfs-backup-credentials
          key: AWS_SECRET_ACCESS_KEY

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials

  storage:
    size: 20Gi
    storageClass: longhorn-single

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"
      maintenance_work_mem: "128MB"
      wal_buffers: "16MB"
      max_wal_size: "2GB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
