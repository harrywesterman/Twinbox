apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pixelfed-db
  namespace: databases
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pixelfed-db-objectstore
        serverName: pixelfed-db

  bootstrap:
    initdb:
      database: pixelfed
      owner: pixelfed
      secret:
        name: pixelfed-db-credentials

  storage:
    size: 20Gi
    storageClass: longhorn-single

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
