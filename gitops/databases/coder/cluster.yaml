apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-db
  namespace: databases
spec:
  instances: 1

  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      serverName: coder-db
      destinationPath: s3://twinbox-velero/coder-db/
      endpointURL: http://seaweedfs.longhorn-system.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: seaweedfs-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: seaweedfs-backup-credentials
          key: AWS_SECRET_ACCESS_KEY

  bootstrap:
    initdb:
      database: coder
      owner: coder
      secret:
        name: coder-db-credentials

  storage:
    size: 5Gi
    storageClass: longhorn-single

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  monitoring:
    enablePodMonitor: true
