apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: affine-db-objectstore
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://twinbox-velero/affine-db/
    endpointURL: http://seaweedfs.longhorn-system.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: seaweedfs-backup-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: seaweedfs-backup-credentials
        key: AWS_SECRET_ACCESS_KEY
