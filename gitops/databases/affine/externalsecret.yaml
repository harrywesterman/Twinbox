apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: affine-db-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: twinbox/global/affine
        property: AFFINE_POSTGRESQL__USERNAME
    - secretKey: password
      remoteRef:
        key: twinbox/global/affine
        property: AFFINE_POSTGRESQL__PASSWORD
