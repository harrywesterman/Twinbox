apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: affine-db-pooler-ro
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: affine-db
  instances: 1
  type: ro
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
  template:
    spec:
      containers:
        - name: pgbouncer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: affine-db-pooler-ro
