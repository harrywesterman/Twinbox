apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: affine-db-pooler-ro
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: affine-db
  instances: 1
  type: ro
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
