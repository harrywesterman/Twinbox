apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: CHANGEME-db-pooler-rw
  namespace: databases
spec:
  cluster:
    name: CHANGEME-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: CHANGEME-db-pooler-ro
  namespace: databases
spec:
  cluster:
    name: CHANGEME-db
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
