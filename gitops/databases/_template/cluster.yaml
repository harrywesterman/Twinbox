apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: CHANGEME-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: CHANGEME-db-objectstore
        serverName: CHANGEME-db

  bootstrap:
    initdb:
      database: CHANGEME
      owner: CHANGEME
      secret:
        name: CHANGEME-db-credentials

  storage:
    size: 20Gi
    storageClass: longhorn-single
    # Start with a roomy baseline; Longhorn supports online expansion if this still grows.
    # Resize with: kubectl patch cluster CHANGEME-db -n databases \
    #   --type merge -p '{"spec":{"storage":{"size":"40Gi"}}}'

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
