apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: CHANGEME-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: CHANGEME
      owner: CHANGEME
      secret:
        name: CHANGEME-db-credentials

  storage:
    size: 10Gi
    storageClass: longhorn

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
