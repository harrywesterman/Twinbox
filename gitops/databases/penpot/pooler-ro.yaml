apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: penpot-db-pooler-ro
  namespace: databases
spec:
  cluster:
    name: penpot-db
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
      min_pool_size: "5"
