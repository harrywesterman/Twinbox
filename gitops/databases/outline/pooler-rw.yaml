apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: outline-db-pooler-rw
  namespace: databases
spec:
  cluster:
    name: outline-db
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
  template:
    spec:
      containers:
        - name: pgbouncer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: outline-db-pooler-rw
