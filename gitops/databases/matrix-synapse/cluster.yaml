apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-synapse-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-synapse-db-objectstore
        serverName: matrix-synapse-db

  bootstrap:
    initdb:
      database: matrix_synapse
      owner: matrix_synapse
      secret:
        name: matrix-synapse-db-credentials

  storage:
    size: 20Gi
    storageClass: longhorn-single

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
