apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: n8n-db-pooler-rw-session
  namespace: databases
spec:
  cluster:
    name: n8n-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
      min_pool_size: "5"
      ignore_startup_parameters: extra_float_digits,options,statement_timeout
