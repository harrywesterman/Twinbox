apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: immich-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
            twinbox.io/app-immich: "enabled"
  template:
    metadata:
      name: immich
    spec:
      project: default
      sources:
        # Immich still publishes the chart through the legacy Helm repository.
        # Argo CD in this environment cannot authenticate to the GHCR OCI source.
        - repoURL: https://immich-app.github.io/immich-charts/
          chart: immich
          targetRevision: "0.11.1"
          helm:
            valueFiles:
              - $values/gitops/values/immich.yaml
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          path: gitops/platform-apps/immich
          kustomize:
            patches:
              - target:
                  kind: IngressRoute
                  name: immich
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`immich.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: immich-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`immich.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          path: gitops/databases/immich
          kustomize:
            patches:
              - target:
                  group: postgresql.cnpg.io
                  kind: Cluster
                  name: immich-db
                patch: |-
                  - op: replace
                    path: /spec/resources/requests/cpu
                    value: '{{ if eq (index .metadata.labels "twinbox.io/resource-profile") "small" }}250m{{ else if eq (index .metadata.labels "twinbox.io/resource-profile") "large" }}1{{ else }}500m{{ end }}'
                  - op: replace
                    path: /spec/resources/requests/memory
                    value: '{{ if eq (index .metadata.labels "twinbox.io/resource-profile") "small" }}512Mi{{ else if eq (index .metadata.labels "twinbox.io/resource-profile") "large" }}2Gi{{ else }}1Gi{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: immich
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
