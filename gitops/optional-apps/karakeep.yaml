apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karakeep-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
            twinbox.io/app-karakeep: "enabled"
  template:
    metadata:
      name: karakeep
    spec:
      project: default
      sources:
        - repoURL: https://karakeep-app.github.io/helm-charts
          chart: karakeep
          targetRevision: "0.32.0"
          helm:
            values: |-
              applicationProtocol: https
              applicationHost: karakeep.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
              secrets:
                karakeep:
                  enabled: false
                meilesearch:
                  enabled: false
              controllers:
                karakeep:
                  containers:
                    karakeep:
                      env:
                        DISABLE_PASSWORD_AUTH: "true"
                        OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
                        OAUTH_PROVIDER_NAME: Authentik
                        OAUTH_SCOPE: "openid email profile"
                        OAUTH_WELLKNOWN_URL: 'https://authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/application/o/karakeep/.well-known/openid-configuration'
                # Chrome stays within the cluster's baseline PodSecurity policy by
                # running without SYS_ADMIN and using the standard no-sandbox mode.
                chrome:
                  containers:
                    chrome:
                      args:
                        - --remote-debugging-address=0.0.0.0
                        - --remote-debugging-port=9222
                        - --headless
                        - --hide-scrollbars
                        - --disable-gpu
                        - --disable-dev-shm-usage
                        - --no-sandbox
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          add: []
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          path: gitops/platform-apps/karakeep
          kustomize:
            patches:
              - target:
                  kind: IngressRoute
                  name: karakeep
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`karakeep.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: karakeep-wiredoor
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`karakeep.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: karakeep-tailscale
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`karakeep.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
      destination:
        server: https://kubernetes.default.svc
        namespace: karakeep
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
