apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openwebui-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
            twinbox.io/app-openwebui: "enabled"
  template:
    metadata:
      name: openwebui
    spec:
      project: default
      sources:
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          path: gitops/platform-apps/openwebui
          kustomize:
            patches:
              - target:
                  kind: Deployment
                  name: openwebui
                patch: |-
                  - op: replace
                    path: /spec/template/spec/containers/0/env/0/value
                    value: https://openwebui.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
                  - op: replace
                    path: /spec/template/spec/containers/0/env/1/value
                    value: https://authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/application/o/openwebui/.well-known/openid-configuration
                  - op: replace
                    path: /spec/template/spec/containers/0/env/2/value
                    value: https://openwebui.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/oauth/oidc/callback
              - target:
                  kind: IngressRoute
                  name: openwebui
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`openwebui.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: openwebui-wiredoor
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`openwebui.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: openwebui-tailscale
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`openwebui.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
        - repoURL: https://github.com/harrywesterman/Twinbox.git
          targetRevision: main
          path: gitops/databases/openwebui
          kustomize:
            patches:
              - target:
                  group: postgresql.cnpg.io
                  kind: Cluster
                  name: openwebui-db
                patch: |-
                  - op: replace
                    path: /spec/resources/requests/cpu
                    value: '{{ if eq (index .metadata.labels "twinbox.io/resource-profile") "small" }}250m{{ else if eq (index .metadata.labels "twinbox.io/resource-profile") "large" }}1{{ else }}500m{{ end }}'
                  - op: replace
                    path: /spec/resources/requests/memory
                    value: '{{ if eq (index .metadata.labels "twinbox.io/resource-profile") "small" }}512Mi{{ else if eq (index .metadata.labels "twinbox.io/resource-profile") "large" }}2Gi{{ else }}1Gi{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openwebui
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
