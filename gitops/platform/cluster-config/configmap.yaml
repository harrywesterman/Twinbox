apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: argocd
data:
  ZONE_NAME: "__ZONE_NAME__"
  ARGOCD_MATCH: "Host(`argocd.__ZONE_NAME__`)"
  AUTHENTIK_MATCH: "Host(`authentik.__ZONE_NAME__`)"
  HEADLAMP_MATCH: "Host(`headlamp.__ZONE_NAME__`)"
  GRAFANA_MATCH: "Host(`grafana.__ZONE_NAME__`)"
  PROMETHEUS_MATCH: "Host(`prometheus.__ZONE_NAME__`)"
  NTFY_MATCH: "Host(`ntfy.__ZONE_NAME__`)"
  HOMEPAGE_MATCH: "Host(`homepage.__ZONE_NAME__`)"
  WHOAMI_MATCH: "Host(`whoami.__ZONE_NAME__`)"
  TRAEFIK_DASHBOARD_MATCH: "Host(`traefik.__ZONE_NAME__`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
  HOMEPAGE_ALLOWED_HOSTS: "homepage.__ZONE_NAME__"
  HOMEPAGE_BOOKMARKS_YAML: |
    - Platform:
        - Argo CD:
            - href: https://argocd.__ZONE_NAME__
              description: GitOps control plane
        - Traefik:
            - href: https://traefik.__ZONE_NAME__
              description: Ingress controller
        - Authentik:
            - href: https://authentik.__ZONE_NAME__
              description: Identity provider
        - Headlamp:
            - href: https://headlamp.__ZONE_NAME__
              description: Kubernetes dashboard
        - Grafana:
            - href: https://grafana.__ZONE_NAME__
              description: Metrics and dashboards
        - Prometheus:
            - href: https://prometheus.__ZONE_NAME__
              description: Metrics collection and alerting
        - ntfy:
            - href: https://ntfy.__ZONE_NAME__
              description: Push notification service
        - Wiredoor:
            href: https://argocd.__ZONE_NAME__
            description: Alternate operator entrypoint
    - Apps:
        - Whoami:
            href: https://whoami.__ZONE_NAME__
            description: Minimal ingress check
        - Homepage:
            href: https://homepage.__ZONE_NAME__
            description: Cluster landing page
  HOMEPAGE_SERVICES_YAML: |
    - Platform:
        - Argo CD:
            href: https://argocd.__ZONE_NAME__
            description: GitOps control plane
        - Traefik:
            href: https://traefik.__ZONE_NAME__
            description: Ingress controller
        - Authentik:
            href: https://authentik.__ZONE_NAME__
            description: Identity provider
        - Headlamp:
            href: https://headlamp.__ZONE_NAME__
            description: Kubernetes dashboard
        - Grafana:
            href: https://grafana.__ZONE_NAME__
            description: Metrics and dashboards
    - Apps:
        - Whoami:
            href: https://whoami.__ZONE_NAME__
            description: Minimal ingress check
        - Homepage:
            href: https://homepage.__ZONE_NAME__
            description: Cluster landing page
