apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-config
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cluster-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: cluster-config
      data:
        ZONE_NAME: "{{ .ZONE_NAME }}"
  data:
    - secretKey: ZONE_NAME
      remoteRef:
        key: twinbox/global/cluster-hostnames
        property: ZONE_NAME
