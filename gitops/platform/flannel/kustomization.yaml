apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/flannel-io/flannel/releases/download/v0.26.6/kube-flannel.yml
patches:
  - target:
      kind: Namespace
      name: kube-flannel
    path: namespace-labels.yaml
  - target:
      kind: ServiceAccount
      name: flannel
    path: kube-system-namespace.yaml
  - target:
      kind: ClusterRoleBinding
      name: flannel
    path: kube-system-rbac.yaml
