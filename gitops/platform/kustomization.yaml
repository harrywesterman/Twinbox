apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - cluster-config/configmap.yaml
  - cluster-config/externalsecret.yaml
  - authentik/ingressroute.yaml
  - whoami/ingressroute.yaml
  - headlamp/ingressroute.yaml
  - grafana/ingressroute.yaml
  - grafana/externalsecret.yaml
  - traefik/traefik-dashboard-ingressroute.yaml
  - traefik/argocd-ingressroute.yaml
  - wiredoor-gateway/ingressroute.yaml
  - wiredoor-gateway/externalsecret.yaml
  - homepage/ingressroute.yaml
  - homepage/configmap.yaml
  - homepage/deployment.yaml
  - prometheus/ingressroute.yaml
  - prometheus/alertmanager-config.yaml
  - ntfy/ingressroute.yaml
  - tailscale/externalsecret.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.ARGOCD_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: argocd
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: argocd-wiredoor
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.AUTHENTIK_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: authentik
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.HEADLAMP_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: headlamp
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: headlamp-wiredoor
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: headlamp-tailscale
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.GRAFANA_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: grafana
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: grafana-wiredoor
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: grafana-tailscale
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.PROMETHEUS_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: prometheus
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: prometheus-wiredoor
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.NTFY_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: ntfy
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: ntfy-wiredoor
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.HOMEPAGE_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: homepage
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: homepage-wiredoor
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.WHOAMI_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: whoami
        fieldPaths:
          - spec.routes.0.match
      - select:
          kind: IngressRoute
          name: whoami-wiredoor
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.TRAEFIK_DASHBOARD_MATCH
    targets:
      - select:
          kind: IngressRoute
          name: traefik-dashboard
        fieldPaths:
          - spec.routes.0.match
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.HOMEPAGE_BOOKMARKS_YAML
    targets:
      - select:
          kind: ConfigMap
          name: homepage
        fieldPaths:
          - data.bookmarks\.yaml
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.HOMEPAGE_SERVICES_YAML
    targets:
      - select:
          kind: ConfigMap
          name: homepage
        fieldPaths:
          - data.services\.yaml
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.HOMEPAGE_ALLOWED_HOSTS
    targets:
      - select:
          kind: Deployment
          name: homepage
        fieldPaths:
          - spec.template.spec.containers.0.env.0.value
