apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-cors
  namespace: authentik
  annotations:
    twinbox.io/description: Allow browser-side OIDC discovery and token requests from approved Twinbox app origins.
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
      - POST
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - https://admin.__ZONE_NAME__
      - https://opencloud.__ZONE_NAME__
    accessControlMaxAge: 100
    addVaryHeader: true
