apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-opencloud-oidc-discovery
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`authentik.__ZONE_NAME__`) && Path(`/.well-known/openid-configuration`)
      middlewares:
        - name: opencloud-oidc-discovery
      services:
        - kind: Service
          name: authentik-server
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-opencloud-oidc-discovery-netbird
  namespace: authentik
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`authentik.__ZONE_NAME__`) && Path(`/.well-known/openid-configuration`)
      middlewares:
        - name: opencloud-oidc-discovery
      services:
        - kind: Service
          name: authentik-server
          port: 80
