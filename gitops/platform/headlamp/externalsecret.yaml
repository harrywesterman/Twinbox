apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: HEADLAMP_CONFIG_OIDC_CLIENT_ID
      remoteRef:
        key: twinbox/global/headlamp-oidc
        property: HEADLAMP_CONFIG_OIDC_CLIENT_ID
    - secretKey: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/headlamp-oidc
        property: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
    - secretKey: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
      remoteRef:
        key: twinbox/global/headlamp-oidc
        property: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
    - secretKey: HEADLAMP_CONFIG_OIDC_SCOPES
      remoteRef:
        key: twinbox/global/headlamp-oidc
        property: HEADLAMP_CONFIG_OIDC_SCOPES
