apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-authentik-callback
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.bierineenweek.nl`) && PathPrefix(`/outpost.goauthentik.io`)
      services:
        - kind: Service
          name: authentik-server
          port: 80
  tls: {}
