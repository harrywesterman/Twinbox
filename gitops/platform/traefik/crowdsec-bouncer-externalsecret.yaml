apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-crowdsec-bouncer
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: traefik-crowdsec-bouncer
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: lapi-key
      remoteRef:
        key: twinbox/global/crowdsec-bouncer
        property: lapi_key
