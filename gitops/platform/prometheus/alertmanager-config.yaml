apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'ntfy'
    receivers:
      - name: 'ntfy'
        webhook_configs:
          - url: 'http://ntfy.monitoring.svc.cluster.local:80/twinbox-alerts'
            send_resolved: true
