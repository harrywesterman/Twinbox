apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashy-oidc
  namespace: dashy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dashy-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DASHY_OIDC_CLIENT_ID
      remoteRef:
        key: twinbox/global/dashy-oidc
        property: DASHY_OIDC_CLIENT_ID
    - secretKey: DASHY_OIDC_ENDPOINT
      remoteRef:
        key: twinbox/global/dashy-oidc
        property: DASHY_OIDC_ENDPOINT
    - secretKey: DASHY_OIDC_SCOPE
      remoteRef:
        key: twinbox/global/dashy-oidc
        property: DASHY_OIDC_SCOPE
