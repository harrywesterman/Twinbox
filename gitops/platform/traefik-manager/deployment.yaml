apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-manager
  namespace: traefik-manager
  labels:
    app.kubernetes.io/name: traefik-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-manager
    spec:
      serviceAccountName: traefik-manager
      initContainers:
        - name: init-storage
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /data/config /data/backups
          volumeMounts:
            - name: traefik-manager-storage
              mountPath: /data
      containers:
        - name: traefik-manager
          image: ghcr.io/chr0nzz/traefik-manager:0.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: AUTH_ENABLED
              value: "false"
            - name: COOKIE_SECURE
              value: "true"
            - name: DOMAINS
              value: traefik-manager.__ZONE_NAME__
            - name: TRAEFIK_API_URL
              value: http://traefik.traefik.svc.cluster.local:8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: traefik-manager-storage
              mountPath: /app/config
              subPath: config
            - name: traefik-manager-storage
              mountPath: /app/backups
              subPath: backups
      volumes:
        - name: traefik-manager-storage
          persistentVolumeClaim:
            claimName: traefik-manager-data
