apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
  settings.yaml: |
    title: Twinbox
    theme: dark
    hideVersion: true
  bookmarks.yaml: |
    - Platform:
        - Argo CD:
            - href: https://argocd.__ZONE_NAME__
              description: GitOps control plane
        - Traefik:
            - href: https://traefik.__ZONE_NAME__
              description: Ingress controller
        - Authentik:
            - href: https://authentik.__ZONE_NAME__
              description: Identity provider
        - Headlamp:
            - href: https://headlamp.__ZONE_NAME__
              description: Kubernetes dashboard
        - Grafana:
            - href: https://grafana.__ZONE_NAME__
              description: Metrics and dashboards
        - Prometheus:
            - href: https://prometheus.__ZONE_NAME__
              description: Metrics collection and alerting
        - ntfy:
            - href: https://ntfy.__ZONE_NAME__
              description: Push notification service
        - Wiredoor:
            href: https://argocd.__ZONE_NAME__
            description: Alternate operator entrypoint
    - Apps:
        - Whoami:
            href: https://whoami.__ZONE_NAME__
            description: Minimal ingress check
        - Homepage:
            href: https://homepage.__ZONE_NAME__
            description: Cluster landing page
  services.yaml: |
    - Platform:
        - Argo CD:
            href: https://argocd.__ZONE_NAME__
            description: GitOps control plane
        - Traefik:
            href: https://traefik.__ZONE_NAME__
            description: Ingress controller
        - Authentik:
            href: https://authentik.__ZONE_NAME__
            description: Identity provider
        - Headlamp:
            href: https://headlamp.__ZONE_NAME__
            description: Kubernetes dashboard
        - Grafana:
            href: https://grafana.__ZONE_NAME__
            description: Metrics and dashboards
    - Apps:
        - Whoami:
            href: https://whoami.__ZONE_NAME__
            description: Minimal ingress check
        - Homepage:
            href: https://homepage.__ZONE_NAME__
            description: Cluster landing page
  custom.css: ""
  custom.js: ""
