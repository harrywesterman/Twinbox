apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
  settings.yaml: |
    title: Twinbox
    theme: dark
    hideVersion: true
  bookmarks.yaml: |
    - Platform:
        - Argo CD:
            - href: https://argocd.bierineenweek.nl
              description: GitOps control plane
        - Traefik:
            - href: https://traefik.bierineenweek.nl
              description: Ingress controller
        - Authentik:
            - href: https://authentik.bierineenweek.nl
              description: Identity provider
        - Headlamp:
            - href: https://headlamp.bierineenweek.nl
              description: Kubernetes dashboard
        - Grafana:
            - href: https://grafana.bierineenweek.nl
              description: Metrics and dashboards
        - Wiredoor:
            - href: https://argocd.bierineenweek.nl
              description: Alternate operator entrypoint
  services.yaml: |
    - Platform:
        - Argo CD:
            href: https://argocd.bierineenweek.nl
            description: GitOps control plane
        - Traefik:
            href: https://traefik.bierineenweek.nl
            description: Ingress controller
        - Authentik:
            href: https://authentik.bierineenweek.nl
            description: Identity provider
        - Headlamp:
            href: https://headlamp.bierineenweek.nl
            description: Kubernetes dashboard
        - Grafana:
            href: https://grafana.bierineenweek.nl
            description: Metrics and dashboards
        - Wiredoor:
            href: https://argocd.bierineenweek.nl
            description: Alternate operator entrypoint
    - Apps:
        - Whoami:
            href: https://whoami.bierineenweek.nl
            description: Minimal ingress check
        - Homepage:
            href: https://homepage.bierineenweek.nl
            description: Cluster landing page
  custom.css: ""
  custom.js: ""
