apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
      - traefik.io
      - gateway.networking.k8s.io
    resources:
      - ingresses
      - ingressroutes
      - httproutes
      - gateways
    verbs:
      - get
      - list
