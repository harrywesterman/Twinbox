apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: oidc.authentik.clientID
      remoteRef:
        key: twinbox/global/argocd-oidc
        property: ARGOCD_OIDC_CLIENT_ID
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: twinbox/global/argocd-oidc
        property: ARGOCD_OIDC_CLIENT_SECRET
