apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hosts.grafana }}.{{ .Values.domain }}`)
      services:
        - kind: Service
          name: grafana
          port: 80
  tls: {}