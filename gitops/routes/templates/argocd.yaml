apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hosts.argocd }}.{{ .Values.domain }}`)
      services:
        - kind: Service
          name: argocd-server
          port: 80
  tls: {}