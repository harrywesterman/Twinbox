apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-dashboard-auth
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: traefik-dashboard-fields
    kind: SecretStore
  target:
    name: traefik-dashboard-auth
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: users
      remoteRef:
        key: twinbox/global/traefik-dashboard
        property: users
