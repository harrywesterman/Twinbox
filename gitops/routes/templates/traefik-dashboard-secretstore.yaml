apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: traefik-dashboard-fields
  namespace: traefik
spec:
  provider:
    webhook:
      url: "http://bitwarden-cli.bitwarden.svc.cluster.local:8087/object/item/twinbox/global/traefik-dashboard"
      result:
        jsonPath: "$.data.fields[?@.name==\"users\"].value"
