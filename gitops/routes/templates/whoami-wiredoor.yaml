apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-wiredoor
  namespace: default
spec:
  entryPoints:
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hosts.whoami }}.{{ .Values.domain }}`)
      services:
        - kind: Service
          name: whoami
          port: 80