apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: kube-system
spec:
  entryPoints:
    - websecure
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hosts.headlamp }}.{{ .Values.domain }}`)
      services:
        - kind: Service
          name: headlamp
          port: 80
  tls: {}