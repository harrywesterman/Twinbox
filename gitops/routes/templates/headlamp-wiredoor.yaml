apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-wiredoor
  namespace: kube-system
spec:
  entryPoints:
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hosts.headlamp }}.{{ .Values.domain }}`)
      services:
        - kind: Service
          name: my-headlamp
          port: 80