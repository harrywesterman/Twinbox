apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wiredoor-gateway
  namespace: wiredoor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: wiredoor-gateway-fields
    kind: SecretStore
  target:
    name: wiredoor-gateway
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: twinbox/global/wiredoor-gateway
        property: token
