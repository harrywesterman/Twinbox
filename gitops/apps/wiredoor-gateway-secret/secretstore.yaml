apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: wiredoor-gateway-fields
  namespace: wiredoor
spec:
  provider:
    webhook:
      url: "http://bitwarden-cli.bitwarden.svc.cluster.local:8087/object/item/twinbox/global/wiredoor-gateway"
      result:
        jsonPath: "$.data.fields[?@.name==\"token\"].value"
