apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dashy-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
  template:
    metadata:
      name: dashy
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: __TARGET_REVISION__
        path: gitops/platform-apps/dashy
        kustomize:
          patches:
            - target:
                kind: IngressRoute
                name: dashy
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: dashy-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: dashy-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
      destination:
        server: https://kubernetes.default.svc
        namespace: dashy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
