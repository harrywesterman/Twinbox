apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
  template:
    metadata:
      name: matrix
    spec:
      project: default
      sources:
        - repoURL: oci://ghcr.io/element-hq/ess-helm/matrix-stack
          path: .
          targetRevision: "26.8.1"
          helm:
            releaseName: ess
            valueFiles:
              - $values/gitops/values/matrix.yaml
            values: |
              serverName: "matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
              synapse:
                ingress:
                  host: "matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
              elementWeb:
                ingress:
                  host: "chat.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
                additional:
                  0-homeserver: |
                    {
                      "default_server_config": {
                        "m.homeserver": {
                          "base_url": "https://matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
                        }
                      }
                    }
              matrixAuthenticationService:
                ingress:
                  host: "account.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
                additional:
                  0-oidc:
                    configSecret: matrix-config
                    configSecretKey: oidc-upstream.yaml
                  1-policy:
                    configSecret: matrix-config
                    configSecretKey: policy.yaml
              elementAdmin:
                ingress:
                  host: "element-admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
              matrixRTC:
                ingress:
                  host: "mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
                sfu:
                  exposedServices:
                    turnTLS:
                      domain: "turn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          ref: values
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          path: gitops/platform-apps/matrix
          kustomize:
            patches:
              - target:
                  kind: IngressRoute
                  name: matrix
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: matrix-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: matrix-well-known
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/.well-known/matrix`)
              - target:
                  kind: IngressRoute
                  name: matrix-well-known-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`matrix.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/.well-known/matrix`)
              - target:
                  kind: IngressRoute
                  name: chat
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`chat.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: chat-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`chat.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: chat-well-known
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`chat.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/.well-known/matrix`)
              - target:
                  kind: IngressRoute
                  name: chat-well-known-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`chat.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/.well-known/matrix`)
              - target:
                  kind: IngressRoute
                  name: account
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`account.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: account-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`account.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: element-admin
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`element-admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: element-admin-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`element-admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: mrtc
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/sfu/get`)
                  - op: replace
                    path: /spec/routes/1/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/get_token`)
                  - op: replace
                    path: /spec/routes/2/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/`) && !PathPrefix(`/sfu/get`) && !PathPrefix(`/get_token`)
              - target:
                  kind: IngressRoute
                  name: mrtc-netbird
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/sfu/get`)
                  - op: replace
                    path: /spec/routes/1/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/get_token`)
                  - op: replace
                    path: /spec/routes/2/match
                    value: Host(`mrtc.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/`) && !PathPrefix(`/sfu/get`) && !PathPrefix(`/get_token`)
              - target:
                  kind: IngressRouteTCP
                  name: matrix-turn-tls
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: HostSNI(`turn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: Certificate
                  name: matrix-turn-tls
                patch: |-
                  - op: replace
                    path: /spec/dnsNames/0
                    value: turn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
      destination:
        server: https://kubernetes.default.svc
        namespace: matrix
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
