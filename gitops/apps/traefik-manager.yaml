apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform/traefik-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
