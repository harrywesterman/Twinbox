apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: termix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform-apps/termix
    kustomize:
      patches:
        - target:
            kind: IngressRoute
            name: termix
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`termix.__ZONE_NAME__`)
        - target:
            kind: IngressRoute
            name: termix-netbird
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`termix.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: termix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
