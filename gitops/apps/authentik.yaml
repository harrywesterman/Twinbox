apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: "2025.12.2"
      helm:
        valueFiles:
          - $values/gitops/values/authentik.yaml
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      path: gitops/platform/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
