apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ntfy-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
  template:
    metadata:
      name: ntfy
    spec:
      project: default
      sources:
        - repoURL: https://helm-charts.rm3l.org
          chart: ntfy
          targetRevision: "0.1.1"
          helm:
            valueFiles:
              - $values/gitops/values/ntfy.yaml
            values: |
              config:
                sample:
                  base-url: "https://ntfy.{{index .metadata.annotations "twinbox.io/public-zone-name"}}"
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          ref: values
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          path: gitops/platform-apps/ntfy
          kustomize:
            patches:
              - target:
                  kind: IngressRoute
                  name: ntfy
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`ntfy.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
              - target:
                  kind: IngressRoute
                  name: ntfy-wiredoor
                patch: |-
                  - op: replace
                    path: /spec/routes/0/match
                    value: Host(`ntfy.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
