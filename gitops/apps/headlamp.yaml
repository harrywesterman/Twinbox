apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: "0.42.0"
      helm:
        valueFiles:
          - $values/gitops/values/headlamp.yaml
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      ref: values
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/platform-apps/headlamp
      kustomize:
        patches:
          - target:
              kind: IngressRoute
              name: headlamp
            patch: |-
              - op: replace
                path: /spec/routes/0/match
                value: Host(`headlamp.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
