apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.coder.com/v2
      chart: coder
      targetRevision: "__CODER_CHART_VERSION__"
      helm:
        valueFiles:
          - $values/gitops/values/coder.yaml
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      ref: values
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/platform-apps/coder
      kustomize:
        patches:
          - target:
              kind: IngressRoute
              name: coder
            patch: |-
              - op: replace
                path: /spec/routes/0/match
                value: Host(`coder.__ZONE_NAME__`)
          - target:
              kind: IngressRoute
              name: coder-wiredoor
            patch: |-
              - op: replace
                path: /spec/routes/0/match
                value: Host(`coder.__ZONE_NAME__`)
          - target:
              kind: IngressRoute
              name: coder-tailscale
            patch: |-
              - op: replace
                path: /spec/routes/0/match
                value: Host(`coder.__ZONE_NAME__`)
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/databases/coder
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/workspace-namespaces/coder-workspaces
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
