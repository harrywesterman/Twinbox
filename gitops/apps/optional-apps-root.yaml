apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: optional-apps-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harrywesterman/Twinbox.git
    targetRevision: main
    path: gitops/optional-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
