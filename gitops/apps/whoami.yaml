apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform-apps/whoami
    kustomize:
      patches:
        - target:
            kind: IngressRoute
            name: whoami
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`whoami.__ZONE_NAME__`)
        - target:
            kind: IngressRoute
            name: whoami-wiredoor
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`whoami.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
