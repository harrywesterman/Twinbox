apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-ingress-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
  template:
    metadata:
      name: platform-ingress
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: __TARGET_REVISION__
        path: gitops/platform
        kustomize:
          patches:
            - target:
                kind: IngressRoute
                name: argocd
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: argocd-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: ConfigMap
                name: argocd-cm
              patch: |-
                - op: replace
                  path: /data/url
                  value: https://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
                - op: replace
                  path: /data/oidc.config
                  value: |-
                    name: Authentik
                    issuer: https://authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/application/o/argocd/
                    clientID: $oidc.authentik.clientID
                    clientSecret: $oidc.authentik.clientSecret
                    requestedScopes: ["openid", "profile", "email"]
                    requestedIDTokenClaims: {"groups": {"essential": true}}
            - target:
                kind: IngressRoute
                name: authentik
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: Middleware
                name: authentik-cors
              patch: |-
                - op: replace
                  path: /spec/headers/accessControlAllowOriginList/0
                  value: https://start.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
                - op: replace
                  path: /spec/headers/customResponseHeaders/Access-Control-Allow-Origin
                  value: https://start.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
            - target:
                kind: Middleware
                name: argocd-login-returnurl-redirect
              patch: |-
                - op: replace
                  path: /spec/redirectRegex/regex
                  value: ^https?://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/auth/login\?return_url=%2F([^&]+)$
                - op: replace
                  path: /spec/redirectRegex/replacement
                  value: https://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/auth/login?return_url=https%3A%2F%2Fargocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}%2F$1
            - target:
                kind: IngressRoute
                name: headlamp
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`headlamp.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: headlamp-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`headlamp.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: headlamp-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`headlamp.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: hubble
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`hubble.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: hubble-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`hubble.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: hubble-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`hubble.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: pgadmin4
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`pgadmin4.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: pgadmin4-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`pgadmin4.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: pgadmin4-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`pgadmin4.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: grafana
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`grafana.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: grafana-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`grafana.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: grafana-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`grafana.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: traefik-manager
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik-manager.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: Deployment
                name: traefik-manager
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/env/2/value
                  value: traefik-manager.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
            - target:
                kind: IngressRoute
                name: traefik-manager-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik-manager.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: traefik-manager-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik-manager.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: prometheus
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`prometheus.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: prometheus-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`prometheus.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: ntfy
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`ntfy.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: ntfy-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`ntfy.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: dashy
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`start.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: dashy-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`start.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: dashy-tailscale
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`start.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: whoami
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`whoami.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: whoami-wiredoor
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`whoami.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: traefik-dashboard
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
            - target:
                kind: IngressRoute
                name: traefik-authentik-callback
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/outpost.goauthentik.io`)
            - target:
                kind: IngressRoute
                name: longhorn
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`longhorn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: longhorn-authentik-callback
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`longhorn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/outpost.goauthentik.io`)
            - target:
                kind: IngressRoute
                name: twinboxwizard
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`twinboxwizard.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: proxmox
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`proxmox.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
