apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-ingress-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            twinbox.io/domain-ready: "true"
  template:
    metadata:
      name: platform-ingress
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: __TARGET_REVISION__
        path: gitops/platform
        kustomize:
          patches:
            - target:
                kind: IngressRoute
                name: argocd
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: ConfigMap
                name: argocd-cm
              patch: |-
                - op: replace
                  path: /data/url
                  value: https://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
                - op: replace
                  path: /data/oidc.config
                  value: |-
                    name: Authentik
                    issuer: https://authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/application/o/argocd/
                    clientID: $oidc.authentik.clientID
                    clientSecret: $oidc.authentik.clientSecret
                    requestedScopes: ["openid", "profile", "email"]
                    requestedIDTokenClaims: {"groups": {"essential": true}}
            - target:
                kind: IngressRoute
                name: authentik
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: authentik-netbird
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`authentik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: Middleware
                name: authentik-cors
              patch: |-
                - op: replace
                  path: /spec/headers/accessControlAllowOriginList/0
                  value: https://admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
                - op: replace
                  path: /spec/headers/accessControlAllowOriginList/1
                  value: https://opencloud.{{index .metadata.annotations "twinbox.io/public-zone-name"}}
            - target:
                kind: Middleware
                name: argocd-login-returnurl-redirect
              patch: |-
                - op: replace
                  path: /spec/redirectRegex/regex
                  value: ^https?://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/auth/login\?return_url=%2F([^&]+)$
                - op: replace
                  path: /spec/redirectRegex/replacement
                  value: https://argocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}/auth/login?return_url=https%3A%2F%2Fargocd.{{index .metadata.annotations "twinbox.io/public-zone-name"}}%2F$1
            - target:
                kind: IngressRoute
                name: hubble
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`hubble.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: hubble-authentik-callback
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`hubble.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/outpost.goauthentik.io`)
            - target:
                kind: IngressRoute
                name: traefik-dashboard
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
            - target:
                kind: IngressRoute
                name: traefik-authentik-callback
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`traefik.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/outpost.goauthentik.io`)
            - target:
                kind: IngressRoute
                name: longhorn
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`longhorn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: longhorn-authentik-callback
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`longhorn.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`) && PathPrefix(`/outpost.goauthentik.io`)
            - target:
                kind: IngressRoute
                name: webwizard
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`webwizard.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: seaweedfs
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`seaweedfs.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: seaweedfs-admin
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`seaweedfs-admin.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
            - target:
                kind: IngressRoute
                name: proxmox
              patch: |-
                - op: replace
                  path: /spec/routes/0/match
                  value: Host(`proxmox.{{index .metadata.annotations "twinbox.io/public-zone-name"}}`)
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
