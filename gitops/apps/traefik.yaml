apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "33.1.0"
      helm:
        valueFiles:
          - $values/gitops/values/traefik.yaml
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      path: gitops/platform/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
