apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    # Immich still publishes the chart through the legacy Helm repository.
    # Argo CD in this environment cannot authenticate to the GHCR OCI source.
    - repoURL: https://immich-app.github.io/immich-charts/
      chart: immich
      targetRevision: "0.11.1"
      helm:
        valueFiles:
          - $values/gitops/values/immich.yaml
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
