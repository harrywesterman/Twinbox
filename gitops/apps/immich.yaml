apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    # Immich still publishes the chart through the legacy Helm repository.
    # Argo CD in this environment cannot authenticate to the GHCR OCI source.
    - repoURL: https://immich-app.github.io/immich-charts/
      chart: immich
      targetRevision: "0.12.0"
      helm:
        valueFiles:
          - $values/gitops/values/immich.yaml
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      ref: values
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/platform-apps/immich
      kustomize:
        patches:
          - target:
              kind: IngressRoute
              name: immich
            patch: |-
              - op: replace
                path: /spec/routes/0/match
                value: Host(`immich.__ZONE_NAME__`)
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: gitops/databases/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
