apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pbs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform-apps/pbs
    kustomize:
      patches:
        - target:
            kind: IngressRoute
            name: pbs
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`pbs.__ZONE_NAME__`)
        - target:
            kind: IngressRoute
            name: pbs-netbird
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`pbs.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: pbs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true