apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform-apps/adguard
    kustomize:
      patches:
        - target:
            kind: IngressRoute
            name: adguard
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`adguard.__ZONE_NAME__`)
        - target:
            kind: IngressRoute
            name: adguard-netbird
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`adguard.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
    syncOptions:
      - CreateNamespace=true
