global:
  envFrom:
    - secretRef:
        name: authentik-bootstrap
  deploymentStrategy:
    type: Recreate

blueprints:
  configMaps:
    - authentik-blueprint-twinbox-automation
    - authentik-blueprint-passwordless

server:
  startupProbe:
    failureThreshold: 180
  # Keep the default probe shape and only extend the bootstrap budget.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

worker:
  startupProbe:
    failureThreshold: 180
  # Keep the default probe shape and only extend the bootstrap budget.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  envFrom:
    - secretRef:
        name: authentik-automation-secret

authentik:
  existingSecret:
    secretName: authentik-bootstrap

  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "authentik-db-pooler-rw-session.databases.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__USER
      valueFrom:
        secretKeyRef:
          name: authentik-db-credentials
          key: username
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-credentials
          key: password
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
      value: "true"
    - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
      value: "0"

  envFrom:
    - secretRef:
        name: authentik-bootstrap

postgresql:
  enabled: false
