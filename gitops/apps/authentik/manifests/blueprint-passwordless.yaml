apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-passwordless
  namespace: authentik
  labels:
    blueprints.goauthentik.io/instantiate: "true"
data:
  passwordless.yaml: |
    version: 1
    metadata:
      name: twinbox-passwordless
      labels:
        blueprints.goauthentik.io/description: |
          Configures WebAuthn stages, a passwordless authentication flow,
          and updates the default identification stage to support passkey autofill.
    entries:
      # --- WebAuthn authenticator setup stage ---
      - id: twinbox-webauthn-setup
        model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        state: present
        identifiers:
          name: twinbox-webauthn-setup
        attrs:
          friendly_name: "Twinbox Passkey Setup"
          user_verification: preferred
          resident_key_requirement: preferred

      # --- Authenticator validation stage (for passwordless flow) ---
      - id: twinbox-passwordless-validation
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: twinbox-passwordless-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: deny
          last_auth_threshold: "hours=0"

      # --- Force marked users to enroll a passkey during their first login ---
      - id: twinbox-passwordless-onboarding-validation
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: twinbox-passwordless-onboarding-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: configure
          configuration_stages:
            - !KeyOf twinbox-webauthn-setup
          last_auth_threshold: "hours=0"

      # --- Only run onboarding for users created or reset by the Twinbox portal ---
      - id: twinbox-passwordless-onboarding-required
        model: authentik_policies_expression.expressionpolicy
        state: present
        identifiers:
          name: twinbox-passwordless-onboarding-required
        attrs:
          expression: |
            pending_user = request.context.get("pending_user")
            if not pending_user:
                return False

            return pending_user.attributes.get("twinbox.io/passwordless-onboarding") is True

      # --- Never prompt users with a confirmed passkey for their password again ---
      - id: twinbox-passwordless-password-optional
        model: authentik_policies_expression.expressionpolicy
        state: present
        identifiers:
          name: twinbox-passwordless-password-optional
        attrs:
          expression: |
            from authentik.stages.authenticator_webauthn.models import WebAuthnDevice

            pending_user = request.context.get("pending_user")
            if not pending_user or not pending_user.pk:
                return True

            return not WebAuthnDevice.objects.filter(user=pending_user, confirmed=True).exists()

      # --- Expire the temporary password immediately after passkey enrollment ---
      - id: twinbox-passwordless-onboarding-finalize
        model: authentik_policies_expression.expressionpolicy
        state: present
        identifiers:
          name: twinbox-passwordless-onboarding-finalize
        attrs:
          expression: |
            from authentik.stages.authenticator_webauthn.models import WebAuthnDevice

            pending_user = request.context.get("pending_user")
            if not pending_user or not pending_user.pk:
                return True

            attributes = pending_user.attributes.copy()
            if attributes.get("twinbox.io/passwordless-onboarding") is not True:
                return True

            if not WebAuthnDevice.objects.filter(user=pending_user, confirmed=True).exists():
                return False

            attributes.pop("twinbox.io/passwordless-onboarding", None)
            pending_user.attributes = attributes
            pending_user.set_unusable_password()
            pending_user.save()
            return True

      # --- Passwordless authentication flow ---
      - id: twinbox-passwordless-flow
        model: authentik_flows.flow
        state: present
        identifiers:
          slug: twinbox-passwordless
        attrs:
          name: "Twinbox Passwordless"
          title: "Log in with your passkey"
          designation: authentication
          authentication: require_unauthenticated
          policy_engine_mode: any
          compatibility_mode: true

      # --- Bind validation stage to passwordless flow ---
      - id: twinbox-passwordless-flow-binding-validation
        model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf twinbox-passwordless-flow
          stage: !KeyOf twinbox-passwordless-validation
          order: 10

      # --- Bind user login stage to passwordless flow ---
      - id: twinbox-passwordless-flow-binding-login
        model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf twinbox-passwordless-flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, "default-authentication-login"]]
          order: 20

      # --- Update default identification stage to support passkey autofill ---
      - id: twinbox-default-identification-passkey
        model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: "default-authentication-identification"
        attrs:
          user_fields:
            - email
            - username
          passwordless_flow: !KeyOf twinbox-passwordless-flow
          webauthn_stage: !KeyOf twinbox-passwordless-validation

      # --- Insert portal user onboarding before the default login stage ---
      - id: twinbox-passwordless-onboarding-binding
        model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
          stage: !KeyOf twinbox-passwordless-onboarding-validation
          order: 40
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true

      - id: twinbox-passwordless-onboarding-policy-binding
        model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf twinbox-passwordless-onboarding-binding
          policy: !KeyOf twinbox-passwordless-onboarding-required
          order: 10

      # --- Extend the default authentication bindings without replacing defaults ---
      - id: twinbox-default-authentication-password-binding
        model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
          stage: !Find [authentik_stages_password.passwordstage, [name, "default-authentication-password"]]
          order: 20
        attrs:
          policy_engine_mode: all
          evaluate_on_plan: false
          re_evaluate_policies: true

      - id: twinbox-default-authentication-password-policy-binding
        model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf twinbox-default-authentication-password-binding
          policy: !KeyOf twinbox-passwordless-password-optional
          order: 20

      - id: twinbox-default-authentication-login-binding
        model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
          stage: !Find [authentik_stages_user_login.userloginstage, [name, "default-authentication-login"]]
          order: 100
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true

      - id: twinbox-passwordless-onboarding-finalize-binding
        model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf twinbox-default-authentication-login-binding
          policy: !KeyOf twinbox-passwordless-onboarding-finalize
          order: 20
