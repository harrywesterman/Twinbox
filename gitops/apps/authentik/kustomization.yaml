apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.2.2
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
      name: authentik-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authentik-server
      spec:
        progressDeadlineSeconds: 3600
  - target:
      kind: Deployment
      name: authentik-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authentik-worker
      spec:
        progressDeadlineSeconds: 3600
