apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twinbox-portal
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: "portal=ghcr.io/harrywesterman/twinbox-portal"
    argocd-image-updater.argoproj.io/portal.kustomize.image-name: "ghcr.io/harrywesterman/twinbox-portal"
    argocd-image-updater.argoproj.io/portal.update-strategy: "newest-build"
    argocd-image-updater.argoproj.io/portal.allow-tags: "regexp:^sha-[0-9a-f]+$"
    argocd-image-updater.argoproj.io/write-back-method: "git"
    argocd-image-updater.argoproj.io/write-back-target: "kustomization"
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: portal-config
      namespace: twinbox-portal
      jsonPointers:
        - /data
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: gitops/platform-apps/twinbox-portal
    kustomize:
      patches:
        - target:
            kind: IngressRoute
            name: twinbox-portal
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`portal.__ZONE_NAME__`)
  destination:
    server: https://kubernetes.default.svc
    namespace: twinbox-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
