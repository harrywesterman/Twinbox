apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-workspaces-deny-cross-pod-ingress
  namespace: coder-workspaces
  labels:
    app.kubernetes.io/name: twinbox-dev-workspace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twinbox-dev-workspace
  policyTypes:
    - Ingress
