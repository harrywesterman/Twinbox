apiVersion: v1
kind: ServiceAccount
metadata:
  name: twinbox-dev-admin
  namespace: coder-workspaces
  labels:
    app.kubernetes.io/name: twinbox-dev-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-workspaces-twinbox-dev-admin
  labels:
    app.kubernetes.io/name: twinbox-dev-workspace
subjects:
  - kind: ServiceAccount
    name: twinbox-dev-admin
    namespace: coder-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
