apiVersion: v1
kind: LimitRange
metadata:
  name: coder-workspaces-defaults
  namespace: coder-workspaces
spec:
  limits:
    - type: "Pod"
      max:
        cpu: "16"
        memory: "64Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
    - type: "Container"
      default:
        cpu: "1"
        memory: "2Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      max:
        cpu: "16"
        memory: "64Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
