apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-workspace-netbird
  namespace: coder-workspaces
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: coder-workspace-netbird
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: twinbox/global/netbird-dev-workspaces
        property: NB_SETUP_KEY
    - secretKey: NB_MANAGEMENT_URL
      remoteRef:
        key: twinbox/global/netbird-dev-workspaces
        property: NB_MANAGEMENT_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-workspace-opkssh-config
  namespace: coder-workspaces
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: coder-workspace-opkssh-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        config.yml: |
          default_provider: authentik
          providers:
            - alias: authentik
              issuer: {{ .issuer_url }}
              client_id: {{ .client_id }}
              client_secret: {{ .client_secret }}
              scopes: openid profile email groups
              access_type: offline
              prompt: consent
              redirect_uris:
                - http://localhost:3000/login-callback
                - http://localhost:10001/login-callback
              send_access_token: false
  data:
    - secretKey: issuer_url
      remoteRef:
        key: twinbox/global/opkssh
        property: OIDC_ISSUER_URL
    - secretKey: client_id
      remoteRef:
        key: twinbox/global/opkssh
        property: OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: twinbox/global/opkssh
        property: OIDC_CLIENT_SECRET
