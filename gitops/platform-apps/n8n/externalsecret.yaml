apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-bootstrap
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DB_POSTGRESDB_USER
      remoteRef:
        key: twinbox/global/n8n
        property: N8N_POSTGRESQL__USERNAME
    - secretKey: DB_POSTGRESDB_PASSWORD
      remoteRef:
        key: twinbox/global/n8n
        property: N8N_POSTGRESQL__PASSWORD
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: twinbox/global/n8n
        property: N8N_ENCRYPTION_KEY
