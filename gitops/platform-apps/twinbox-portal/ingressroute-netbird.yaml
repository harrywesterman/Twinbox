apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: twinbox-portal-netbird
  namespace: twinbox-portal
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`portal.__ZONE_NAME__`)
      middlewares:
        - name: twinbox-portal-netbird-forwarded-headers
      services:
        - kind: Service
          name: twinbox-portal
          port: 80
