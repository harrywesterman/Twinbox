apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-bootstrap
  namespace: twinbox-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: portal-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: PORTAL_BASE_URL
      remoteRef:
        key: twinbox/global/twinbox-portal
        property: PORTAL_BASE_URL
    - secretKey: PORTAL_OIDC_CLIENT_ID
      remoteRef:
        key: twinbox/global/twinbox-portal
        property: PORTAL_OIDC_CLIENT_ID
    - secretKey: PORTAL_OIDC_ISSUER
      remoteRef:
        key: twinbox/global/twinbox-portal
        property: PORTAL_OIDC_ISSUER
    - secretKey: PORTAL_SESSION_SECRET
      remoteRef:
        key: twinbox/global/twinbox-portal
        property: PORTAL_SESSION_SECRET
    - secretKey: AUTHENTIK_API_BASE
      remoteRef:
        key: twinbox/global/twinbox-portal
        property: AUTHENTIK_API_BASE
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef:
        key: twinbox/global/authentik
        property: AUTHENTIK_API_TOKEN
    - secretKey: MAILU_API_TOKEN
      remoteRef:
        key: twinbox/global/mailu-runtime
        property: api-token
