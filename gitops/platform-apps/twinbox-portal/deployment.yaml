apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinbox-portal
  namespace: twinbox-portal
  labels:
    app.kubernetes.io/name: twinbox-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twinbox-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinbox-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/harrywesterman/twinbox-portal:sha-8b252e13b83ff9aa2bcf7bb1a42c5be5017db040
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PORTAL_CONFIG_PATH
              value: /config/portal-config.json
            - name: PORTAL_DATA_DIR
              value: /data
            - name: PORTAL_MANAGER_BASE_URL
              value: http://twinboxwizard.longhorn-system.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: portal-bootstrap
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - name: portal-config
              mountPath: /config
              readOnly: true
            - name: portal-data
              mountPath: /data
      volumes:
        - name: portal-config
          secret:
            secretName: portal-config
        - name: portal-data
          persistentVolumeClaim:
            claimName: portal-data
