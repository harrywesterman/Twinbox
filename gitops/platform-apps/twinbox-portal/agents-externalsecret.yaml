apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twinbox-agents-portal-runtime
  namespace: twinbox-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: twinbox-agents-portal-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: TWINBOX_AGENT_INTERNAL_TOKEN
      remoteRef:
        key: twinbox/global/twinbox-agents
        property: TWINBOX_AGENT_INTERNAL_TOKEN
