apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-bootstrap
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: affine-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        DATABASE_URL: '{{ .DATABASE_URL }}'
        AFFINE_PRIVATE_KEY: '{{ .AFFINE_PRIVATE_KEY }}'
        OAUTH_OIDC_CLIENT_ID: '{{ .OAUTH_OIDC_CLIENT_ID }}'
        OAUTH_OIDC_CLIENT_SECRET: '{{ .OAUTH_OIDC_CLIENT_SECRET }}'
        config.json: |-
          {
            "$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
            "server": {
              "name": "Twinbox AFFiNE",
              "externalUrl": {{ .AFFINE_SERVER_EXTERNAL_URL | quote }},
              "https": true,
              "host": {{ .AFFINE_SERVER_HOST | quote }}
            },
            "auth": {
              "allowSignup": false,
              "allowSignupForOauth": true,
              "requireEmailVerification": false
            },
            "oauth": {
              "providers.oidc": {
                "issuer": {{ .OAUTH_OIDC_ISSUER | quote }},
                "clientId": {{ .OAUTH_OIDC_CLIENT_ID | quote }},
                "clientSecret": {{ .OAUTH_OIDC_CLIENT_SECRET | quote }},
                "args": {}
              }
            },
            "copilot": {
              "enabled": false,
              "byok": {
                "enabled": false,
                "allowCustomEndpoint": false
              }
            }
          }
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: twinbox/global/affine
        property: DATABASE_URL
    - secretKey: AFFINE_PRIVATE_KEY
      remoteRef:
        key: twinbox/global/affine
        property: AFFINE_PRIVATE_KEY
    - secretKey: OAUTH_OIDC_CLIENT_ID
      remoteRef:
        key: twinbox/global/affine
        property: OAUTH_OIDC_CLIENT_ID
    - secretKey: OAUTH_OIDC_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/affine
        property: OAUTH_OIDC_CLIENT_SECRET
    - secretKey: AFFINE_SERVER_EXTERNAL_URL
      remoteRef:
        key: twinbox/global/affine
        property: AFFINE_SERVER_EXTERNAL_URL
    - secretKey: AFFINE_SERVER_HOST
      remoteRef:
        key: twinbox/global/affine
        property: AFFINE_SERVER_HOST
    - secretKey: OAUTH_OIDC_ISSUER
      remoteRef:
        key: twinbox/global/affine
        property: OAUTH_OIDC_ISSUER
