apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin4
  namespace: pgadmin4
  labels:
    app.kubernetes.io/name: pgadmin4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin4
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
            - |
              cat > /work/config_local.py <<'EOF'
              import os

              AUTHENTICATION_SOURCES = ['oauth2']
              SERVER_MODE = True
              OAUTH2_CONFIG = [{
                  'OAUTH2_NAME': 'authentik',
                  'OAUTH2_DISPLAY_NAME': 'Authentik',
                  'OAUTH2_CLIENT_ID': os.environ['PGADMIN_OAUTH2_CLIENT_ID'],
                  'OAUTH2_CLIENT_SECRET': os.environ['PGADMIN_OAUTH2_CLIENT_SECRET'],
                  'OAUTH2_SERVER_METADATA_URL': os.environ['PGADMIN_OAUTH2_SERVER_METADATA_URL'],
                  'OAUTH2_SCOPE': os.environ.get('PGADMIN_OAUTH2_SCOPE', 'openid email profile'),
                  'OAUTH2_AUTO_CREATE_USER': True,
                  'OAUTH2_USERNAME_CLAIM': 'email',
              }]
              MASTER_PASSWORD_REQUIRED = True
              ENABLE_SERVER_PASS_EXEC_CMD = True
              MASTER_PASSWORD_HOOK = '/pgadmin4/master-password-hook.sh %u'
              ENHANCED_COOKIE_PROTECTION = False
              PROXY_X_FOR_COUNT = 1
              PROXY_X_PROTO_COUNT = 1
              PROXY_X_HOST_COUNT = 1
              PROXY_X_PORT_COUNT = 1
              PROXY_X_PREFIX_COUNT = 0
              PROXY_X_FORWARDED_PROTO = True
              LOG_FILE = '/dev/null'
              EOF
              cat > /work/master-password-hook.sh <<'EOF'
              #!/bin/sh
              set -eu
              printf '%s' "${PGADMIN_MASTER_PASSWORD}"
              EOF
              chmod 0644 /work/config_local.py
              chmod 0755 /work/master-password-hook.sh
          envFrom:
            - secretRef:
                name: pgadmin4-bootstrap
            - secretRef:
                name: pgadmin4-db-password
          volumeMounts:
            - name: pgadmin-config
              mountPath: /work
      containers:
        - name: pgadmin4
          image: dpage/pgadmin4:9.15
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
            - |
              cd /pgadmin4
              python_bin=/tmp/python3.14.no-cap
              cp /usr/local/bin/python3.14 "${python_bin}"
              chmod 0755 "${python_bin}"
              cat > /tmp/patch-sharedserver-passexec.py <<'PY'
              from pathlib import Path
              import sys

              path = Path("/pgadmin4/pgadmin/browser/server_groups/servers/__init__.py")
              text = path.read_text(encoding="utf-8")
              old = (
                  "                prepare_threshold=data.prepare_threshold,\n"
                  "                passexec_cmd=None,\n"
                  "                passexec_expiration=None,\n"
              )
              new = (
                  "                prepare_threshold=data.prepare_threshold,\n"
                  "                passexec_cmd=data.passexec_cmd,\n"
                  "                passexec_expiration=data.passexec_expiration,\n"
              )
              if new in text:
                  print("pgAdmin shared server passexec patch already applied")
              elif old in text:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  print("pgAdmin shared server passexec patch applied")
              else:
                  print(
                      "Could not patch pgAdmin shared server passexec handling",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              PY
              "${python_bin}" /tmp/patch-sharedserver-passexec.py
              cat > /tmp/patch-manager-passexec.py <<'PY'
              from pathlib import Path
              import sys

              path = Path("/pgadmin4/pgadmin/browser/server_groups/servers/__init__.py")
              text = path.read_text(encoding="utf-8")

              # Patch 1: In the modify function — suppress passexec for non-owners.
              old1 = (
                  "            # Suppress passexec for non-owners so the manager\n"
                  "            # never holds the owner's password-exec command.\n"
                  "            if _is_non_owner(server):\n"
                  "                manager.passexec = None"
              )
              new1 = (
                  "            # Allow passexec for shared server users.\n"
                  "            # Values are safely copied from sharedserver table.\n"
                  "            if _is_non_owner(server):\n"
                  "                pass"
              )

              # Patch 2: In the connect function — same pattern.
              old2 = (
                  "            # Re-suppress passexec after update() which rebuilds\n"
                  "            # from the (overlaid) server object.  Belt-and-suspenders:\n"
                  "            # the overlay already defaults passexec to None, but this\n"
                  "            # guards against direct DB edits.\n"
                  "            if _is_non_owner(server):\n"
                  "                manager.passexec = None"
              )
              new2 = (
                  "            # Allow passexec for shared servers - values are\n"
                  "            # safely provided by get_shared_server_properties.\n"
                  "            if _is_non_owner(server):\n"
                  "                pass"
              )

              count1 = text.count(old1)
              count2 = text.count(old2)

              if count1 == 1 and count2 == 1:
                  text = text.replace(old1, new1)
                  text = text.replace(old2, new2)
                  path.write_text(text, encoding="utf-8")
                  print("pgAdmin manager.passexec patches applied (both)")
              elif count1 != 1 or count2 != 1:
                  print(
                      f"Could not patch manager passexec (c1={count1},c2={count2})",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              PY
              "${python_bin}" /tmp/patch-manager-passexec.py
              # Mirror the vendor entrypoint setup env so SQLite migrations stay non-interactive.
              export PGADMIN_SETUP_EMAIL="${PGADMIN_SETUP_EMAIL:-${PGADMIN_DEFAULT_EMAIL:-}}"
              export PGADMIN_SETUP_PASSWORD="${PGADMIN_SETUP_PASSWORD:-${PGADMIN_DEFAULT_PASSWORD:-}}"
              exec "${python_bin}" -m gunicorn \
                --limit-request-line "${GUNICORN_LIMIT_REQUEST_LINE:-8190}" \
                --limit-request-fields "${GUNICORN_LIMIT_REQUEST_FIELDS:-100}" \
                --limit-request-field_size "${GUNICORN_LIMIT_REQUEST_FIELD_SIZE:-8190}" \
                --timeout "${GUNICORN_TIMEOUT:-86400}" \
                --bind "${PGADMIN_LISTEN_ADDRESS:-[::]}:${PGADMIN_LISTEN_PORT:-80}" \
                -w 1 \
                --threads "${GUNICORN_THREADS:-25}" \
                --access-logfile "${GUNICORN_ACCESS_LOGFILE:--}" \
                -c gunicorn_config.py \
                run_pgadmin:app
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    python_bin=/tmp/python3.14.no-cap
                    cp /usr/local/bin/python3.14 "${python_bin}"
                    chmod 0755 "${python_bin}"
                    export PYTHONPATH=/venv/lib/python3.14/site-packages:/usr/local/lib/python3.14/site-packages
                    cat > /tmp/load-shared-servers.py <<'PY'
                    import os
                    import sqlite3
                    import subprocess
                    import sys
                    import time

                    db_path = "/var/lib/pgadmin/pgadmin4.db"
                    deadline = time.time() + 120

                    while time.time() < deadline:
                        if os.path.exists(db_path) and os.path.getsize(db_path) > 0:
                            conn = None
                            try:
                                conn = sqlite3.connect(db_path)
                                cur = conn.cursor()
                                cur.execute(
                                    "select 1 from sqlite_master where type='table' and name='sharedserver'"
                                )
                                if cur.fetchone():
                                    break
                            except sqlite3.Error:
                                pass
                            finally:
                                if conn is not None:
                                    conn.close()
                        time.sleep(1)
                    else:
                        print(
                            "Timed out waiting for pgAdmin configuration database",
                            file=sys.stderr,
                        )
                        sys.exit(1)

                    subprocess.run(
                        [
                            "/tmp/python3.14.no-cap",
                            "/pgadmin4/setup.py",
                            "load-servers",
                            "/config/pgadmin4-servers.json",
                            "--user",
                            os.environ["PGADMIN_DEFAULT_EMAIL"],
                            "--sqlite-path",
                            db_path,
                            "--replace",
                        ],
                        check=True,
                    )

                    conn = sqlite3.connect(db_path)
                    try:
                        cur = conn.cursor()
                        owner_passexec_count = cur.execute(
                            """
                            select count(*)
                            from server
                            where shared = 1
                              and passexec_cmd is not null
                              and passexec_cmd != ''
                            """
                        ).fetchone()[0]
                        cur.execute(
                            """
                            update sharedserver
                            set passexec_cmd = (
                                    select server.passexec_cmd
                                    from server
                                    where server.id = sharedserver.osid
                                ),
                                passexec_expiration = (
                                    select server.passexec_expiration
                                    from server
                                    where server.id = sharedserver.osid
                                )
                            where exists (
                                select 1
                                from server
                                where server.id = sharedserver.osid
                                  and server.passexec_cmd is not null
                                  and server.passexec_cmd != ''
                            )
                            """
                        )
                        sharedserver_repair_count = cur.rowcount
                        conn.commit()
                    finally:
                        conn.close()

                    print(
                        "pgAdmin owner servers with password exec commands: "
                        f"{owner_passexec_count}"
                    )
                    print(
                        "pgAdmin shared server password exec rows repaired: "
                        f"{sharedserver_repair_count}"
                    )
                    PY
                    exec "${python_bin}" /tmp/load-shared-servers.py
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: pgadmin4-bootstrap
            - secretRef:
                name: pgadmin4-db-password
          env:
            - name: PGADMIN_DISABLE_POSTFIX
              value: "1"
            - name: PYTHONPATH
              value: /venv/lib/python3.14/site-packages:/venv/lib/python3.14/dist-packages
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -x /tmp/python3.14.no-cap
                  exec /tmp/python3.14.no-cap - <<'PY'
                  import os
                  import sqlite3
                  import sys

                  db_path = "/var/lib/pgadmin/pgadmin4.db"

                  if not os.path.exists(db_path) or os.path.getsize(db_path) == 0:
                      sys.exit(1)

                  try:
                    conn = sqlite3.connect(db_path)
                    cur = conn.cursor()
                    cur.execute(
                        "select 1 from server where shared = 1 limit 1"
                    )
                    sys.exit(0 if cur.fetchone() else 1)
                  except sqlite3.Error:
                    sys.exit(1)
                  PY
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: pgadmin-config
              mountPath: /pgadmin4/config_local.py
              subPath: config_local.py
              readOnly: true
            - name: pgadmin-config
              mountPath: /pgadmin4/master-password-hook.sh
              subPath: master-password-hook.sh
              readOnly: true
            - name: pgadmin-servers
              mountPath: /config
              readOnly: true
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin4-data
        - name: pgadmin-config
          emptyDir: {}
        - name: pgadmin-servers
          configMap:
            name: pgadmin4-servers
