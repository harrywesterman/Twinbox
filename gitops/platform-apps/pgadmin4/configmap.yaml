apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin4-servers
  namespace: pgadmin4
data:
  pgadmin4-servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Authentik Database",
          "Group": "Shared Servers",
          "Host": "authentik-db-pooler-rw-session.databases.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "authentik",
          "SharedUsername": "authentik",
          "PasswordExecCommand": "printf %s \"$PGADMIN_AUTHENTIK_DB_PASSWORD\"",
          "Shared": true,
          "ConnectionParameters": {
            "sslmode": "prefer"
          },
          "Comment": "CloudNativePG pooler for the Authentik cluster"
        }
      }
    }
