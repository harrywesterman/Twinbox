apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixelfed
  namespace: pixelfed
  labels:
    app.kubernetes.io/name: pixelfed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pixelfed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pixelfed
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pixelfed
          image: ghcr.io/jippi/docker-pixelfed:nightly-2026-05-10-staging-apache-8.4-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: pixelfed-bootstrap
          env:
            - name: APP_NAME
              value: Pixelfed
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pixelfed.__ZONE_NAME__
            - name: APP_DOMAIN
              value: pixelfed.__ZONE_NAME__
            - name: ADMIN_DOMAIN
              value: pixelfed.__ZONE_NAME__
            - name: SESSION_DOMAIN
              value: pixelfed.__ZONE_NAME__
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: pixelfed-db-pooler-rw-session.databases.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: pixelfed
            - name: REDIS_CLIENT
              value: phpredis
            - name: REDIS_SCHEME
              value: tcp
            - name: REDIS_HOST
              value: pixelfed-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "null"
            - name: SESSION_DRIVER
              value: redis
            - name: CACHE_DRIVER
              value: redis
            - name: CACHE_STORE
              value: redis
            - name: QUEUE_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
            - name: BROADCAST_DRIVER
              value: log
            - name: LOG_CHANNEL
              value: stack
            - name: TRUST_PROXIES
              value: "*"
            - name: OPEN_REGISTRATION
              value: "true"
            - name: ENFORCE_EMAIL_VERIFICATION
              value: "false"
            - name: INSTANCE_DISCOVER_PUBLIC
              value: "true"
            - name: INSTANCE_PUBLIC_HASHTAGS
              value: "false"
            - name: INSTANCE_PUBLIC_LOCAL_TIMELINE
              value: "false"
            - name: RESTRICTED_INSTANCE
              value: "false"
            - name: STORIES_ENABLED
              value: "false"
            - name: ACTIVITY_PUB
              value: "true"
            - name: AP_REMOTE_FOLLOW
              value: "true"
            - name: AP_INBOX
              value: "true"
            - name: AP_OUTBOX
              value: "true"
            - name: AP_SHAREDINBOX
              value: "true"
            - name: OAUTH_ENABLED
              value: "true"
            - name: PF_ENABLE_CLOUD
              value: "false"
            - name: PF_OPTIMIZE_IMAGES
              value: "true"
            - name: ENABLE_CONFIG_CACHE
              value: "true"
            - name: PF_MAX_USERS
              value: "1000"
            - name: PF_OPTIMIZE_VIDEOS
              value: "true"
            - name: IMAGE_QUALITY
              value: "80"
            - name: MAX_PHOTO_SIZE
              value: "15000"
            - name: MAX_CAPTION_LENGTH
              value: "500"
            - name: MAX_ALBUM_LENGTH
              value: "4"
            - name: SESSION_LIFETIME
              value: "86400"
            - name: HORIZON_PREFIX
              value: horizon-
            - name: MAIL_DRIVER
              value: log
            - name: MAIL_FROM_ADDRESS
              value: no-reply@pixelfed.__ZONE_NAME__
            - name: MAIL_FROM_NAME
              value: Pixelfed
            - name: INSTANCE_CONTACT_EMAIL
              value: "admin@pixelfed.__ZONE_NAME__"
            - name: PHP_POST_MAX_SIZE
              value: 500M
            - name: PHP_UPLOAD_MAX_FILE_SIZE
              value: 500M
            - name: PHP_OPCACHE_ENABLE
              value: "1"
            - name: SSL_MODE
              value: off
            - name: AUTORUN_ENABLED
              value: "true"
            - name: AUTORUN_LARAVEL_MIGRATION
              value: "true"
            - name: AUTORUN_LARAVEL_MIGRATION_ISOLATION
              value: "true"
            - name: AUTORUN_LARAVEL_STORAGE_LINK
              value: "true"
            - name: AUTORUN_LARAVEL_EVENT_CACHE
              value: "true"
            - name: AUTORUN_LARAVEL_ROUTE_CACHE
              value: "true"
            - name: AUTORUN_LARAVEL_VIEW_CACHE
              value: "true"
            - name: AUTORUN_LARAVEL_CONFIG_CACHE
              value: "true"
            - name: PF_OIDC_ENABLED
              value: "true"
            - name: PF_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_CLIENT_ID
            - name: PF_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_CLIENT_SECRET
            - name: PF_OIDC_AUTHORIZE_URL
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_AUTHORIZE_URL
            - name: PF_OIDC_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_TOKEN_URL
            - name: PF_OIDC_PROFILE_URL
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_PROFILE_URL
            - name: PF_OIDC_LOGOUT_URL
              valueFrom:
                secretKeyRef:
                  name: pixelfed-bootstrap
                  key: PF_OIDC_LOGOUT_URL
            - name: PF_OIDC_SCOPES
              value: "openid profile email"
            - name: PF_OIDC_USERNAME_FIELD
              value: "preferred_username"
            - name: PF_OIDC_FIELD_ID
              value: "sub"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 90
            periodSeconds: 5
          volumeMounts:
            - name: pixelfed-data
              mountPath: /var/www/storage
            - name: pixelfed-cache
              mountPath: /var/www/bootstrap/cache
      volumes:
        - name: pixelfed-data
          persistentVolumeClaim:
            claimName: pixelfed-data
        - name: pixelfed-cache
          emptyDir: {}
