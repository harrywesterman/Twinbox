apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pixelfed
  namespace: pixelfed
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pixelfed.__ZONE_NAME__`)
      services:
        - kind: Service
          name: pixelfed
          port: 80
  tls: {}
