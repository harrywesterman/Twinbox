apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailu-relay-egress
  namespace: netbird
---
apiVersion: v1
kind: Service
metadata:
  name: mailu-relay-egress
  namespace: netbird
  labels:
    app.kubernetes.io/name: mailu-relay-egress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailu-relay-egress
  ports:
    - name: smtp-relay
      port: 2525
      targetPort: smtp-relay
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailu-relay-egress
  namespace: netbird
  labels:
    app.kubernetes.io/name: mailu-relay-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailu-relay-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailu-relay-egress
    spec:
      serviceAccountName: mailu-relay-egress
      containers:
        - name: netbird
          image: netbirdio/netbird:0.73.2
          imagePullPolicy: IfNotPresent
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: mailu-relay-egress
                  key: NB_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: mailu-relay-egress
                  key: NB_MANAGEMENT_URL
            - name: NB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: mailu-relay-egress
                  key: NB_HOSTNAME
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: netbird-state
              mountPath: /var/lib/netbird
          livenessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - live
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        - name: haproxy
          image: haproxy:3.0.23-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mailu-relay-egress
          ports:
            - name: smtp-relay
              containerPort: 2525
              protocol: TCP
          command:
            - /bin/sh
            - -ec
            - |
              RELAY_TARGET_HOST="$(printf '%s' "${RELAY_TARGET_HOST}" | tr -d '\n\r')"
              cat >/tmp/haproxy.cfg <<EOF
              global
                log stdout format raw local0
                maxconn 64

              defaults
                log global
                mode tcp
                timeout connect 10s
                timeout client 5m
                timeout server 5m

              frontend mailu_relay
                bind :2525
                default_backend bastion_relay

              backend bastion_relay
                server bastion ${RELAY_TARGET_HOST}:${RELAY_TARGET_PORT} check
              EOF
              exec haproxy -f /tmp/haproxy.cfg -db
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: smtp-relay
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: smtp-relay
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        - name: probe
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - sleep 3650d
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: netbird-state
          emptyDir: {}
