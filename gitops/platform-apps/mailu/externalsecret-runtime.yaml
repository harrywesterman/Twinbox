apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailu-runtime
  namespace: mailu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mailu-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: secret-key
      remoteRef:
        key: twinbox/global/mailu-runtime
        property: secret-key
    - secretKey: api-token
      remoteRef:
        key: twinbox/global/mailu-runtime
        property: api-token
    - secretKey: initial-admin-password
      remoteRef:
        key: twinbox/global/mailu-runtime
        property: initial-admin-password
