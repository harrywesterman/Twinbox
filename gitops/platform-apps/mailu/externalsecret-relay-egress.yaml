apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailu-relay-egress
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mailu-relay-egress
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: twinbox/global/netbird-mailu-relay-egress
        property: NB_SETUP_KEY
    - secretKey: NB_MANAGEMENT_URL
      remoteRef:
        key: twinbox/global/netbird-mailu-relay-egress
        property: NB_MANAGEMENT_URL
    - secretKey: NB_HOSTNAME
      remoteRef:
        key: twinbox/global/netbird-mailu-relay-egress
        property: NB_HOSTNAME
