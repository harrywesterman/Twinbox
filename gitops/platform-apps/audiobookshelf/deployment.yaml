apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 13378
          env:
            - name: CONFIG_PATH
              value: /data/config
            - name: METADATA_PATH
              value: /data/metadata
            - name: BACKUP_PATH
              value: /data/metadata/backups
            - name: PORT
              value: "13378"
            - name: HOST
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /data
      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data
