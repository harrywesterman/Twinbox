apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`audiobookshelf.__ZONE_NAME__`)
      services:
        - kind: Service
          name: audiobookshelf
          port: 80
  tls: {}
