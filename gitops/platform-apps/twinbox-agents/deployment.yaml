apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinbox-agents
  namespace: twinbox-agents
  labels:
    app.kubernetes.io/name: twinbox-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twinbox-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinbox-agents
    spec:
      serviceAccountName: twinbox-agents
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents
          image: ghcr.io/harrywesterman/twinbox-agents
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_PROVIDER_CONFIG_PATH
              value: /config/provider.json
          envFrom:
            - configMapRef:
                name: twinbox-agents-env
            - secretRef:
                name: twinbox-agents-runtime
                optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: twinbox-agents-data
              mountPath: /data
            - name: twinbox-agents-provider
              mountPath: /config
              readOnly: true
      volumes:
        - name: twinbox-agents-data
          persistentVolumeClaim:
            claimName: twinbox-agents-data
        - name: twinbox-agents-provider
          configMap:
            name: twinbox-agents-provider
            optional: true
