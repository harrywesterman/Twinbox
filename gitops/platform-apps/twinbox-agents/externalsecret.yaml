apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twinbox-agents-runtime
  namespace: twinbox-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: twinbox-agents-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: twinbox/global/twinbox-agents
