apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: dashy
  labels:
    app.kubernetes.io/name: dashy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashy
    spec:
      initContainers:
        - name: copy-item-icons
          image: ghcr.io/harrywesterman/twinbox-manager-worker:sha-b265ee1
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /app/user-data/item-icons
              find /opt/twinbox/manager-web/src/assets/step-icons -maxdepth 1 -type f \( -name '*.svg' -o -name '*.png' \) -exec cp -f {} /app/user-data/item-icons/ \;
          volumeMounts:
            - name: data
              mountPath: /app/user-data
        - name: render-config
          image: python:3.14-alpine
          command:
            - python
            - -c
            - |
              from pathlib import Path
              import os

              template = Path("/config-template/conf.yml.tpl").read_text(encoding="utf-8")
              for key in (
                  "DASHY_OIDC_CLIENT_ID",
                  "DASHY_OIDC_ENDPOINT",
                  "DASHY_OIDC_SCOPE",
              ):
                  template = template.replace(f"__{key}__", os.environ[key])

              target = Path("/app/user-data/config.yml")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(template, encoding="utf-8")
              legacy = Path("/app/user-data/conf.yml")
              legacy.write_text(template, encoding="utf-8")
          envFrom:
            - secretRef:
                name: dashy-oidc
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: data
              mountPath: /app/user-data
      containers:
        - name: dashy
          image: ghcr.io/lissy93/dashy@sha256:be489008a0ea4f60030ca3e25e55007425d3dfa8ecf48b5722ad9c4f3a12bff6
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 120
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/user-data
      volumes:
        - name: config-template
          configMap:
            name: dashy-config
        - name: data
          persistentVolumeClaim:
            claimName: dashy-data
