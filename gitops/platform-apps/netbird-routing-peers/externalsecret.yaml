apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-routing-peers
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-routing-peers
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: twinbox/global/netbird-routing-peers
        property: NB_SETUP_KEY
    - secretKey: NB_MANAGEMENT_URL
      remoteRef:
        key: twinbox/global/netbird-routing-peers
        property: NB_MANAGEMENT_URL
