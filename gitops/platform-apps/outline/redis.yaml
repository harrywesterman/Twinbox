apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-redis
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-redis
    spec:
      containers:
        - name: redis
          image: redis:8.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: outline-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: outline-redis
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: outline-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
