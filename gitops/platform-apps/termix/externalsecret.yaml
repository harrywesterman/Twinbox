apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-bootstrap
  namespace: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: termix-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_CLIENT_SECRET
    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_ISSUER_URL
    - secretKey: OIDC_AUTHORIZATION_URL
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_AUTHORIZATION_URL
    - secretKey: OIDC_TOKEN_URL
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_TOKEN_URL
    - secretKey: OIDC_USERINFO_URL
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_USERINFO_URL
    - secretKey: OIDC_SCOPES
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_SCOPES
    - secretKey: OIDC_ADMIN_GROUP
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_ADMIN_GROUP
    - secretKey: OIDC_ALLOWED_USERS
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_ALLOWED_USERS
    - secretKey: OIDC_ALLOW_REGISTRATION
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_ALLOW_REGISTRATION
    - secretKey: OIDC_FORCE_HTTPS
      remoteRef:
        key: twinbox/global/termix
        property: OIDC_FORCE_HTTPS
    - secretKey: TERMIX_SSH_PRIVATE_KEY
      remoteRef:
        key: twinbox/global/termix
        property: SSH_PRIVATE_KEY
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: twinbox/global/netbird-browser-ssh
        property: NB_SETUP_KEY
    - secretKey: NB_MANAGEMENT_URL
      remoteRef:
        key: twinbox/global/netbird-browser-ssh
        property: NB_MANAGEMENT_URL
    - secretKey: NB_HOSTNAME
      remoteRef:
        key: twinbox/global/netbird-browser-ssh
        property: NB_HOSTNAME
