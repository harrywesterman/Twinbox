apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: termix
  namespace: termix
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`termix.__ZONE_NAME__`)
      middlewares:
        - name: authentik-forwardauth
          namespace: authentik
      services:
        - kind: Service
          name: termix
          namespace: termix
          port: 80
  tls: {}
