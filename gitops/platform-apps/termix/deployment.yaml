apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
  labels:
    app.kubernetes.io/name: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: termix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: termix
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4090
              protocol: TCP
          env:
            - name: PORT
              value: "4090"
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /app/data
            - name: LOG_LEVEL
              value: info
            - name: ENABLE_GUACAMOLE
              value: "true"
            - name: GUACD_HOST
              value: localhost
            - name: GUACD_PORT
              value: "4822"
          envFrom:
            - secretRef:
                name: termix-bootstrap
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: termix-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
        - name: guacd
          image: guacamole/guacd:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: netbird
          image: netbirdio/netbird:0.72.4
          imagePullPolicy: IfNotPresent
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_MANAGEMENT_URL
            - name: NB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_HOSTNAME
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: termix-data
              mountPath: /var/lib/netbird
              subPath: netbird-state
          livenessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - live
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: termix-data
          persistentVolumeClaim:
            claimName: termix-data
