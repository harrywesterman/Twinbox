apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
  labels:
    app.kubernetes.io/name: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: termix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: termix
      annotations:
        twinbox.dev/termix-patch-revision: "2026-06-23-oidc-admin-browser-ssh-role"
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:release-2.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - |
              export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
              node /tmp/termix-users-rbac-patch.mjs
              exec /entrypoint.sh
          ports:
            - name: http
              containerPort: 4090
              protocol: TCP
          env:
            - name: PORT
              value: "4090"
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /app/data
            - name: LOG_LEVEL
              value: info
            - name: ENABLE_GUACAMOLE
              value: "true"
            - name: GUACD_HOST
              value: localhost
            - name: GUACD_PORT
              value: "4822"
            - name: TERMIX_BROWSER_ROLE_NAME
              value: browser-ssh
          envFrom:
            - secretRef:
                name: termix-bootstrap
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: termix-data
              mountPath: /app/data
            - name: opkssh-config
              mountPath: /app/data/.opk/config.yml
              subPath: config.yml
              readOnly: true
            - name: termix-patch
              mountPath: /app/dist/backend/backend/ssh/opkssh-auth.js
              subPath: opkssh-auth.js
              readOnly: true
            - name: termix-patch
              mountPath: /app/dist/backend/backend/database/routes/host.js
              subPath: host.js
              readOnly: true
            - name: termix-patch
              mountPath: /tmp/termix-users-rbac-patch.mjs
              subPath: termix-users-rbac-patch.mjs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
        - name: guacd
          image: guacamole/guacd:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: netbird
          image: netbirdio/netbird:0.76.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_MANAGEMENT_URL
            - name: NB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: termix-bootstrap
                  key: NB_HOSTNAME
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: termix-data
              mountPath: /var/lib/netbird
              subPath: netbird-state
          livenessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - live
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: termix-data
          persistentVolumeClaim:
            claimName: termix-data
        - name: opkssh-config
          secret:
            secretName: termix-opkssh-config
            items:
              - key: config.yml
                path: config.yml
        - name: termix-patch
          configMap:
            name: termix-patch
