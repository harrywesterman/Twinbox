apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hedgedoc
  namespace: hedgedoc
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hedgedoc.__ZONE_NAME__`)
      services:
        - kind: Service
          name: hedgedoc
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hedgedoc-netbird
  namespace: hedgedoc
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`hedgedoc.__ZONE_NAME__`)
      middlewares:
        - name: hedgedoc-netbird-forwarded-headers
      services:
        - kind: Service
          name: hedgedoc
          port: 80
