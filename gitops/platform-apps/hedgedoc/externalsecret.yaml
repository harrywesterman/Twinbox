apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hedgedoc-bootstrap
  namespace: hedgedoc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hedgedoc-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: CMD_DB_URL
      remoteRef:
        key: twinbox/global/hedgedoc
        property: HEDGEDOC_DATABASE_URL
    - secretKey: CMD_SESSION_SECRET
      remoteRef:
        key: twinbox/global/hedgedoc
        property: HEDGEDOC_SESSION_SECRET
    - secretKey: CMD_OAUTH2_CLIENT_ID
      remoteRef:
        key: twinbox/global/hedgedoc
        property: HEDGEDOC_OAUTH2_CLIENT_ID
    - secretKey: CMD_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/hedgedoc
        property: HEDGEDOC_OAUTH2_CLIENT_SECRET
