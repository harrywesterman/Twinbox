apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel-agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: henrygd/beszel-agent:0.18.7
          env:
            - name: HUB_URL
              valueFrom:
                secretKeyRef:
                  name: beszel-agent-credentials
                  key: hub_url
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: beszel-agent-credentials
                  key: key
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel-agent-credentials
                  key: token
            - name: CONTAINER_RUNTIME
              value: "containerd"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: agent-data
              mountPath: /var/lib/beszel-agent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: agent-data
          hostPath:
            path: /var/lib/beszel-agent
            type: DirectoryOrCreate
