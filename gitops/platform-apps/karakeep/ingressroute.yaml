apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: karakeep
  namespace: karakeep
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`karakeep.__ZONE_NAME__`)
      services:
        - kind: Service
          name: karakeep
          port: 3000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: karakeep-netbird
  namespace: karakeep
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`karakeep.__ZONE_NAME__`)
      services:
        - kind: Service
          name: karakeep
          port: 3000
