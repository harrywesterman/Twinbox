apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-ai-provider
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: karakeep-ai-provider
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: OPENAI_BASE_URL
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: OPENAI_BASE_URL
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: OPENAI_API_KEY
    - secretKey: INFERENCE_TEXT_MODEL
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: INFERENCE_TEXT_MODEL
    - secretKey: INFERENCE_IMAGE_MODEL
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: INFERENCE_IMAGE_MODEL
