apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: karakeep
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: twinbox/global/karakeep
        property: KARAKEEP_NEXTAUTH_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: twinbox/global/karakeep
        property: KARAKEEP_OAUTH_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/karakeep
        property: KARAKEEP_OAUTH_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-meilesearch
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: karakeep-meilesearch
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: twinbox/global/karakeep
        property: KARAKEEP_MEILI_MASTER_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
