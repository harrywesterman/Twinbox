apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: penpot
  namespace: penpot
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`penpot.__ZONE_NAME__`)
      services:
        - kind: Service
          name: penpot
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: penpot-netbird
  namespace: penpot
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`penpot.__ZONE_NAME__`)
      services:
        - kind: Service
          name: penpot
          port: 8080
