apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-valkey-data
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-valkey
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9-alpine
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --save
            - "30"
            - "1"
            - --loglevel
            - warning
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: penpot-valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: penpot-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
