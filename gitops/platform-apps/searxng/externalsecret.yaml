apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-config
  namespace: searxng
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: searxng-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: twinbox/global/searxng
        property: SEARXNG_SECRET
