apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng
data:
  settings.yml: |
    use_default_settings: true

    general:
      debug: false
      instance_name: "SearXNG"

    search:
      safe_search: 2
      autocomplete: duckduckgo
      formats:
        - html

    server:
      secret_key: "ultrasecretkey"
      limiter: true
      image_proxy: true

    valkey:
      url: valkey://searxng-valkey:6379/0
