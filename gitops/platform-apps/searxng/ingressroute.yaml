apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
  namespace: searxng
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`searxng.__ZONE_NAME__`)
      services:
        - kind: Service
          name: searxng
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-netbird
  namespace: searxng
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`searxng.__ZONE_NAME__`)
      services:
        - kind: Service
          name: searxng
          port: 80
