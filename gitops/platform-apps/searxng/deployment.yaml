apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.5.5-d3566fe8a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_BIND_ADDRESS
              value: "0.0.0.0"
            - name: SEARXNG_BASE_URL
              value: https://searxng.__ZONE_NAME__/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-config
                  key: SEARXNG_SECRET
            - name: SEARXNG_VALKEY_URL
              value: valkey://searxng-valkey:6379/0
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: searxng-data
              mountPath: /var/cache/searxng
      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
        - name: searxng-data
          persistentVolumeClaim:
            claimName: searxng-data
