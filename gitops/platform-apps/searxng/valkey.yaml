apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-valkey
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --save
            - "30"
            - "1"
            - --loglevel
            - warning
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: searxng-valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-valkey
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng-valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
