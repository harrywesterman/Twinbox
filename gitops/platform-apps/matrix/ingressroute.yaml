# Matrix (Synapse) - Public
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix
  namespace: matrix
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`matrix.__ZONE_NAME__`)
      services:
        - kind: Service
          name: ess-synapse
          port: 8008
  tls: {}
---
# Matrix (Synapse) - Public
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-netbird
  namespace: matrix
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`matrix.__ZONE_NAME__`)
      services:
        - kind: Service
          name: ess-synapse
          port: 8008
---
