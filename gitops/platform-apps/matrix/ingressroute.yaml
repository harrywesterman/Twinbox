# Matrix RTC (Element Call) - Public
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mrtc
  namespace: matrix
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`mrtc.__ZONE_NAME__`) && PathPrefix(`/sfu/get`)
      services:
        - kind: Service
          name: ess-matrix-rtc-authorisation-service
          port: 8080
    - kind: Rule
      match: Host(`mrtc.__ZONE_NAME__`) && PathPrefix(`/get_token`)
      services:
        - kind: Service
          name: ess-matrix-rtc-authorisation-service
          port: 8080
    - kind: Rule
      match: Host(`mrtc.__ZONE_NAME__`) && PathPrefix(`/`) && !PathPrefix(`/sfu/get`) && !PathPrefix(`/get_token`)
      services:
        - kind: Service
          name: ess-matrix-rtc-sfu
          port: 7880
  tls: {}
---
# Matrix RTC (Element Call) - Public
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
