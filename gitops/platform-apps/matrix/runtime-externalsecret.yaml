apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-runtime
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: matrix-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: SYNAPSE_SHARED_SECRET
      remoteRef:
        key: twinbox/global/matrix-runtime
        property: MATRIX_SYNAPSE_SHARED_SECRET
    - secretKey: MAS_ENCRYPTION_SECRET
      remoteRef:
        key: twinbox/global/matrix-runtime
        property: MATRIX_MAS_ENCRYPTION_SECRET
    - secretKey: MAS_SIGNING_KEY
      remoteRef:
        key: twinbox/global/matrix-runtime
        property: MATRIX_MAS_SIGNING_KEY
