apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-config
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: matrix-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        oidc-upstream.yaml: |-
          {{- .MATRIX_OIDC_UPSTREAM_CONFIG | nindent 10 }}
        policy.yaml: |-
          {{- .MATRIX_POLICY_CONFIG | nindent 10 }}
  data:
    - secretKey: MATRIX_OIDC_UPSTREAM_CONFIG
      remoteRef:
        key: twinbox/global/matrix-oidc
        property: MATRIX_OIDC_UPSTREAM_CONFIG
    - secretKey: MATRIX_POLICY_CONFIG
      remoteRef:
        key: twinbox/global/matrix-oidc
        property: MATRIX_POLICY_CONFIG
