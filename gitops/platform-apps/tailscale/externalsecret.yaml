apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tailscale-auth
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: twinbox/global/tailscale
        property: TS_AUTHKEY
    - secretKey: TS_CLIENT_ID
      remoteRef:
        key: twinbox/global/tailscale
        property: TS_CLIENT_ID
    - secretKey: TS_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/tailscale
        property: TS_CLIENT_SECRET
