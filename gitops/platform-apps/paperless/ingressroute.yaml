apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paperless.__ZONE_NAME__`)
      services:
        - kind: Service
          name: paperless
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless-netbird
  namespace: paperless
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`paperless.__ZONE_NAME__`)
      services:
        - kind: Service
          name: paperless
          port: 80
