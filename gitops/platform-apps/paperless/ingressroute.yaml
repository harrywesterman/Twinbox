apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paperless.__ZONE_NAME__`)
      services:
        - kind: Service
          name: paperless
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless-wiredoor
  namespace: paperless
spec:
  entryPoints:
    - webwiredoor
  routes:
    - kind: Rule
      match: Host(`paperless.__ZONE_NAME__`)
      services:
        - kind: Service
          name: paperless
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless-tailscale
  namespace: paperless
spec:
  entryPoints:
    - webtailscale
  routes:
    - kind: Rule
      match: Host(`paperless.__ZONE_NAME__`)
      services:
        - kind: Service
          name: paperless
          port: 80
  tls: {}
