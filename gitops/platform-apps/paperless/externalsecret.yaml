apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-config
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_SECRET_KEY
    - secretKey: PAPERLESS_ADMIN_USER
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_ADMIN_USER
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_ADMIN_PASSWORD
    - secretKey: PAPERLESS_ADMIN_MAIL
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_ADMIN_MAIL
    - secretKey: PAPERLESS_DBUSER
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_DBUSER
    - secretKey: PAPERLESS_DBPASS
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_DBPASS
    - secretKey: PAPERLESS_SOCIALACCOUNT_PROVIDERS
      remoteRef:
        key: twinbox/global/paperless
        property: PAPERLESS_SOCIALACCOUNT_PROVIDERS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai-provider
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-ai-provider
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: PAPERLESS_AI_ENABLED
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_ENABLED
    - secretKey: PAPERLESS_AI_LLM_BACKEND
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_LLM_BACKEND
    - secretKey: PAPERLESS_AI_LLM_MODEL
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_LLM_MODEL
    - secretKey: PAPERLESS_AI_LLM_API_KEY
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_LLM_API_KEY
    - secretKey: PAPERLESS_AI_LLM_ENDPOINT
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_LLM_ENDPOINT
    - secretKey: PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS
