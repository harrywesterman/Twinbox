apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-url
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: coder-db-url
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: url
      remoteRef:
        key: twinbox/global/coder
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: coder-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: client_id
      remoteRef:
        key: twinbox/global/coder-oidc
        property: CODER_OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: twinbox/global/coder-oidc
        property: CODER_OIDC_CLIENT_SECRET