apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prometheus.__ZONE_NAME__`)
      services:
        - kind: Service
          name: prometheus-operated
          port: 9090
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-netbird
  namespace: monitoring
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`prometheus.__ZONE_NAME__`)
      services:
        - kind: Service
          name: prometheus-operated
          port: 9090
