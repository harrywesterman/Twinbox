apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: ghcr.io/stirling-tools/stirling-pdf:2.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SECURITY_ENABLELOGIN
              value: "true"
            - name: SECURITY_LOGINMETHOD
              value: all
            - name: SECURITY_INITIALLOGIN_USERNAME
              value: admin
            - name: SECURITY_INITIALLOGIN_PASSWORD
              value: stirling
            - name: ST_USE_AUTH_FILE
              value: "false"
            - name: SECURITY_CUSTOMGLOBALAPIKEY
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-config
                  key: STIRLING_PDF_API_KEY
            - name: ST_BASE_URL
              value: https://stirling-pdf.__ZONE_NAME__/
            - name: ST_ENABLE_TRASH_CLEANUP
              value: "true"
            - name: ST_ENABLE_DELETE_ORPHAN_UPLOAD_FOLDERS
              value: "true"
            - name: ST_PDF_AUTO_UPDATE_CONVERTERS
              value: "true"
            - name: SECURITY_OAUTH2_ENABLED
              value: "true"
            - name: SECURITY_OAUTH2_ISSUER
              value: https://authentik.__ZONE_NAME__/application/o/stirling-pdf/
            - name: SECURITY_OAUTH2_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-config
                  key: STIRLING_PDF_OAUTH2_CLIENT_ID
            - name: SECURITY_OAUTH2_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-config
                  key: STIRLING_PDF_OAUTH2_CLIENT_SECRET
            - name: SECURITY_OAUTH2_SCOPES
              value: openid, profile, email
            - name: SECURITY_OAUTH2_USEASUSERNAME
              value: preferred_username
            - name: SECURITY_OAUTH2_PROVIDER
              value: authentik
            - name: SECURITY_OAUTH2_AUTOCREATEUSER
              value: "true"
            - name: SECURITY_OAUTH2_BLOCKREGISTRATION
              value: "false"
            - name: ST_CUSTOM_IDP_LOGO_URL
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 90
            periodSeconds: 5
          volumeMounts:
            - name: stirling-pdf-data
              mountPath: /configs
              subPath: configs
            - name: stirling-pdf-data
              mountPath: /customFiles
              subPath: customFiles
            - name: stirling-pdf-data
              mountPath: /logs
              subPath: logs
      volumes:
        - name: stirling-pdf-data
          persistentVolumeClaim:
            claimName: stirling-pdf-data
