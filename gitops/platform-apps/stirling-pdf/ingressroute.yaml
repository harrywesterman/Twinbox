apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`stirling-pdf.__ZONE_NAME__`)
      middlewares:
        - name: authentik-forwardauth
      services:
        - kind: Service
          name: stirling-pdf
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf-netbird
  namespace: stirling-pdf
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`stirling-pdf.__ZONE_NAME__`)
      middlewares:
        - name: authentik-forwardauth
      services:
        - kind: Service
          name: stirling-pdf
          port: 80
