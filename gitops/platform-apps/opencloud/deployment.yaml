apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-storage
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              umask 0002
              mkdir -p /opencloud/config /opencloud/data /opencloud/apps
          volumeMounts:
            - name: config
              mountPath: /opencloud/config
            - name: data
              mountPath: /opencloud/data
            - name: apps
              mountPath: /opencloud/apps
        - name: wait-for-ldap
          image: bitnamilegacy/openldap:2.6.10-debian-12-r4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              until ldapsearch -H "$OC_LDAP_URI" -x -D "$OC_LDAP_BIND_DN" -w "$OC_LDAP_BIND_PASSWORD" -b "$OC_LDAP_USER_BASE_DN" -s base dn >/dev/null &&
                    ldapsearch -H "$OC_LDAP_URI" -x -D "$OC_LDAP_BIND_DN" -w "$OC_LDAP_BIND_PASSWORD" -b "$OC_LDAP_GROUP_BASE_DN" -s base dn >/dev/null; do
                echo "Waiting for OpenCloud LDAP directory"
                sleep 5
              done
          envFrom:
            - secretRef:
                name: opencloud-bootstrap
          env:
            - name: LDAPTLS_REQCERT
              value: never
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:6.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              opencloud init --insecure --force-overwrite || true
              exec opencloud server
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9142
              name: gateway
            - containerPort: 9233
              name: registry
          envFrom:
            - secretRef:
                name: opencloud-bootstrap
          env:
            - name: OC_CONFIG_DIR
              value: /opencloud/config
            - name: OC_DATA_DIR
              value: /opencloud/data
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            - name: PROXY_CONFIG_FILE_LOCATION
              value: /etc/opencloud/proxy.yaml
            - name: MICRO_REGISTRY_ADDRESS
              value: 127.0.0.1:9233
            - name: NATS_NATS_HOST
              value: 0.0.0.0
            - name: GATEWAY_GRPC_ADDR
              value: 0.0.0.0:9142
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /opencloud/config
            - name: data
              mountPath: /opencloud/data
            - name: apps
              mountPath: /opencloud/apps
            - name: configmap
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
              readOnly: true
            - name: configmap
              mountPath: /etc/opencloud/proxy.yaml
              subPath: proxy.yaml
              readOnly: true
            - name: configmap
              mountPath: /etc/opencloud/apps.yaml
              subPath: app-registry.yaml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: apps
          persistentVolumeClaim:
            claimName: opencloud-apps
        - name: configmap
          configMap:
            name: opencloud-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-collaboration
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-collaboration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-collaboration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-collaboration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collaboration
          image: opencloudeu/opencloud-rolling:6.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - exec opencloud collaboration server
          ports:
            - containerPort: 9300
              name: http
            - containerPort: 9301
              name: grpc
          envFrom:
            - secretRef:
                name: opencloud-bootstrap
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          env:
            - name: COLLABORATION_HTTP_ADDR
              value: 0.0.0.0:9300
            - name: COLLABORATION_GRPC_ADDR
              value: 0.0.0.0:9301
            - name: MICRO_REGISTRY
              value: nats-js-kv
            - name: OC_URL
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: OC_URL
            - name: OC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: OC_JWT_SECRET
            - name: OC_REVA_GATEWAY
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: OC_REVA_GATEWAY
            - name: MICRO_REGISTRY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: MICRO_REGISTRY_ADDRESS
            - name: COLLABORATION_WOPI_SRC
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_WOPI_SRC
            - name: COLLABORATION_WOPI_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_WOPI_SECRET
            - name: COLLABORATION_APP_NAME
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_APP_NAME
            - name: COLLABORATION_APP_PRODUCT
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_APP_PRODUCT
            - name: COLLABORATION_APP_ADDR
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_APP_ADDR
            - name: COLLABORATION_APP_ICON
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_APP_ICON
            - name: COLLABORATION_APP_INSECURE
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_APP_INSECURE
            - name: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-collabora
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-collabora
  template:
    metadata:
      annotations:
        container.apparmor.security.beta.kubernetes.io/collabora: unconfined
      labels:
        app.kubernetes.io/name: opencloud-collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:25.04.9.4.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: true
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_ADMIN
            seccompProfile:
              type: Unconfined
          command:
            - /bin/bash
            - -ec
            - coolconfig generate-proof-key && /start-collabora-online.sh
          ports:
            - containerPort: 9980
              name: http
          envFrom:
            - secretRef:
                name: opencloud-bootstrap
          env:
            - name: username
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORA_ADMIN_USER
            - name: password
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: COLLABORA_ADMIN_PASSWORD
            - name: aliasgroup1
              value: https://opencloud.__ZONE_NAME__
            - name: domain
              value: opencloud.__ZONE_NAME__|wopiserver.__ZONE_NAME__
            - name: DONT_GEN_SSL_CERT
              value: "YES"
            - name: extra_params
              value: --o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=https://opencloud.__ZONE_NAME__ https://collabora.__ZONE_NAME__ https://wopiserver.__ZONE_NAME__
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-radicale
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-radicale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-radicale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-radicale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radicale
          image: ghcr.io/kozea/radicale:3.7.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config
            - /config/radicale.conf
          ports:
            - containerPort: 5232
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config/radicale.conf
              subPath: radicale.conf
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-radicale-data
---
