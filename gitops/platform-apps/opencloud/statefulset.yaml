apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opencloud-ldap
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-ldap
spec:
  serviceName: opencloud-ldap
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-ldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-ldap
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-certs
          image: bitnamilegacy/openldap:2.6.10-debian-12-r4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
                openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
                  -keyout /certs/server.key \
                  -out /certs/server.crt \
                  -subj "/CN=opencloud-ldap"
              fi
              chmod 0600 /certs/server.key || true
          volumeMounts:
            - name: certs
              mountPath: /certs
      containers:
        - name: ldap
          image: bitnamilegacy/openldap:2.6.10-debian-12-r4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 1389
              name: ldap
            - containerPort: 1636
              name: ldaps
          env:
            - name: LDAP_ADMIN_USERNAME
              value: admin
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: IDM_ADMIN_PASSWORD
            - name: LDAP_ROOT
              value: dc=opencloud,dc=eu
            - name: LDAP_USERS
              value: twinbox
            - name: LDAP_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: opencloud-bootstrap
                  key: IDM_ADMIN_PASSWORD
            - name: LDAP_SKIP_DEFAULT_TREE
              value: "no"
            - name: LDAP_ENABLE_TLS
              value: "yes"
            - name: LDAP_TLS_CERT_FILE
              value: /opt/bitnami/openldap/certs/server.crt
            - name: LDAP_TLS_KEY_FILE
              value: /opt/bitnami/openldap/certs/server.key
            - name: LDAP_TLS_CA_FILE
              value: /opt/bitnami/openldap/certs/server.crt
          readinessProbe:
            tcpSocket:
              port: ldaps
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ldaps
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /bitnami/openldap
            - name: certs
              mountPath: /opt/bitnami/openldap/certs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-ldap-data
        - name: certs
          persistentVolumeClaim:
            claimName: opencloud-ldap-certs
