apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencloud-netbird-forwarded-headers
  namespace: opencloud
  annotations:
    twinbox.io/description: >-
      Keep OpenCloud and its collaboration endpoints on their public HTTPS
      origins behind NetBird Reverse Proxy.
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Port: "443"
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencloud
  namespace: opencloud
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`opencloud.__ZONE_NAME__`)
      services:
        - kind: Service
          name: opencloud
          port: 9200
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencloud-netbird
  namespace: opencloud
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`opencloud.__ZONE_NAME__`)
      middlewares:
        - name: opencloud-netbird-forwarded-headers
      services:
        - kind: Service
          name: opencloud
          port: 9200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora
  namespace: opencloud
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`opencloud-collabora.__ZONE_NAME__`)
      services:
        - kind: Service
          name: opencloud-collabora
          port: 9980
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora-netbird
  namespace: opencloud
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`opencloud-collabora.__ZONE_NAME__`)
      middlewares:
        - name: opencloud-netbird-forwarded-headers
      services:
        - kind: Service
          name: opencloud-collabora
          port: 9980
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wopiserver
  namespace: opencloud
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`opencloud-wopiserver.__ZONE_NAME__`)
      services:
        - kind: Service
          name: opencloud-collaboration
          port: 9300
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wopiserver-netbird
  namespace: opencloud
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`opencloud-wopiserver.__ZONE_NAME__`)
      middlewares:
        - name: opencloud-netbird-forwarded-headers
      services:
        - kind: Service
          name: opencloud-collaboration
          port: 9300
