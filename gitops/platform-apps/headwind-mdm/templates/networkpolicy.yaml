apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headwind-mdm-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "headwind-mdm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "headwind-mdm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
