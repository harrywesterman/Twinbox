apiVersion: v1
kind: Service
metadata:
  name: headwind-mdm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "headwind-mdm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "headwind-mdm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
