apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: headwind-mdm-selfsigned
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headwind-mdm-internal-tls
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: headwind-mdm-internal-tls
  dnsNames:
    - {{ .Values.headwind.baseDomain | quote }}
  issuerRef:
    name: headwind-mdm-selfsigned
    kind: Issuer
    group: cert-manager.io
