apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headwind-mdm-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "headwind-mdm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
