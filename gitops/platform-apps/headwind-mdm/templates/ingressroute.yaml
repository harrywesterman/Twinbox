apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-enrollment
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - webnetbird
  routes:
    # The QR URL stores its enrollment route in the URL fragment, so the
    # browser first requests the Headwind UI at /. Keep private APIs closed
    # by allowing only the UI assets, public API, and device files.
    - kind: Rule
      match: Host(`{{ .Values.ingress.enrollmentHost }}`) && (Path(`/`) || PathPrefix(`/app/`) || PathPrefix(`/images/`) || PathPrefix(`/lib/`) || PathPrefix(`/localization/`) || PathPrefix(`/rest/public/`) || PathPrefix(`/files/`))
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-management-netbird
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.managementHost }}`) && PathPrefix(`/`)
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
