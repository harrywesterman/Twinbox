apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-enrollment
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - webnetbird
  routes:
    # The QR URL stores its enrollment route in the URL fragment, so the
    # browser first requests the Headwind UI at /. Keep private APIs closed.
    - kind: Rule
      match: Host(`{{ .Values.ingress.enrollmentHost }}`) && !PathPrefix(`/rest/private/`)
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-management-netbird
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.managementHost }}`) && PathPrefix(`/`)
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
