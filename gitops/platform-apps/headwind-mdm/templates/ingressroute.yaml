apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-enrollment
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - websecure
  routes:
    # The public host intentionally excludes / and /rest/private. Devices need
    # only their bootstrap/sync REST API and APK/file downloads.
    - kind: Rule
      match: Host(`{{ .Values.ingress.enrollmentHost }}`) && (PathPrefix(`/rest/public/`) || PathPrefix(`/files/`))
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headwind-mdm-management-netbird
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.managementHost }}`) && PathPrefix(`/`)
      services:
        - kind: Service
          name: headwind-mdm
          port: 8080
