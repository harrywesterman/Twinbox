apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-config
  namespace: zulip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zulip-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SECRETS_secret_key
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SECRETS_secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ZULIP_DEFAULT_REALM_OWNER_EMAIL
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: ZULIP_DEFAULT_REALM_OWNER_EMAIL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ZULIP_DEFAULT_REALM_OWNER_NAME
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: ZULIP_DEFAULT_REALM_OWNER_NAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_EMAIL_HOST
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_EMAIL_HOST
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_EMAIL_PORT
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_EMAIL_PORT
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_EMAIL_USE_TLS
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_EMAIL_USE_TLS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_EMAIL_HOST_USER
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_EMAIL_HOST_USER
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SECRETS_email_password
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SECRETS_email_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_NOREPLY_EMAIL_ADDRESS
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_NOREPLY_EMAIL_ADDRESS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_TOKENIZED_NOREPLY_EMAIL_ADDRESS
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_TOKENIZED_NOREPLY_EMAIL_ADDRESS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
