apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-db-credentials
  namespace: zulip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zulip-db-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: ZULIP_POSTGRESQL__USERNAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: twinbox/global/zulip-oidc
        property: ZULIP_POSTGRESQL__PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
