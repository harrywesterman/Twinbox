apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`immich.__ZONE_NAME__`)
      services:
        - kind: Service
          name: immich-server
          port: 2283
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-netbird
  namespace: immich
spec:
  entryPoints:
    - webnetbird
  routes:
    - kind: Rule
      match: Host(`immich.__ZONE_NAME__`)
      services:
        - kind: Service
          name: immich-server
          port: 2283
