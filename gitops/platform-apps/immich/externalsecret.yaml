apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: immich-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        immich-config.yaml: |
          server:
            externalDomain: {{ .IMMICH_SERVER_EXTERNAL_DOMAIN | quote }}
            loginPageMessage: ""
            publicUsers: true
          passwordLogin:
            enabled: true
          oauth:
            enabled: {{ .IMMICH_OAUTH_ENABLED }}
            issuerUrl: {{ .IMMICH_OAUTH_ISSUER_URL | quote }}
            clientId: {{ .IMMICH_OAUTH_CLIENT_ID | quote }}
            clientSecret: {{ .IMMICH_OAUTH_CLIENT_SECRET | quote }}
            scope: {{ .IMMICH_OAUTH_SCOPE | quote }}
            buttonText: {{ .IMMICH_OAUTH_BUTTON_TEXT | quote }}
            autoRegister: {{ .IMMICH_OAUTH_AUTO_REGISTER }}
            autoLaunch: {{ .IMMICH_OAUTH_AUTO_LAUNCH }}
            signingAlgorithm: {{ .IMMICH_OAUTH_SIGNING_ALGORITHM | quote }}
            profileSigningAlgorithm: {{ .IMMICH_OAUTH_PROFILE_SIGNING_ALGORITHM | quote }}
            tokenEndpointAuthMethod: {{ .IMMICH_OAUTH_TOKEN_ENDPOINT_AUTH_METHOD | quote }}
            storageLabelClaim: {{ .IMMICH_OAUTH_STORAGE_LABEL_CLAIM | quote }}
            storageQuotaClaim: {{ .IMMICH_OAUTH_STORAGE_QUOTA_CLAIM | quote }}
            roleClaim: {{ .IMMICH_OAUTH_ROLE_CLAIM | quote }}
            mobileOverrideEnabled: {{ .IMMICH_OAUTH_MOBILE_OVERRIDE_ENABLED }}
            mobileRedirectUri: {{ .IMMICH_OAUTH_MOBILE_REDIRECT_URI | quote }}
  data:
    - secretKey: IMMICH_SERVER_EXTERNAL_DOMAIN
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_SERVER_EXTERNAL_DOMAIN
    - secretKey: IMMICH_OAUTH_ENABLED
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_ENABLED
    - secretKey: IMMICH_OAUTH_ISSUER_URL
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_ISSUER_URL
    - secretKey: IMMICH_OAUTH_CLIENT_ID
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_CLIENT_ID
    - secretKey: IMMICH_OAUTH_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_CLIENT_SECRET
    - secretKey: IMMICH_OAUTH_SCOPE
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_SCOPE
    - secretKey: IMMICH_OAUTH_BUTTON_TEXT
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_BUTTON_TEXT
    - secretKey: IMMICH_OAUTH_AUTO_REGISTER
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_AUTO_REGISTER
    - secretKey: IMMICH_OAUTH_AUTO_LAUNCH
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_AUTO_LAUNCH
    - secretKey: IMMICH_OAUTH_SIGNING_ALGORITHM
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_SIGNING_ALGORITHM
    - secretKey: IMMICH_OAUTH_PROFILE_SIGNING_ALGORITHM
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_PROFILE_SIGNING_ALGORITHM
    - secretKey: IMMICH_OAUTH_TOKEN_ENDPOINT_AUTH_METHOD
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_TOKEN_ENDPOINT_AUTH_METHOD
    - secretKey: IMMICH_OAUTH_STORAGE_LABEL_CLAIM
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_STORAGE_LABEL_CLAIM
    - secretKey: IMMICH_OAUTH_STORAGE_QUOTA_CLAIM
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_STORAGE_QUOTA_CLAIM
    - secretKey: IMMICH_OAUTH_ROLE_CLAIM
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_ROLE_CLAIM
    - secretKey: IMMICH_OAUTH_MOBILE_OVERRIDE_ENABLED
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_MOBILE_OVERRIDE_ENABLED
    - secretKey: IMMICH_OAUTH_MOBILE_REDIRECT_URI
      remoteRef:
        key: twinbox/global/immich
        property: IMMICH_OAUTH_MOBILE_REDIRECT_URI
