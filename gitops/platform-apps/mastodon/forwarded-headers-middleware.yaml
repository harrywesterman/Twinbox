apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mastodon-netbird-forwarded-headers
  namespace: mastodon
  annotations:
    twinbox.io/description: >-
      Keep Mastodon redirects on the public HTTPS origin behind NetBird
      Reverse Proxy.
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Port: "443"
      X-Forwarded-Proto: https
