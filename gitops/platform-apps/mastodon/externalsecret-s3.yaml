apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-s3
  namespace: mastodon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mastodon-s3
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: twinbox/global/velero
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: twinbox/global/velero
        property: password
