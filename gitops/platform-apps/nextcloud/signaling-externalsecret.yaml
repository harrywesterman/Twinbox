apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-signaling-config
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-signaling-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: signaling-secret
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_SIGNALING_SECRET
    - secretKey: internal-secret
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_INTERNAL_SECRET
    - secretKey: session-hash-key
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_SESSION_HASHKEY
    - secretKey: session-block-key
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_SESSION_BLOCKKEY