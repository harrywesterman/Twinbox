apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-mailu-runtime
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-mailu-runtime
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: twinbox/global/mailu-runtime
        property: api-token
