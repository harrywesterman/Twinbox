apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-admin
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: twinbox/global/nextcloud
        property: NEXTCLOUD_ADMIN_USERNAME
    - secretKey: password
      remoteRef:
        key: twinbox/global/nextcloud
        property: NEXTCLOUD_ADMIN_PASSWORD
