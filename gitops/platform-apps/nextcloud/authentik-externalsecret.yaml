apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-authentik
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-authentik
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef:
        key: twinbox/global/authentik
        property: AUTHENTIK_API_TOKEN
