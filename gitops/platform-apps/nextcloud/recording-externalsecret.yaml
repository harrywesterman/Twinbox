apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-recording-config
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-recording-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: recording-secret
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_RECORDING_SECRET
    - secretKey: internal-secret
      remoteRef:
        key: twinbox/global/nextcloud-talk-runtime
        property: TALK_INTERNAL_SECRET