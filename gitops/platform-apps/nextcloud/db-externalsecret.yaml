apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-credentials
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-db-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: twinbox/global/nextcloud
        property: NEXTCLOUD_POSTGRESQL__USERNAME
    - secretKey: password
      remoteRef:
        key: twinbox/global/nextcloud
        property: NEXTCLOUD_POSTGRESQL__PASSWORD
