apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-admin-sync
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-admin-sync
    app.kubernetes.io/part-of: nextcloud
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-admin-sync
            app.kubernetes.io/part-of: nextcloud
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - nextcloud
                      - key: app.kubernetes.io/component
                        operator: In
                        values:
                          - app
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: sync
              image: nextcloud:34.0.3-apache
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -lc
                - |-
                  exec su -s /bin/bash www-data -c /opt/twinbox/sync-nextcloud-admins.sh
              env:
                - name: AUTHENTIK_API_BASE
                  value: http://authentik-server.authentik.svc.cluster.local/api/v3
                - name: AUTHENTIK_ADMINS_GROUP
                  value: admins
                - name: NEXTCLOUD_ADMIN_GROUP
                  value: admin
                - name: NEXTCLOUD_BREAK_GLASS_USER
                  value: admin
                - name: AUTHENTIK_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-admin-sync
                      key: AUTHENTIK_API_TOKEN
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              volumeMounts:
                - name: nextcloud-data
                  mountPath: /var/www/html
                - name: admin-sync-script
                  mountPath: /opt/twinbox/sync-nextcloud-admins.sh
                  subPath: sync-nextcloud-admins.sh
                  readOnly: true
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
            - name: admin-sync-script
              configMap:
                name: nextcloud-admin-sync
                defaultMode: 0555
