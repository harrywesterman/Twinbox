apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-bootstrap
  namespace: openwebui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openwebui-bootstrap
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: twinbox/global/openwebui
        property: WEBUI_SECRET_KEY
    - secretKey: OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: twinbox/global/openwebui
        property: OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
    - secretKey: OAUTH_CLIENT_INFO_ENCRYPTION_KEY
      remoteRef:
        key: twinbox/global/openwebui
        property: OAUTH_CLIENT_INFO_ENCRYPTION_KEY
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: twinbox/global/openwebui
        property: OAUTH_CLIENT_ID
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: twinbox/global/openwebui
        property: OAUTH_CLIENT_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: twinbox/global/openwebui
        property: OPENWEBUI_DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-ai-provider
  namespace: openwebui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openwebui-ai-provider
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: OPENAI_API_BASE_URL
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: OPENAI_API_BASE_URL
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: OPENAI_API_KEY
    - secretKey: DEFAULT_MODELS
      remoteRef:
        key: twinbox/global/twinbox-ai
        property: DEFAULT_MODELS
