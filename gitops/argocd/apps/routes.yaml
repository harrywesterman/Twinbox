apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routes
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      path: routes
      helm:
        valueFiles:
          - $values/gitops/values/routes.yaml
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true