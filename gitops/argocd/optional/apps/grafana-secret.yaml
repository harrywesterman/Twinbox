apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/harrywesterman/Twinbox.git
    targetRevision: main
    path: gitops/apps/grafana-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
