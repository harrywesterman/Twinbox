apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wiredoor-gateway-routes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      path: gitops/optional-routes
      helm:
        valueFiles:
          - $values/gitops/values/optional-routes/wiredoor-gateway.yaml
    - repoURL: https://github.com/harrywesterman/Twinbox.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
