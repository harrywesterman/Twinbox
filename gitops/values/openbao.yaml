global:
  tlsDisable: true

injector:
  enabled: false

csi:
  enabled: false

ui:
  enabled: false

server:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  ha:
    enabled: true
    replicas: __OPENBAO_REPLICAS__
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        seal "static" {
          current_key_id = "__OPENBAO_SEAL_KEY_ID__"
          current_key = "file:///openbao/secrets/current.key"
        }

        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 3Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  volumes:
    - name: openbao-static-seal
      secret:
        secretName: openbao-static-seal
  volumeMounts:
    - name: openbao-static-seal
      mountPath: /openbao/secrets
      readOnly: true
