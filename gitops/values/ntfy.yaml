replicaCount: 1

image:
  repository: binwiederhier/ntfy
  tag: "v2.11.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m

cache:
  enabled: true
  volumeClaimSpec:
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi

config:
  sample:
    cache-duration: "12h"
    keepalive-interval: "45s"
    behind-proxy: true
