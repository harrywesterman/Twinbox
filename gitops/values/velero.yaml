# Rendered into the Velero Argo CD Application by
# scripts/manager/install-velero-backup.sh from the cluster backup-storage profile.

credentials:
  useSecret: true
  existingSecret: __VELERO_SECRET_NAME__

configuration:
  defaultBackupStorageLocation: default
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: __BACKUP_S3_BUCKET__
      default: true
      credential:
        name: __VELERO_SECRET_NAME__
        key: cloud
      caCert: __BACKUP_S3_CA_CERT__
      config:
        region: __BACKUP_S3_REGION__
        s3ForcePathStyle: __BACKUP_S3_PATH_STYLE__
        s3Url: __BACKUP_S3_ENDPOINT__

snapshotsEnabled: false
defaultVolumesToFsBackup: true
deployNodeAgent: true

schedules:
  twinbox-daily:
    disabled: false
    schedule: "0 3 * * *"
    template:
      ttl: 720h
      storageLocation: default

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
