# Rendered into the Velero Argo CD Application by
# scripts/manager/install-velero-backup.sh from /opt/twinbox/bootstrap/secrets/global/velero.json.

credentials:
  useSecret: true
  existingSecret: __VELERO_SECRET_NAME__

configuration:
  defaultBackupStorageLocation: default
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: __SEAWEEDFS_BUCKET__
      default: true
      credential:
        name: __VELERO_SECRET_NAME__
        key: cloud
      config:
        region: __SEAWEEDFS_REGION__
        s3ForcePathStyle: true
        s3Url: __SEAWEEDFS_ENDPOINT__

snapshotsEnabled: false
defaultVolumesToFsBackup: true
deployNodeAgent: true

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
