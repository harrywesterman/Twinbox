replicaCount: 2

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi
  accessMode: ReadWriteOnce

# S3 objectstore as primary storage
objectstore:
  enabled: true
  bucket: nextcloud-data
  hostname: garage-s3.garage.svc.cluster.local
  region: us-east-1
  port: 3900
  accessKey:
    existingSecret: garage-s3-credentials
    accessKeyKey: accesskey
  secretKey:
    existingSecret: garage-s3-credentials
    secretKeyKey: secretkey
  usePathStyle: true

phpClientHttpsFix:
  enabled: true
  protocol: https

ingress:
  enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    backoffLimit: 1
    command:
      - /cron.sh
  env:
    POSTGRES_DB: nextcloud
    POSTGRES_HOST: nextcloud-db-pooler-rw.databases.svc.cluster.local
    POSTGRES_USER:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: username
    POSTGRES_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: password

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

nextcloud:
  host: nextcloud.__ZONE_NAME__
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  env:
    POSTGRES_DB: nextcloud
    POSTGRES_HOST: nextcloud-db-pooler-rw.databases.svc.cluster.local
    POSTGRES_USER:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: username
    POSTGRES_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: password
  defaultConfigs:
    .htaccess: true
    apps.config.php: true
    autoconfig.php: true
    redis.config.php: true
    reverse-proxy.config.php: true
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array(
          0 => 'traefik.traefik.svc.cluster.local',
          1 => '127.0.0.1',
          2 => '10.0.0.0/8',
          3 => '172.16.0.0/12',
          4 => '192.168.0.0/16',
        ),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
      );
    overwrite.config.php: |
      <?php
      $CONFIG = array (
        'overwrite.cli.url' => 'https://nextcloud.__ZONE_NAME__',
      );
  externalDatabase:
    enabled: true
    type: postgresql
    host: nextcloud-db-pooler-rw.databases.svc.cluster.local
    database: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-db-credentials
      usernameKey: username
      passwordKey: password

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: password
  global:
    storageClass: longhorn
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
  replica:
    persistence:
      enabled: false

mariadb:
  enabled: false

postgresql:
  enabled: false

externalRedis:
  enabled: false

# Collabora CODE as subchart
collabora:
  enabled: true
  service:
    type: ClusterIP
  collabora:
    DONT_GEN_SSL_CERT: "true"
    extra_params: "--o:ssl.termination=true --o:ssl.enable=false"
    aliasgroups:
      - hosts:
        - nextcloud.__ZONE_NAME__
    server_name: "collabora.__ZONE_NAME__"
  ingress:
    enabled: false
