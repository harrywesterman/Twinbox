replicaCount: 2

service:
  type: ClusterIP

phpClientHttpsFix:
  enabled: true
  protocol: https

ingress:
  enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    backoffLimit: 1
    command:
      - /cron.sh

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

nextcloud:
  host: nextcloud.bierineenweek.nl
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  defaultConfigs:
    .htaccess: true
    apps.config.php: true
    autoconfig.php: true
    redis.config.php: true
    reverse-proxy.config.php: true
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array(
          0 => 'traefik.traefik.svc.cluster.local',
          1 => '127.0.0.1',
          2 => '10.0.0.0/8',
          3 => '172.16.0.0/12',
          4 => '192.168.0.0/16',
        ),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
      );
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
    nextcloudData:
      enabled: true
      storageClass: longhorn
      size: 50Gi

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-pooler-rw.databases.svc.cluster.local
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-credentials
    usernameKey: username
    passwordKey: password

redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: password
  global:
    storageClass: longhorn
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
  sentinel:
    enabled: true
    quorum: 2

mariadb:
  enabled: false

postgresql:
  enabled: false

externalRedis:
  enabled: false
