replicaCount: 1

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi
  accessMode: ReadWriteOnce

# S3 objectstore is DISABLED for greenfield single-pod setup
objectstore:
  enabled: false

phpClientHttpsFix:
  enabled: true
  protocol: https

ingress:
  enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    backoffLimit: 1
    # The cronjob pod mounts the same RWO PVC (nextcloud-nextcloud) as the
    # main Nextcloud pod, so it must land on the same node.
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nextcloud
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - app
            topologyKey: kubernetes.io/hostname
    command:
      - /bin/sh
      - -lc
      - |-
        exec /cron.sh

livenessProbe:
  enabled: true
  httpGet:
    path: /status.php
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  httpGet:
    path: /status.php
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

nextcloud:
  host: nextcloud.__ZONE_NAME__
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  extraEnv:
    - name: TWINBOX_MAIL_DOMAIN
      value: __ZONE_NAME__
    - name: TWINBOX_MAILU_API_BASE
      value: http://mailu-front.mailu.svc.cluster.local/api/v1
    - name: TWINBOX_MAILU_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: nextcloud-mailu-runtime
          key: api-token
          optional: true
  defaultConfigs:
    .htaccess: true
    apps.config.php: true
    autoconfig.php: true
    redis.config.php: true
    reverse-proxy.config.php: true
    s3.config.php: false
    swift.config.php: false
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array(
          0 => 'traefik.traefik.svc.cluster.local',
          1 => '127.0.0.1',
          2 => '10.0.0.0/8',
          3 => '172.16.0.0/12',
          4 => '192.168.0.0/16',
        ),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
      );
    mail.config.php: |-
      <?php
      $CONFIG = array (
        'app.mail.verify-tls-peer' => false,
      );
    overwrite.config.php: |
      <?php
      $CONFIG = array (
        'overwrite.cli.url' => 'https://nextcloud.__ZONE_NAME__',
      );
internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-pooler-rw.databases.svc.cluster.local
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-credentials
    usernameKey: username
    passwordKey: password

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: password
  global:
    storageClass: longhorn
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
  replica:
    persistence:
      enabled: false

mariadb:
  enabled: false

postgresql:
  enabled: false

externalRedis:
  enabled: false

collabora:
  enabled: true
  securityContext:
    privileged: true
  service:
    type: ClusterIP
  collabora:
    DONT_GEN_SSL_CERT: "true"
    extra_params: "--o:ssl.termination=true --o:ssl.enable=false"
    aliasgroups:
      - host: nextcloud.__ZONE_NAME__
    server_name: "nextcloud-collabora.__ZONE_NAME__"
  ingress:
    enabled: false
