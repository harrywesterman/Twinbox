replicaCount: 1

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi
  accessMode: ReadWriteOnce

# S3 objectstore is DISABLED for greenfield single-pod setup
objectstore:
  enabled: false

phpClientHttpsFix:
  enabled: true
  protocol: https

ingress:
  enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    backoffLimit: 1
    command:
      - /bin/sh
      - -lc
      - |-
        set -euo pipefail
        cd /var/www/html
        if [[ -n "${AUTHENTIK_API_BASE:-}" && -n "${AUTHENTIK_API_TOKEN:-}" ]]; then
          php -r '$apiBase = getenv("AUTHENTIK_API_BASE") ?: ""; $apiToken = getenv("AUTHENTIK_API_TOKEN") ?: ""; if ($apiBase === "" || $apiToken === "") { fwrite(STDERR, "Skipping Nextcloud admin sync: missing Authentik API settings\n"); exit(0); } $headers = "Accept: application/json\r\nAuthorization: Bearer {$apiToken}\r\n"; $context = stream_context_create(["http" => ["header" => $headers, "timeout" => 15]]); $groupsUrl = rtrim($apiBase, "/") . "/core/groups/?page_size=200"; $groupsPayload = @file_get_contents($groupsUrl, false, $context); if ($groupsPayload === false) { fwrite(STDERR, "Skipping Nextcloud admin sync: unable to query Authentik groups\n"); exit(0); } $groupsData = json_decode($groupsPayload, true); if (!is_array($groupsData)) { fwrite(STDERR, "Skipping Nextcloud admin sync: invalid Authentik groups payload\n"); exit(0); } $members = []; foreach (($groupsData["results"] ?? []) as $group) { if (($group["name"] ?? "") !== "admins") { continue; } $candidates = $group["users_obj"] ?? $group["users"] ?? []; foreach ($candidates as $candidate) { $username = null; if (is_array($candidate)) { $username = $candidate["username"] ?? null; if ($username === null && isset($candidate["pk"])) { $userUrl = rtrim($apiBase, "/") . "/core/users/" . rawurlencode((string)$candidate["pk"]) . "/"; $userPayload = @file_get_contents($userUrl, false, $context); if ($userPayload !== false) { $userData = json_decode($userPayload, true); if (is_array($userData)) { $username = $userData["username"] ?? null; } } } } elseif (is_string($candidate) || is_int($candidate)) { $userUrl = rtrim($apiBase, "/") . "/core/users/" . rawurlencode((string)$candidate) . "/"; $userPayload = @file_get_contents($userUrl, false, $context); if ($userPayload !== false) { $userData = json_decode($userPayload, true); if (is_array($userData)) { $username = $userData["username"] ?? null; } } } if (!is_string($username) || $username === "") { continue; } $members[hash("sha256", "1_0_" . $username)] = true; } break; } foreach (array_keys($members) as $userId) { $cmd = "php occ group:adduser admin " . escapeshellarg($userId); passthru($cmd, $status); if ($status !== 0) { fwrite(STDERR, "Nextcloud admin sync could not add {$userId} to admin group\n"); } }' || true
        fi
        exec /cron.sh
    env:
      AUTHENTIK_API_BASE: https://authentik.__ZONE_NAME__/api/v3
      AUTHENTIK_API_TOKEN:
        valueFrom:
          secretKeyRef:
            name: nextcloud-authentik
            key: AUTHENTIK_API_TOKEN
      POSTGRES_DB: nextcloud
      POSTGRES_HOST: nextcloud-db-pooler-rw.databases.svc.cluster.local
      POSTGRES_USER:
        valueFrom:
          secretKeyRef:
          name: nextcloud-db-credentials
          key: username
    POSTGRES_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: password

livenessProbe:
  enabled: true
  httpGet:
    path: /status.php
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  httpGet:
    path: /status.php
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

nextcloud:
  host: nextcloud.__ZONE_NAME__
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  env:
    POSTGRES_DB: nextcloud
    POSTGRES_HOST: nextcloud-db-pooler-rw.databases.svc.cluster.local
    APACHE_SERVER_NAME: nextcloud.__ZONE_NAME__
    POSTGRES_USER:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: username
    POSTGRES_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nextcloud-db-credentials
          key: password
  defaultConfigs:
    .htaccess: true
    apps.config.php: true
    autoconfig.php: true
    redis.config.php: true
    reverse-proxy.config.php: true
    s3.config.php: false
    swift.config.php: false
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array(
          0 => 'traefik.traefik.svc.cluster.local',
          1 => '127.0.0.1',
          2 => '10.0.0.0/8',
          3 => '172.16.0.0/12',
          4 => '192.168.0.0/16',
        ),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
      );
    overwrite.config.php: |
      <?php
      $CONFIG = array (
        'overwrite.cli.url' => 'https://nextcloud.__ZONE_NAME__',
      );
  externalDatabase:
    enabled: true
    type: postgresql
    host: nextcloud-db-pooler-rw.databases.svc.cluster.local
    database: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-db-credentials
      usernameKey: username
      passwordKey: password

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: password
  global:
    storageClass: longhorn
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
  replica:
    persistence:
      enabled: false

mariadb:
  enabled: false

postgresql:
  enabled: false

externalRedis:
  enabled: false

collabora:
  enabled: true
  service:
    type: ClusterIP
  collabora:
    DONT_GEN_SSL_CERT: "true"
    extra_params: "--o:ssl.termination=true --o:ssl.enable=false"
    aliasgroups:
      - host: nextcloud.__ZONE_NAME__
    server_name: "collabora.__ZONE_NAME__"
  ingress:
    enabled: false
