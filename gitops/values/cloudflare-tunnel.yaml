cloudflare:
  account: ""
  tunnelName: ""
  tunnelId: ""
  secret: ""
  enableWarp: false
  ingress: []

replicaCount: 2

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
