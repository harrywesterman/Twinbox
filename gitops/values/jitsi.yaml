fullnameOverride: jitsi

enableAuth: true
enableGuests: true

web:
  ingress:
    enabled: false
  gateway:
    enabled: false
  custom:
    configs:
      _custom_config_js: |
        config.enableUserRolesBasedOnToken = true;

websockets:
  colibri:
    enabled: true
  xmpp:
    enabled: true

prosody:
  jwt:
    existingSecretName: jitsi-auth

extraCommonEnvs:
  AUTH_TYPE: "jwt"
  ENABLE_AUTO_OWNER: "0"
  ENABLE_LOBBY: "1"
  JWT_ACCEPTED_AUDIENCES: "jitsi"
  JWT_ACCEPTED_ISSUERS: "jitsi"
  JWT_ALLOW_EMPTY: "1"
  JWT_APP_ID: "jitsi"
  WAIT_FOR_HOST_DISABLE_AUTO_OWNERS: "1"
  XMPP_MODULES: "persistent_lobby,frozen_nick"
  XMPP_MUC_MODULES: "muc_wait_for_host,token_affiliation,token_no_wildcard"

jicofo:
  xmpp:
    existingSecretName: jitsi-auth
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: 8888
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: 8888
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

jvb:
  useHostPort: true
  useNodeIP: true
  xmpp:
    existingSecretName: jitsi-auth
  nodeSelector:
    twinbox.io/role: worker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /about/health
      port: 8080
    initialDelaySeconds: 90
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /about/health
      port: 8080
    initialDelaySeconds: 45
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  service:
    enabled: false
