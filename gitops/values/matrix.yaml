postgres:
  enabled: false

synapse:
  externalPostgres:
    host: matrix-synapse-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_synapse
    username:
      valueFrom:
        secretKeyRef:
          name: matrix-synapse-db-credentials
          key: username
    password:
      valueFrom:
        secretKeyRef:
          name: matrix-synapse-db-credentials
          key: password
  media:
    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 20Gi

matrixAuthenticationService:
  externalPostgres:
    host: matrix-mas-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_mas
    username:
      valueFrom:
        secretKeyRef:
          name: matrix-mas-db-credentials
          key: username
    password:
      valueFrom:
        secretKeyRef:
          name: matrix-mas-db-credentials
          key: password
  additional:
    mas-config.yaml:
      config: |
        upstream_oauth2:
          providers:
            - id: __MAS_OIDC_PROVIDER_ULID__
              issuer: "https://authentik.__ZONE_NAME__"
              human_name: Authentik
              client_id: __MAS_OIDC_CLIENT_ID__
              client_secret: __MAS_OIDC_CLIENT_SECRET__
              token_endpoint_auth_method: client_secret_post
              scope: "openid email profile"
              claims_imports:
                localpart:
                  action: force
                  template: "{{ user.preferred_username }}"
                displayname:
                  action: suggest
                  template: "{{ user.name }}"
                email:
                  action: suggest
                  template: "{{ user.email }}"

elementWeb:
  additional:
    user-config.json: |
      {
        "default_server_config": {
          "m.homeserver": {
            "base_url": "https://matrix.__ZONE_NAME__"
          }
        }
      }

elementAdmin:
  enabled: true

matrixRTC:
  sfu:
    enabled: true
    useStunToDiscoverPublicIP: true

ingress:
  enabled: false

wellknownDelegation:
  ingress:
    enabled: false
