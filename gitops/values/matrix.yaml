postgres:
  enabled: false

ingress:
  className: twinbox-disabled

initSecrets:
  resources:
    requests:
      memory: 50Mi
      cpu: 10m
    limits:
      memory: 200Mi

deploymentMarkers:
  resources:
    requests:
      memory: 50Mi
      cpu: 10m
    limits:
      memory: 200Mi

haproxy:
  resources:
    requests:
      memory: 100Mi
      cpu: 10m
    limits:
      memory: 200Mi

synapse:
  checkConfigHook:
    resources:
      requests:
        memory: 50Mi
        cpu: 10m
      limits:
        memory: 200Mi
  postgres:
    host: matrix-synapse-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_synapse
    user: matrix_synapse
    password:
      secret: matrix-synapse-db-credentials
      secretKey: password
  media:
    storage:
      size: 20Gi
      storageClassName: longhorn
    maxUploadSize: 100M

matrixAuthenticationService:
  encryptionSecret:
    secret: matrix-runtime
    secretKey: MAS_ENCRYPTION_SECRET
  synapseSharedSecret:
    secret: matrix-runtime
    secretKey: SYNAPSE_SHARED_SECRET
  postgres:
    host: matrix-mas-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_mas
    user: matrix_mas
    password:
      secret: matrix-mas-db-credentials
      secretKey: password

elementAdmin:
  enabled: true

matrixRTC:
  sfu:
    enabled: true
    # Advertise the node IP (Host IP mode) instead of the STUN-discovered
    # public IP. The cluster sits behind a home router whose RTC NodePorts
    # (30001/TCP, 30002/UDP) are not forwarded from the internet, so a
    # public IP candidate is unreachable for clients on the same LAN
    # (hairpin NAT fails for macOS mDNS-obfuscated host candidates).
    useStunToDiscoverPublicIP: false
    exposedServices:
      turnTLS:
        enabled: true
        # Advertised to clients as turn.<zone>:443 so media can traverse the
        # NetBird proxy on port 443 (looks like HTTPS) for off-LAN callers.
        # domain is templated per-zone in the ApplicationSet inline values.
        tlsTerminationOnPod: true
        tlsSecret: matrix-turn-tls

wellKnownDelegation:
  enabled: true
