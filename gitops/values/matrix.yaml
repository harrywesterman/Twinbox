postgres:
  enabled: false

ingress:
  className: twinbox-disabled

initSecrets:
  resources:
    requests:
      memory: 50Mi
      cpu: 10m
    limits:
      memory: 200Mi

deploymentMarkers:
  resources:
    requests:
      memory: 50Mi
      cpu: 10m
    limits:
      memory: 200Mi

haproxy:
  resources:
    requests:
      memory: 100Mi
      cpu: 10m
    limits:
      memory: 200Mi

synapse:
  checkConfigHook:
    resources:
      requests:
        memory: 50Mi
        cpu: 10m
      limits:
        memory: 200Mi
  postgres:
    host: matrix-synapse-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_synapse
    user: matrix_synapse
    password:
      secret: matrix-synapse-db-credentials
      secretKey: password
  media:
    storage:
      size: 20Gi
      storageClassName: longhorn
    maxUploadSize: 100M

matrixAuthenticationService:
  encryptionSecret:
    secret: matrix-runtime
    secretKey: MAS_ENCRYPTION_SECRET
  synapseSharedSecret:
    secret: matrix-runtime
    secretKey: SYNAPSE_SHARED_SECRET
  postgres:
    host: matrix-mas-db-pooler-rw.databases.svc.cluster.local
    port: 5432
    database: matrix_mas
    user: matrix_mas
    password:
      secret: matrix-mas-db-credentials
      secretKey: password

elementAdmin:
  enabled: true

matrixRTC:
  sfu:
    enabled: true
    useStunToDiscoverPublicIP: true

wellKnownDelegation:
  enabled: true
