controllers:
  main:
    containers:
      main:
        image:
          tag: v2.7.5
        env:
          DB_HOSTNAME: immich-db-pooler-rw.databases.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: password
          DB_DATABASE_NAME: immich
          DB_VECTOR_EXTENSION: vectorchord
          REDIS_HOSTNAME: immich-valkey
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003

immich:
  metrics:
    enabled: false
  configurationKind: Secret
  existingConfiguration: immich-config
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: longhorn

server:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          probes:
            startup:
              spec:
                failureThreshold: 60
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: true
