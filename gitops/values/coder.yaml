coderd:
  extraEnvs:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: coder-oidc
          key: client_id
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-oidc
          key: client_secret
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
  serviceSpec:
    type: NodePort
  builtinProviderServiceAccount:
    workspacePerms: true
    workspaceNamespaces:
      - name: coder-workspaces
ingress:
  enable: false
