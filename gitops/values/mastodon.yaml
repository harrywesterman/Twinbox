image:
  repository: ghcr.io/mastodon/mastodon
  tag: v4.6.0

mastodon:
  createAdmin:
    enabled: false
  hooks:
    dbPrepare:
      enabled: false
    dbMigrate:
      enabled: true
  locale: en
  singleUserMode: false
  authorizedFetch: false
  limitedFederationMode: false
  secrets:
    existingSecret: mastodon-runtime
  s3:
    enabled: true
    existingSecret: mastodon-s3
    bucket: mastodon
    endpoint: http://seaweedfs.longhorn-system.svc.cluster.local:8333
    protocol: http
    region: seaweedfs
    permission: public-read
  smtp:
    auth_method: plain
    delivery_method: smtp
    enable_starttls: "auto"
    existingSecret: mastodon-smtp
    openssl_verify_mode: none
    port: 25
    server: mailu-front.mailu.svc.cluster.local
    tls: false

postgresql:
  enabled: false
  auth:
    database: mastodon
    username: mastodon
    existingSecret: mastodon-runtime
  postgresqlHostname: mastodon-db-pooler-rw-session.databases.svc.cluster.local
  postgresqlPort: 5432
  direct:
    hostname: mastodon-db-rw.databases.svc.cluster.local
    port: 5432
    database: mastodon

redis:
  enabled: false
  hostname: mastodon-redis.mastodon.svc.cluster.local
  port: 6379
  auth:
    existingSecret: mastodon-runtime
    existingSecretKey: REDIS_PASSWORD

ingress:
  enabled: false
  streaming:
    enabled: false

httproute:
  enabled: false
