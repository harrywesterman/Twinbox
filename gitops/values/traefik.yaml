deployment:
  replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  spec:
    type: ClusterIP

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
  file:
    enabled: true
    watch: true
    content: |
      http:
        middlewares:
          cloudflarewarp:
            plugin:
              cloudflarewarp:
                disableDefault: false
          crowdsec:
            plugin:
              bouncer:
                enabled: true
                crowdsecMode: stream
                crowdsecLapiScheme: http
                crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
                crowdsecLapiKeyFile: /run/secrets/crowdsec/lapi-key

experimental:
  plugins:
    cloudflarewarp:
      moduleName: github.com/BetterCorp/cloudflarewarp
      version: v1.3.3
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.6.0

additionalArguments:
  - --entryPoints.web.http.middlewares=cloudflarewarp@file,crowdsec@file
  - --entryPoints.websecure.http.middlewares=cloudflarewarp@file,crowdsec@file

volumes:
  - name: traefik-crowdsec-bouncer
    mountPath: /run/secrets/crowdsec
    type: secret

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-external

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http:
      tls:
        enabled: true

  webwiredoor:
    port: 8081
    expose:
      default: true
    exposedPort: 8081
    protocol: TCP

  webtailscale:
    port: 8090
    expose:
      default: true
    exposedPort: 8090
    protocol: TCP

api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
