preUpgradeChecker:
  jobEnabled: false

global:
  nodeSelector:
    twinbox.io/role: worker

defaultSettings:
  nodeDrainPolicy: allow-if-replica-is-stopped
  detachManuallyAttachedVolumesWhenCordoned: true
  createDefaultDiskLabeledNodes: true
  systemManagedComponentsNodeSelector: twinbox.io/role=worker
  defaultReplicaCount: 2
  # Twinbox defaults to two replicas for homelab HA without tripling every
  # single-pod PVC. Dedicated worker disks can run closer to full, but we still
  # keep a small free-space floor for snapshots and replica churn.
  storageOverProvisioningPercentage: "300"
  storageReservedPercentageForDefaultDisk: "10"
  storageMinimalAvailablePercentage: "10"
  systemManagedCSIComponentsResourceLimits: >-
    {
      "csi-attacher":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-provisioner":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-resizer":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-snapshotter":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"128Mi"},"limits":{"cpu":"300m","memory":"256Mi"}},
      "node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},
      "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}}
    }

longhornManager:
  nodeSelector:
    twinbox.io/role: worker
  tolerations: []
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

longhornUI:
  nodeSelector:
    twinbox.io/role: worker
  tolerations: []

longhornDriver:
  nodeSelector:
    twinbox.io/role: worker

persistence:
  defaultClassReplicaCount: 2
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"default","isGroup":true}]'
  defaultNodeSelector:
    enable: false
    selector: ""

defaultBackupStore:
  backupTarget: __LONGHORN_BACKUP_TARGET__
  backupTargetCredentialSecret: __LONGHORN_BACKUP_SECRET_NAME__
  pollInterval: "300"
