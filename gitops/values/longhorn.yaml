preUpgradeChecker:
  jobEnabled: false

global:
  nodeSelector:
    twinbox.io/role: worker

defaultSettings:
  createDefaultDiskLabeledNodes: true
  systemManagedComponentsNodeSelector: twinbox.io/role=worker
  # Twinbox keeps three replicas for HA and allows roomy thin-provisioned PVCs.
  # Longhorn still refuses writes once real free space drops below this guard.
  storageOverProvisioningPercentage: "300"
  storageReservedPercentageForDefaultDisk: "10"
  storageMinimalAvailablePercentage: "20"
  systemManagedCSIComponentsResourceLimits: >-
    {
      "csi-attacher":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-provisioner":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-resizer":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "csi-snapshotter":{"requests":{"cpu":"20m","memory":"64Mi"},"limits":{"cpu":"200m","memory":"128Mi"}},
      "longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"128Mi"},"limits":{"cpu":"300m","memory":"256Mi"}},
      "node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},
      "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}}
    }

longhornManager:
  nodeSelector:
    twinbox.io/role: worker
  tolerations: []
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

longhornUI:
  nodeSelector:
    twinbox.io/role: worker
  tolerations: []

longhornDriver:
  nodeSelector:
    twinbox.io/role: worker

persistence:
  defaultNodeSelector:
    enable: false
    selector: ""
