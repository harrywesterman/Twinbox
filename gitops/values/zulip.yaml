zulip:
  environment:
    SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS
    SECRETS_secret_key:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SECRETS_secret_key
    ZULIP_DEFAULT_REALM_OWNER_EMAIL:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: ZULIP_DEFAULT_REALM_OWNER_EMAIL
    ZULIP_DEFAULT_REALM_OWNER_NAME:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: ZULIP_DEFAULT_REALM_OWNER_NAME
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn

postSetup:
  scripts:
    10-create-default-realm.sh: |
      #!/usr/bin/env bash
      set -euo pipefail

      realm_name="${ZULIP_DEFAULT_REALM_NAME:-Twinbox}"
      owner_name="${ZULIP_DEFAULT_REALM_OWNER_NAME:-Twinbox Admin}"
      owner_email="${ZULIP_DEFAULT_REALM_OWNER_EMAIL:-${SETTING_ZULIP_ADMINISTRATOR:-admin@${SETTING_EXTERNAL_HOST}}}"

      realm_exists="$(
        su zulip -c "cd /home/zulip/deployments/current && ./manage.py shell -c 'from zerver.models import Realm; print(\"yes\" if Realm.objects.filter(string_id=\"\").exists() else \"no\")'" | tail -n1
      )"
      if [[ "$realm_exists" != "yes" ]]; then
        su zulip -c "cd /home/zulip/deployments/current && ./manage.py create_realm --automated --string-id= \"$realm_name\" \"$owner_email\" \"$owner_name\""
        echo "Created default Zulip organization: ${realm_name}"
      else
        echo "Default Zulip organization already exists"
      fi

      cat > /tmp/zulip-bootstrap.py <<PY
      from zerver.actions.default_streams import do_add_default_stream
      from zerver.lib.onboarding import send_initial_realm_messages
      from zerver.lib.streams import ensure_stream
      from zerver.models import DefaultStream, OnboardingUserMessage, Realm, Stream

      realm = Realm.objects.get(string_id="")
      desired_jitsi_server_url = "https://${SETTING_EXTERNAL_HOST/zulip./jitsi.}"

      update_fields = []
      if realm.jitsi_server_url != desired_jitsi_server_url:
          realm.jitsi_server_url = desired_jitsi_server_url
          update_fields.append("jitsi_server_url")

      desired_video_chat_provider = Realm.VIDEO_CHAT_PROVIDERS["jitsi_meet"]["id"]
      if realm.video_chat_provider != desired_video_chat_provider:
          realm.video_chat_provider = desired_video_chat_provider
          update_fields.append("video_chat_provider")

      if update_fields:
          realm.save(update_fields=update_fields)

      streams = {
          "general": "General conversation for the Twinbox cluster.",
          "announcements": "Announcements and release notes for Twinbox.",
          "support": "Questions, setup help, and troubleshooting.",
      }

      for stream_name, stream_description in streams.items():
          stream = ensure_stream(
              realm, stream_name, stream_description=stream_description, acting_user=None
          )
          do_add_default_stream(stream)

      if not OnboardingUserMessage.objects.filter(realm_id=realm.id).exists():
          send_initial_realm_messages(realm)

      required_default_streams = sorted(streams)
      missing_default_streams = [
          stream_name
          for stream_name in required_default_streams
          if not DefaultStream.objects.filter(realm=realm, stream__name=stream_name).exists()
      ]
      if missing_default_streams:
          raise SystemExit(f"Missing default streams: {', '.join(missing_default_streams)}")

      missing_streams = [
          stream_name
          for stream_name in required_default_streams
          if not Stream.objects.filter(realm=realm, name=stream_name).exists()
      ]
      if missing_streams:
          raise SystemExit(f"Missing streams: {', '.join(missing_streams)}")

      print("Zulip bootstrap streams and onboarding are present")
      PY

      su zulip -c "cd /home/zulip/deployments/current && ./manage.py shell < /tmp/zulip-bootstrap.py"

postgresql:
  enabled: false

startupProbe:
  failureThreshold: 120
  periodSeconds: 10
  initialDelaySeconds: 10
  timeoutSeconds: 10

externalPostgresql:
  host: zulip-db-pooler-rw.databases.svc.cluster.local
  port: 5432
  database: zulip
  user: zulip
  password:
    valueFrom:
      secretKeyRef:
        name: zulip-db-credentials
        key: password

ingress:
  enabled: false

service:
  type: ClusterIP
