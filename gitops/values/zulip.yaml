global:
  security:
    allowInsecureImages: true

zulip:
  environment:
    SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS
    SECRETS_secret_key:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SECRETS_secret_key
    ZULIP_DEFAULT_REALM_OWNER_EMAIL:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: ZULIP_DEFAULT_REALM_OWNER_EMAIL
    ZULIP_DEFAULT_REALM_OWNER_NAME:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: ZULIP_DEFAULT_REALM_OWNER_NAME
    SETTING_EMAIL_HOST:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_EMAIL_HOST
    SETTING_EMAIL_PORT:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_EMAIL_PORT
    SETTING_EMAIL_USE_TLS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_EMAIL_USE_TLS
    SETTING_EMAIL_HOST_USER:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_EMAIL_HOST_USER
    SECRETS_email_password:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SECRETS_email_password
    SETTING_NOREPLY_EMAIL_ADDRESS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_NOREPLY_EMAIL_ADDRESS
    SETTING_TOKENIZED_NOREPLY_EMAIL_ADDRESS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_TOKENIZED_NOREPLY_EMAIL_ADDRESS
    SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS:
      valueFrom:
        secretKeyRef:
          name: zulip-config
          key: SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS
    SETTING_EXTERNAL_HOST: zulip.bierineenweek.nl
    SETTING_ZULIP_ADMINISTRATOR: admin@zulip.bierineenweek.nl
    SETTING_SOCIAL_AUTH_REDIRECT_IS_HTTPS: "True"
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: longhorn

memcached:
  fips:
    openssl: "off"
  image:
    registry: registry-1.docker.io
    repository: bitnamilegacy/memcached
    tag: 1.6.39-debian-12-r0
  auth:
    enabled: true
    username: zulip@localhost
    usePasswordFiles: false
  containerSecurityContext:
    readOnlyRootFilesystem: false

postSetup:
  scripts:
    04-disable-sslmode.sh: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Disable SSL mode for PostgreSQL (PgBouncer doesn't handle SSL correctly)
      sed -i "s/REMOTE_POSTGRES_SSLMODE = 'prefer'/REMOTE_POSTGRES_SSLMODE = 'disable'/" /etc/zulip/settings.py
    05-patch-uwsgi.sh: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Disable lazy loading — load all uwsgi workers at startup so that
      # kubelet probes do not time out on the first request to a new worker.
      sed -i 's/lazy-apps=true/lazy-apps=false/' /etc/zulip/uwsgi.ini
      # Lengthen harakiri (max request time) so 6 workers can all
      # initialize their Django application without being killed.
      sed -i 's/harakiri=55/harakiri=120/' /etc/zulip/uwsgi.ini
      # nginx uwsgi_read_timeout must always exceed harakiri.
      sed -i 's/uwsgi_read_timeout 60s;/uwsgi_read_timeout 125s;/' /etc/nginx/uwsgi_params
      # With lazy-apps=false the app is loaded before hook-post-fork runs,
      # so chdir must point at the deployment directory from the start.
      sed -i 's|^chdir=/|chdir=/home/zulip/deployments/current|' /etc/zulip/uwsgi.ini
    10-create-default-realm.sh: |
      #!/usr/bin/env bash
      set -euo pipefail

      realm_name="${ZULIP_DEFAULT_REALM_NAME:-Twinbox}"
      owner_name="${ZULIP_DEFAULT_REALM_OWNER_NAME:-Twinbox Admin}"
      owner_email="${ZULIP_DEFAULT_REALM_OWNER_EMAIL:-${SETTING_ZULIP_ADMINISTRATOR:-admin@${SETTING_EXTERNAL_HOST}}}"

      realm_exists="$(
        su zulip -c "cd /home/zulip/deployments/current && ./manage.py shell -c 'from zerver.models import Realm; print(\"yes\" if Realm.objects.filter(string_id=\"\").exists() else \"no\")'" | tail -n1
      )"
      if [[ "$realm_exists" != "yes" ]]; then
        su zulip -c "cd /home/zulip/deployments/current && ./manage.py create_realm --automated --string-id= \"$realm_name\" \"$owner_email\" \"$owner_name\""
        echo "Created default Zulip organization: ${realm_name}"
      else
        echo "Default Zulip organization already exists"
      fi

      cat > /tmp/zulip-bootstrap.py <<PY
      from zerver.actions.default_streams import do_add_default_stream
      from zerver.lib.onboarding import send_initial_realm_messages
      from zerver.lib.streams import ensure_stream
      from zerver.models import DefaultStream, OnboardingUserMessage, Realm, Stream

      realm = Realm.objects.get(string_id="")
      desired_jitsi_server_url = "https://${SETTING_EXTERNAL_HOST/zulip./jitsi.}"

      update_fields = []
      if realm.jitsi_server_url != desired_jitsi_server_url:
          realm.jitsi_server_url = desired_jitsi_server_url
          update_fields.append("jitsi_server_url")

      desired_video_chat_provider = Realm.VIDEO_CHAT_PROVIDERS["jitsi_meet"]["id"]
      if realm.video_chat_provider != desired_video_chat_provider:
          realm.video_chat_provider = desired_video_chat_provider
          update_fields.append("video_chat_provider")

      # Allow any Authentik-authenticated user to sign up without invitation
      if hasattr(realm, "invite_required") and realm.invite_required:
          realm.invite_required = False
          update_fields.append("invite_required")

      if update_fields:
          realm.save(update_fields=update_fields)

      streams = {
          "general": "General conversation for the Twinbox cluster.",
          "announcements": "Announcements and release notes for Twinbox.",
          "support": "Questions, setup help, and troubleshooting.",
      }

      for stream_name, stream_description in streams.items():
          stream = ensure_stream(
              realm, stream_name, stream_description=stream_description, acting_user=None
          )
          do_add_default_stream(stream)

      if not OnboardingUserMessage.objects.filter(realm_id=realm.id).exists():
          send_initial_realm_messages(realm)

      required_default_streams = sorted(streams)
      missing_default_streams = [
          stream_name
          for stream_name in required_default_streams
          if not DefaultStream.objects.filter(realm=realm, stream__name=stream_name).exists()
      ]
      if missing_default_streams:
          raise SystemExit(f"Missing default streams: {', '.join(missing_default_streams)}")

      missing_streams = [
          stream_name
          for stream_name in required_default_streams
          if not Stream.objects.filter(realm=realm, name=stream_name).exists()
      ]
      if missing_streams:
          raise SystemExit(f"Missing streams: {', '.join(missing_streams)}")

      print("Zulip bootstrap streams and onboarding are present")
      PY

      su zulip -c "cd /home/zulip/deployments/current && ./manage.py shell < /tmp/zulip-bootstrap.py"

postgresql:
  enabled: false

startupProbe:
  failureThreshold: 120
  periodSeconds: 10
  initialDelaySeconds: 10
  timeoutSeconds: 60

livenessProbe:
  # /health does a memcached roundtrip. bmemcached has a known intermittent
  # protocol race (struct.error) that can briefly 500 /health even though
  # memcached itself is healthy. A low failureThreshold would let that
  # transient blip kill the pod and trigger a ~10-minute full re-config
  # restart. Tolerate it so a memcached blip does not take Zulip down.
  failureThreshold: 15
  periodSeconds: 10
  initialDelaySeconds: 10
  timeoutSeconds: 10

externalPostgresql:
  host: zulip-db-pooler-rw.databases.svc.cluster.local
  port: 5432
  database: zulip
  user: zulip
  password:
    valueFrom:
      secretKeyRef:
        name: zulip-db-credentials
        key: password

ingress:
  enabled: false

service:
  type: ClusterIP
